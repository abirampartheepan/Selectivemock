'use strict';

/* ---- column graph with a missing pair of bars ---- */
defMaths({ id: 'm-graph-missing', slot: 'graph', topic: 'column graphs', fam: 'Data and chance',
  gen(R, level) {
    const total = byLevel(level, R.int(6, 10) * 5, R.int(8, 14) * 5, R.int(10, 20) * 5);
    const labels = ['0', '1', '2', '3', '4'];
    const k = byLevel(level, 2, 3, R.pick([2, 3]));
    const b = R.int(1, byLevel(level, 4, 4, 5)); // count for "3 pets"
    const a = k * b; // count for "2 pets"
    const rest = total - a - b;
    if (rest < 6) return this.gen(R, level);
    // split rest over 0, 1, 4
    const r0 = R.int(1, rest - 2), r1 = R.int(1, rest - r0 - 1), r4 = rest - r0 - r1;
    if (r4 < 1 || Math.max(r0, r1, r4) > 20) return this.gen(R, level);
    const vals = [r0, r1, null, null, r4];
    const pic = barChart(labels, vals, { xLabel: 'number of pets', yLabel: 'children', max: Math.max(r0, r1, r4, a), step: byLevel(level, 1, 2, 2) });
    const ask2 = R.chance(0.5);
    const ans = ask2 ? a : b;
    const built = numOpts(R, ans, [
      { v: ask2 ? b : a, why: 'answers for the other missing bar', tag: 'misread' },
      { v: a + b, why: 'gives the two missing bars together', tag: 'part-only' },
      { v: Math.round((a + b) / 2), why: 'shares the missing children equally', tag: 'misread' },
      { v: ans + 2, why: 'misreads a bar', tag: 'slip' },
    ], { min: 1 });
    return item(`${total} children were asked how many pets they have. The column graph shows the results, but the bars for two and three pets are missing. The number of children with two pets is ${k === 2 ? 'twice' : 'three times'} the number with three pets. How many children have ${ask2 ? 'two' : 'three'} pets?`, built,
      explainWith(`The bars shown add to ${rest}, so ${total - rest} children have two or three pets. Splitting ${total - rest} in the ratio ${k} : 1 gives ${a} with two pets and ${b} with three.`, built), { svg: pic });
  } });

/* ---- line graph statements ---- */
defMaths({ id: 'm-graph-line', slot: 'graph', topic: 'line graphs', fam: 'Data and chance',
  gen(R, level) {
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug'];
    const n = byLevel(level, 6, 7, 8);
    const xs = months.slice(0, n);
    const hi = [R.int(18, 30)]; for (let i = 1; i < n; i++) hi.push(Math.max(8, Math.min(40, hi[i - 1] + R.int(-6, 6))));
    const lo = hi.map(h => h - R.int(4, 12));
    const series = [{ name: 'highest', vals: hi }, { name: 'lowest', vals: lo, dash: true }];
    const pic = lineChart(xs, series, { min: Math.min.apply(null, lo) < 0 ? -10 : 0, step: 5 });
    const i1 = R.int(0, n - 1), i2 = R.int(0, n - 1);
    const s1v = hi[i1] > 2 * lo[i2];
    const s1 = { t: `The highest temperature in ${xs[i1]} was more than twice the lowest temperature in ${xs[i2]}.`, v: s1v };
    const gaps = hi.map((h, i) => h - lo[i]);
    const gi = gaps.indexOf(Math.max.apply(null, gaps));
    const claimI = R.chance(0.5) ? gi : R.int(0, n - 1);
    const s2 = { t: `The biggest difference between the highest and lowest temperatures was in ${xs[claimI]}.`, v: gaps[claimI] === gaps[gi] };
    const j = R.int(0, n - 2);
    const rise = hi[j + 1] - hi[j];
    const claim = rise + (R.chance(0.5) ? 0 : R.pick([-2, 2, 3]));
    const s3 = { t: `The highest temperature ${claim >= 0 ? 'rose' : 'fell'} by ${Math.abs(claim)} degrees from ${xs[j]} to ${xs[j + 1]}.`, v: claim === rise && claim !== 0 };
    const built = statementOpts(R, [s1.v, s2.v, s3.v], ['1', '2', '3']);
    return item(`The graph shows the highest and lowest temperatures (°C) recorded in a town each month. Which of these statements is/are correct?<br>1&nbsp; ${s1.t}<br>2&nbsp; ${s2.t}<br>3&nbsp; ${s3.t}`, built,
      `Read the values from the graph: highest ${hi.join(', ')}; lowest ${lo.join(', ')}. Statement 1 is ${s1.v ? 'true' : 'false'}, statement 2 is ${s2.v ? 'true' : 'false'} and statement 3 is ${s3.v ? 'true' : 'false'}.`, { svg: pic });
  } });

/* ---- two-way table ---- */
defMaths({ id: 'm-two-way', slot: 'graph', topic: 'tables', fam: 'Data and chance',
  gen(R, level) {
    const rows = ['Year 5', 'Year 6'], cols = R.pick([['soccer', 'netball', 'swimming'], ['art', 'music', 'drama'], ['bus', 'car', 'walk']]);
    const t = rows.map(() => cols.map(() => R.int(4, 25)));
    const hide = byLevel(level, 1, 2, 3);
    const totalsR = t.map(r => sum(r)), totalsC = cols.map((_, j) => t[0][j] + t[1][j]), grand = sum(totalsR);
    const grid = [[''].concat(cols, ['total'])].concat(rows.map((r, i) => [r].concat(t[i].map(String), [String(totalsR[i])])), [['total'].concat(totalsC.map(String), [String(grand)])]);
    // choose cells to hide (in the body), ask for one
    const cells = R.sample([[1, 1], [1, 2], [1, 3], [2, 1], [2, 2], [2, 3]], hide);
    cells.forEach(([r, c]) => { grid[r][c] = '?'; });
    // make sure the asked cell is solvable: hide only one per row and per column, which keeps every cell recoverable
    const okRows = new Set(cells.map(c => c[0])).size === cells.length, okCols = new Set(cells.map(c => c[1])).size === cells.length;
    if (!okRows && !okCols) return this.gen(R, level);
    const [ar, ac] = cells[0];
    const ans = t[ar - 1][ac - 1];
    const built = numOpts(R, ans, [
      { v: totalsC[ac - 1] - ans, why: 'gives the other year group', tag: 'misread' },
      { v: totalsR[ar - 1] - ans, why: 'gives the rest of the row', tag: 'misread' },
      { v: ans + 1, why: 'is an arithmetic slip', tag: 'slip' },
      { v: ans - 2, why: 'is an arithmetic slip', tag: 'slip' },
    ], { min: 0 });
    const table = { caption: 'Students\' choices', head: grid[0], rows: grid.slice(1) };
    return item(`The table shows the choices made by students in Years 5 and 6. Some numbers are missing. How many ${rows[ar - 1]} students chose ${cols[ac - 1]}?`, built,
      explainWith(`Use the totals: the ${rows[ar - 1]} row adds to ${totalsR[ar - 1]} and the ${cols[ac - 1]} column adds to ${totalsC[ac - 1]}. The missing number is ${ans}.`, built), { table });
  } });

/* ---- probability from a bag / spinner ---- */
defMaths({ id: 'm-probability', slot: 'probability', topic: 'probability', fam: 'Data and chance',
  gen(R, level) {
    const v = byLevel(level, R.int(0, 1), R.int(0, 2), R.int(1, 2));
    const who = name1(R);
    if (v === 0) {
      const total = R.pick([20, 24, 30, 36, 40, 48]);
      const [pn, pd] = R.pick([[1, 2], [1, 3], [1, 4], [1, 6], [2, 5], [3, 8], [1, 5]].filter(([a, b]) => total % b === 0));
      const red = total * pn / pd;
      const blue = R.int(2, total - red - 2);
      const yellow = total - red - blue;
      const built = numOpts(R, yellow, [
        { v: total - blue, why: 'forgets to take away the red marbles', tag: 'part-only' },
        { v: red, why: 'gives the number of red marbles', tag: 'misread' },
        { v: total - red, why: 'forgets to take away the blue marbles', tag: 'part-only' },
        { v: Math.abs(total - blue - pn), why: 'subtracts the top of the fraction instead of the number of red marbles', tag: 'misread' },
      ], { min: 0 });
      return item(`${who} has a bag of ${total} marbles. Some are blue, some are red and the rest are yellow. There are ${blue} blue marbles. If ${who} takes out a marble without looking, the probability that it is red is ${pn}/${pd}. How many yellow marbles are in the bag?`, built,
        explainWith(`${pn}/${pd} of ${total} is ${red} red marbles. Yellow: ${total} − ${blue} − ${red} = ${yellow}.`, built));
    }
    if (v === 1) {
      // decimals probability with ratio
      const pc = R.pick([0.1, 0.2, 0.3]), pg = R.pick([0.05, 0.1, 0.15]);
      const k = R.pick([2, 3]);
      const ps = round6(pg * k);
      const ph = round6(1 - pc - pg - ps);
      if (ph <= 0.04) return this.gen(R, level);
      const built = numOpts(R, ph, [
        { v: round6(1 - pc - pg), why: 'forgets the sour lollies', tag: 'part-only' },
        { v: round6(1 - pc - pg - pg), why: 'gives the sour lollies the same probability as the gummy ones', tag: 'misread' },
        { v: ps, why: 'gives the probability of a sour lolly', tag: 'misread' },
        { v: round6(ph + 0.1), why: 'is an arithmetic slip', tag: 'slip' },
      ], { int: false, min: 0.01 });
      return item(`A jar holds chocolate, gummy, hard and sour lollies. There are ${k === 2 ? 'twice' : 'three times'} as many sour lollies as gummy lollies. If ${who} takes one lolly without looking, the probability that it is chocolate is ${pc} and the probability that it is gummy is ${pg}. What is the probability that ${who} takes a hard lolly?`, built,
        explainWith(`Sour: ${k} × ${pg} = ${ps}. The probabilities add to 1, so hard = 1 − ${pc} − ${pg} − ${ps} = ${ph}.`, built));
    }
    // two dice / spinners: probability of a sum
    const s1 = R.pick([4, 5, 6]), s2 = R.pick([3, 4, 6]);
    const target = R.int(4, s1 + s2 - 1);
    const cmp = R.pick(['equal to', 'greater than']);
    let fav = 0;
    for (let a = 1; a <= s1; a++) for (let b = 1; b <= s2; b++) if (cmp === 'equal to' ? a + b === target : a + b > target) fav++;
    if (fav === 0) return this.gen(R, level);
    const tot = s1 * s2;
    const fr = [[fav, tot, null, null], [fav, s1 + s2, 'divides by the number of sections added together instead of multiplied', 'operation'],
      [fav + 1, tot, 'counts one outcome too many', 'off-by-one'], [fav - 1, tot, 'misses one outcome', 'off-by-one'],
      [tot - fav, tot, 'gives the probability that it does not happen', 'reversed'], [1, tot, 'counts only one way to make the total', 'part-only'],
      [fav + 2, tot, 'counts two outcomes too many', 'off-by-one']];
    const list = [];
    fr.forEach(f => { if (list.length < 5 && f[0] > 0 && f[0] <= f[1] && !list.some(x => Math.abs(x[0] / x[1] - f[0] / f[1]) < 1e-9)) list.push(f); });
    list.sort((x, y) => x[0] / x[1] - y[0] / y[1]);
    const built = { options: list.map(f => frac(f[0], f[1])), answer: list.findIndex(f => f[2] === null), whys: list.map(f => f[2]), tags: list.map(f => f[3]) };
    if (list.length < 5) return this.gen(R, level);
    return item(`Spinner A has ${s1} equal sections numbered 1 to ${s1}. Spinner B has ${s2} equal sections numbered 1 to ${s2}. ${who} spins both and adds the two numbers. What is the probability that the total is ${cmp} ${target}?`, built,
      explainWith(`There are ${s1} × ${s2} = ${tot} equally likely pairs, and ${fav} of them give a total ${cmp} ${target}, so the probability is ${frac(fav, tot)}.`, built));
  } });

/* ---- counting: outfits, handshakes, routes, arrangements ---- */
defMaths({ id: 'm-counting', slot: 'counting', topic: 'counting', fam: 'Data and chance',
  gen(R, level) {
    const v = byLevel(level, R.int(0, 1), R.int(0, 2), R.int(1, 3));
    const [A, B] = names(R, 2);
    if (v === 0) {
      const a1 = R.int(2, 5), a2 = R.int(3, 6), b1 = R.int(2, 5), b2 = R.int(3, 7);
      if (a1 * a2 === b1 * b2) return this.gen(R, level);
      const d = a1 * a2 - b1 * b2;
      const who = d > 0 ? A : B;
      const opts = [];
      [-2, -1, 0, 1, 2].forEach(x => opts.push(x === 0 ? 'They have the same number of outfits.' : `${x > 0 ? A : B} has ${Math.abs(x) === 1 ? Math.abs(d) : Math.abs(d) + Math.abs(x) - 1 + (Math.abs(d) === 1 ? 1 : 0)} more outfit${Math.abs(d) === 1 && Math.abs(x) === 1 ? '' : 's'} than ${x > 0 ? B : A}.`));
      const correctTxt = `${who} has ${Math.abs(d)} more outfit${Math.abs(d) === 1 ? '' : 's'} than ${who === A ? B : A}.`;
      const wrongs = [
        { s: `${who === A ? B : A} has ${Math.abs(d)} more outfit${Math.abs(d) === 1 ? '' : 's'} than ${who}.`, why: 'gets the right difference for the wrong person', tag: 'reversed' },
        { s: `${A} has ${Math.abs((a1 + a2) - (b1 + b2)) || 1} more outfit${Math.abs((a1 + a2) - (b1 + b2)) === 1 ? '' : 's'} than ${B}.`, why: 'adds the clothes instead of multiplying', tag: 'operation' },
        { s: 'They have the same number of outfits.', why: 'compares the total number of clothes instead of outfits', tag: 'operation' },
        { s: `${who} has ${Math.abs(d) + 1} more outfits than ${who === A ? B : A}.`, why: 'is one out', tag: 'off-by-one' },
        { s: `${who === A ? B : A} has ${Math.abs(d) + 2} more outfits than ${who}.`, why: 'is a guess', tag: 'slip' },
      ];
      void opts;
      const built = textOpts(R, correctTxt, wrongs, { n: 5 });
      return item(`${A} has ${a1} different pairs of trousers and ${a2} different shirts. ${B} has ${b1} different pairs of trousers and ${b2} different shirts. Each person makes an outfit from their own clothes by choosing 1 pair of trousers and 1 shirt. Who can make more different outfits, and by how many?`, built,
        explainWith(`${A} can make ${a1} × ${a2} = ${a1 * a2} outfits and ${B} can make ${b1} × ${b2} = ${b1 * b2}.`, built));
    }
    if (v === 1) {
      const n = byLevel(level, R.int(4, 8), R.int(6, 12), R.int(8, 16));
      const ans = n * (n - 1) / 2;
      const built = numOpts(R, ans, [
        { v: n * (n - 1), why: 'counts each handshake twice', tag: 'reversed' },
        { v: n * n, why: 'includes people shaking their own hand', tag: 'misread' },
        { v: n - 1, why: 'counts only one person\'s handshakes', tag: 'part-only' },
        { v: ans - n + 1, why: 'leaves out the first person', tag: 'off-by-one' },
      ], { min: 1 });
      return item(`At a meeting, each of the ${n} people shakes hands once with every other person. How many handshakes are there altogether?`, built,
        explainWith(`Each person shakes ${n - 1} hands, giving ${n} × ${n - 1} = ${n * (n - 1)}, but that counts every handshake twice, so there are ${ans}.`, built));
    }
    if (v === 2) {
      // routes on a grid moving only right/up
      const w = byLevel(level, 2, R.int(2, 3), R.int(3, 4)), h = byLevel(level, 2, R.int(2, 3), R.int(2, 4));
      const C = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); };
      const ans = C(w + h, w);
      const built = numOpts(R, ans, [
        { v: w * h, why: 'multiplies the two side lengths', tag: 'operation' },
        { v: w + h, why: 'counts the steps in one route', tag: 'misread' },
        { v: ans - 1, why: 'misses one route', tag: 'off-by-one' },
        { v: 2 * (w + h), why: 'doubles the number of steps', tag: 'operation' },
        { v: Math.pow(2, w + h), why: 'allows routes that go too far', tag: 'misread' },
      ], { min: 1 });
      let s = '';
      const c = 40, pad = 18;
      for (let i = 0; i <= w; i++) s += line(pad + i * c, pad, pad + i * c, pad + h * c);
      for (let j = 0; j <= h; j++) s += line(pad, pad + j * c, pad + w * c, pad + j * c);
      s += circ(pad, pad + h * c, 5, { fill: 'ink' }) + circ(pad + w * c, pad, 5, { fill: 'ink' }) + txt(pad - 8, pad + h * c + 12, 'S', { weight: 600 }) + txt(pad + w * c + 10, pad - 8, 'F', { weight: 600 });
      return item(`An ant walks along the lines of the grid from S to F. It only ever moves right or up. How many different routes can it take?`, built,
        explainWith(`Every route is ${w} moves right and ${h} moves up in some order. Counting the routes to each corner and adding gives ${ans}.`, built), { svg: svg(w * c + 2 * pad, h * c + 2 * pad, s, 'grid of streets') });
    }
    // number of 3-digit numbers from digit cards with a condition
    const digits = R.sample([1, 2, 3, 4, 5, 6, 7, 8, 9], R.int(4, 5)).sort();
    const cond = R.pick(['even', 'greater than 500', 'odd']);
    let cnt = 0;
    for (const a of digits) for (const b of digits) for (const c of digits) {
      if (a === b || b === c || a === c) continue;
      const v2 = a * 100 + b * 10 + c;
      if (cond === 'even' ? v2 % 2 === 0 : cond === 'odd' ? v2 % 2 === 1 : v2 > 500) cnt++;
    }
    if (!cnt) return this.gen(R, level);
    const all = digits.length * (digits.length - 1) * (digits.length - 2);
    const built = numOpts(R, cnt, [
      { v: all, why: 'counts every three-digit number, ignoring the condition', tag: 'part-only' },
      { v: all - cnt, why: 'counts the numbers that do not meet the condition', tag: 'reversed' },
      { v: Math.round(all / 2), why: 'assumes exactly half meet the condition', tag: 'misread' },
      { v: cnt * 2, why: 'counts some numbers twice', tag: 'slip' },
    ], { min: 1 });
    return item(`${A} has ${digits.length} digit cards: ${digits.join(', ')}. ${A} makes three-digit numbers using three different cards. How many of these numbers are ${cond}?`, built,
      explainWith(`Fix the condition first (the ${cond === 'greater than 500' ? 'hundreds' : 'units'} digit), then count the choices for the other places: ${cnt} numbers.`, built));
  } });

/* ---- "which statements are correct" about number facts ---- */
defMaths({ id: 'm-statements', slot: 'statements', topic: 'number reasoning', fam: 'Number',
  gen(R, level) {
    const pool = [
      () => { const r = R.int(1, 7); const d = 8; const evens = [0, 2, 4, 6]; return { t: `An even number divided by ${d} can leave a remainder of ${r}.`, v: evens.includes(r) }; },
      () => { const a = R.int(2, 9); return { t: `The sum of any ${words(a)} consecutive whole numbers is a multiple of ${a}.`, v: a % 2 === 1 }; },
      () => { const n = R.int(10, 99); return { t: `${n} has an odd number of factors.`, v: Number.isInteger(Math.sqrt(n)) }; },
      () => { const p = R.pick([2, 3, 5, 7, 11, 13, 17]); return { t: `Every multiple of ${p * 2} is also a multiple of ${p}.`, v: true }; },
      () => { const n = R.pick([4, 6, 8, 9, 12]); return { t: `Every multiple of ${n} is also a multiple of ${n * 2}.`, v: false }; },
      () => { const n = R.int(21, 99); return { t: `${n} is a prime number.`, v: isPrime(n) }; },
      () => { return { t: `The product of two odd numbers is always odd.`, v: true }; },
      () => { return { t: `The sum of two odd numbers is always odd.`, v: false }; },
      () => { const n = R.int(2, 9); return { t: `${n * n} − ${n} is a multiple of ${n - 1 || 1}.`, v: true }; },
      () => { const n = R.pick([3, 9]); const k = R.int(100, 999); return { t: `${k} is divisible by ${n}.`, v: k % n === 0 }; },
    ];
    const chosen = R.sample(pool, 3).map(f => f());
    if (new Set(chosen.map(c => c.t)).size < 3) return this.gen(R, level);
    const built = statementOpts(R, chosen.map(c => c.v));
    return item(`Which of these statements is/are correct?<br>X&nbsp; ${chosen[0].t}<br>Y&nbsp; ${chosen[1].t}<br>Z&nbsp; ${chosen[2].t}`, built,
      `X is ${chosen[0].v ? 'true' : 'false'}, Y is ${chosen[1].v ? 'true' : 'false'} and Z is ${chosen[2].v ? 'true' : 'false'}. Test each statement with a few examples, then look for the reason it always (or never) works.`);
  } });

/* ---- symbols standing for numbers ---- */
defMaths({ id: 'm-algebra', slot: 'algebra', topic: 'unknowns', fam: 'Patterns and algebra',
  gen(R, level) {

    const [S1, S2, S3] = R.sample(['▲', '●', '■', '◆', '★'], 3);
    if (v === 0) {
      const a = R.int(3, 15), b = R.int(2, 12);
      const k = R.int(2, 12);
      const c = 2 * b + a;
      const built = numOpts(R, b, [
        { v: a, why: `gives the value of ${S1}`, tag: 'misread' },
        { v: c - a, why: `forgets to halve`, tag: 'part-only' },
        { v: (c + a) / 2, why: `adds ${S1} instead of subtracting it`, tag: 'reversed' },
        { v: b + 1, why: 'is one out', tag: 'slip' },
      ], { int: false, min: 0 });
      return item(`${S1} and ${S2} stand for different numbers.<br>${k} × ${S1} = ${k * a}<br>${S2} + ${S2} + ${S1} = ${c}<br>What is ${S2}?`, built,
        explainWith(`${S1} = ${k * a} ÷ ${k} = ${a}. Then ${S2} + ${S2} = ${c} − ${a} = ${c - a}, so ${S2} = ${b}.`, built));
    }
    if (v === 1) {
      // balance scales
      const x = R.int(2, 12) * 5, y = R.int(2, 9) * 5;
      const p = R.int(2, 4), q = R.int(1, 3);
      const total = p * x + q * y;
      const r = R.int(1, 3);
      const left2 = x + r * y;
      const built = numOpts(R, x, [
        { v: y, why: 'gives the mass of the other shape', tag: 'misread' },
        { v: Math.round(total / (p + q)), why: 'shares the mass equally among all the shapes', tag: 'misread' },
        { v: total / p, why: `ignores the ${S2}s on the first scale`, tag: 'part-only' },
        { v: x + y, why: 'adds the two masses', tag: 'operation' },
      ], { min: 1 });
      return item(`On a balance, ${p} ${S1} and ${q} ${S2} together weigh ${total} g. On another balance, 1 ${S1} and ${r} ${S2} together weigh ${left2} g. All ${S1} have the same mass and all ${S2} have the same mass. What is the mass of one ${S1}?`, built,
        explainWith(`From the two balances, ${S1} = ${x} g and ${S2} = ${y} g: check ${p} × ${x} + ${q} × ${y} = ${total} and ${x} + ${r} × ${y} = ${left2}.`, built));
    }
    if (v === 2) {
      // half-full can problem: (half) and (quarter) masses -> three-quarters
      const can = R.int(3, 12) * 5, full = R.int(8, 30) * 10;
      const half = can + full / 2, quarter = can + full / 4;
      const ask = R.pick([[3, 4, 'three-quarters'], [1, 1, 'completely'], [0, 1, 'empty']]);
      const ans = can + full * ask[0] / ask[1];
      const thing = R.pick(['sweetcorn', 'paint', 'honey', 'soup']);
      const built = numOpts(R, ans, [
        { v: half + quarter, why: 'adds the two readings, which counts the can twice', tag: 'misread' },
        { v: half * ask[0] / ask[1] * 2, why: 'scales the whole reading, can included', tag: 'part-only' },
        { v: ans - can, why: 'leaves out the can', tag: 'part-only' },
        { v: ans + (half - quarter), why: 'adds one quarter too many', tag: 'off-by-one' },
      ], { fmt: x => num(x) + ' g', min: 1 });
      return item(`When a can of ${thing} is half full, the can and ${thing} together have a mass of ${half} g. When it is one-quarter full, they have a mass of ${quarter} g. What is the mass of the can and ${thing} together when the can is ${ask[2]}${ask[2] === 'completely' ? ' full' : ask[2] === 'empty' ? '' : ' full'}?`, built,
        explainWith(`Half minus a quarter is one quarter of the ${thing}: ${half} − ${quarter} = ${half - quarter} g. So the full amount is ${full} g and the can is ${can} g. The answer is ${ans} g.`, built));
    }
    // three symbols with sums
    const a = R.int(2, 15), b = R.int(2, 15), c = R.int(2, 15);
    const e1 = a + b, e2 = b + c, e3 = a + c;
    const ask = R.int(0, 2);
    const ans = [a, b, c][ask];
    const built = numOpts(R, ans, [
      { v: (e1 + e2 + e3) / 2, why: 'gives the sum of all three', tag: 'part-only' },
      { v: [b, c, a][ask], why: 'gives a different symbol', tag: 'misread' },
      { v: Math.round((e1 + e2 + e3) / 3), why: 'averages the totals', tag: 'operation' },
      { v: ans + 2, why: 'is an arithmetic slip', tag: 'slip' },
    ], { int: false, min: 0 });
    return item(`${S1} + ${S2} = ${e1}<br>${S2} + ${S3} = ${e2}<br>${S1} + ${S3} = ${e3}<br>What is ${[S1, S2, S3][ask]}?`, built,
      explainWith(`Adding all three lines gives 2 × (${S1} + ${S2} + ${S3}) = ${e1 + e2 + e3}, so ${S1} + ${S2} + ${S3} = ${(e1 + e2 + e3) / 2}. Subtract the line without ${[S1, S2, S3][ask]}: ${ans}.`, built));
  } });

/* ---- working backwards ---- */
defMaths({ id: 'm-backwards', slot: 'backwards', topic: 'working backwards', fam: 'Patterns and algebra',
  gen(R, level) {
    if (R.chance(0.5)) {
      // ticket sales halving each day + fixed day
      const thu = R.int(4, 16) * 10;
      const wed = R.int(2, 8) * 10 * byLevel(level, 1, 1, 1);
      const ratio = byLevel(level, 2, R.pick([2, 3]), R.pick([2, 3, 4]));
      const tue = wed * ratio, mon = tue * ratio;
      const total = mon + tue + wed + thu;
      const built = numOpts(R, mon, [
        { v: tue, why: 'gives Tuesday', tag: 'misread' },
        { v: Math.round((total - thu) / 3), why: 'shares the tickets equally over three days', tag: 'misread' },
        { v: (total - thu) / 2, why: 'halves the remaining tickets once', tag: 'part-only' },
        { v: total - thu - wed, why: 'forgets Tuesday', tag: 'part-only' },
      ], { min: 1 });
      const share = ratio === 2 ? 'half as many' : ratio === 3 ? 'one-third as many' : 'one-quarter as many';
      return item(`A cinema sold ${total} tickets over four days, Monday to Thursday. On Tuesday it sold ${share} tickets as on Monday. On Wednesday it sold ${share} tickets as on Tuesday. On Thursday it sold ${thu} tickets. How many tickets were sold on Monday?`, built,
        explainWith(`Monday to Wednesday sold ${total - thu}. If Wednesday is 1 part, Tuesday is ${ratio} and Monday is ${ratio * ratio}: ${1 + ratio + ratio * ratio} parts. Each part is ${wed}, so Monday is ${mon}.`, built));
    }
    // number machine backwards
    const steps = byLevel(level, 3, 4, 5);
    const ops = [];
    for (let i = 0; i < steps; i++) ops.push(R.pick([['+', R.int(2, 15)], ['−', R.int(2, 9)], ['×', R.int(2, 4)], ['÷', 2]]));
    let x = R.int(2, 20), cur = x, ok = true;
    for (const [o, k] of ops) {
      if (o === '+') cur += k; else if (o === '−') cur -= k; else if (o === '×') cur *= k; else { if (cur % k) { ok = false; break; } cur /= k; }
      if (cur <= 0) ok = false;
    }
    if (!ok) return this.gen(R, level);
    const who = name1(R);
    // wrong: apply ops forwards to output; reverse order but same ops
    let w1 = cur; for (const [o, k] of ops) { if (o === '+') w1 += k; else if (o === '−') w1 -= k; else if (o === '×') w1 *= k; else w1 /= k; }
    let w2 = cur; for (const [o, k] of ops.slice().reverse()) { if (o === '+') w2 += k; else if (o === '−') w2 -= k; else if (o === '×') w2 *= k; else w2 /= k; }
    let w3 = cur; for (const [o, k] of ops) { if (o === '+') w3 -= k; else if (o === '−') w3 += k; else if (o === '×') w3 /= k; else w3 *= k; }
    const built = numOpts(R, x, [
      { v: w2, why: 'undoes the steps in the right order but does them instead of undoing them', tag: 'reversed' },
      { v: w3, why: 'undoes the steps but in the wrong order', tag: 'reversed' },
      { v: w1, why: 'runs the machine forwards again', tag: 'reversed' },
      { v: x + 1, why: 'is an arithmetic slip', tag: 'slip' },
    ], { int: false, min: 0 });
    return item(`${who} thinks of a number and then, in order: ${ops.map(([o, k]) => o === '+' ? `adds ${k}` : o === '−' ? `subtracts ${k}` : o === '×' ? `multiplies by ${k}` : `halves the result`).join(', then ')}. The answer is ${cur}. What number did ${who} start with?`, built,
      explainWith(`Start from ${cur} and undo each step in reverse order: ${ops.slice().reverse().map(([o, k]) => o === '+' ? `subtract ${k}` : o === '−' ? `add ${k}` : o === '×' ? `divide by ${k}` : 'double').join(', ')}. That gives ${x}.`, built));
  } });

/* ---- LCM / HCF in context ---- */
defMaths({ id: 'm-lcm-hcf', slot: 'lcm-hcf', topic: 'LCM and HCF', fam: 'Number',
  gen(R, level) {
    const v = byLevel(level, 0, R.int(0, 1), R.int(1, 2));
    if (v === 0) {
      const t = R.sample([6, 8, 9, 10, 12, 15, 4, 5], 3);
      const L = lcm(lcm(t[0], t[1]), t[2]);
      if (L > 180) return this.gen(R, level);
      const ppl = names(R, 3);
      const built = numOpts(R, L, [
        { v: t[0] * t[1] * t[2], why: 'multiplies the three times', tag: 'operation' },
        { v: lcm(t[0], t[1]), why: 'uses only two of the runners', tag: 'part-only' },
        { v: sum(t), why: 'adds the three times', tag: 'operation' },
        { v: L * 2, why: 'gives a later meeting, not the first one', tag: 'misread' },
      ], { min: 1 });
      return item(`${ppl[0]}, ${ppl[1]} and ${ppl[2]} run laps of a track, starting together on the start line. ${ppl[0]} runs a lap every ${t[0]} minutes, ${ppl[1]} every ${t[1]} minutes and ${ppl[2]} every ${t[2]} minutes. After how many minutes are they next on the start line together?`, built,
        explainWith(`They meet at the lowest common multiple of ${t.join(', ')}, which is ${L}.`, built));
    }
    if (v === 1) {
      // pair with given HCF & LCM
      const h = R.pick([2, 3, 4, 5, 6]);
      const pairs = [];
      const m = R.pick([6, 10, 12, 15, 30]);
      for (let a = 1; a <= m; a++) for (let b = a; b <= m; b++) if (gcd(a, b) === 1 && a * b === m) pairs.push([a * h, b * h]);
      if (pairs.length < 2) return this.gen(R, level);
      const [p1, p2] = pairs.slice(0, 2);
      const ans = p2[0] + p2[1];
      const built = numOpts(R, ans, [
        { v: p1[0] + p1[1], why: 'gives the sum of the first pair', tag: 'misread' },
        { v: h * m + h, why: 'adds the HCF and LCM', tag: 'operation' },
        { v: ans + h, why: 'is out by the HCF', tag: 'slip' },
        { v: p2[0] * p2[1] / h, why: 'gives the LCM', tag: 'misread' },
      ], { min: 1 });
      return item(`The numbers ${p1[0]} and ${p1[1]} have highest common factor ${h} and lowest common multiple ${h * m}. A different pair of numbers also has highest common factor ${h} and lowest common multiple ${h * m}. What is the sum of this second pair?`, built,
        explainWith(`Write the numbers as ${h} × a and ${h} × b where a and b share no factor and a × b = ${m}. Besides ${p1[0] / h} and ${p1[1] / h}, the other choice is ${p2[0] / h} and ${p2[1] / h}, giving ${p2[0]} + ${p2[1]} = ${ans}.`, built));
    }
    // tiles: largest square tile for a rectangular floor (HCF) and how many
    const h = R.pick([15, 20, 25, 30, 40, 50]);
    const a = h * R.int(2, 7), b = h * R.int(2, 7);
    if (gcd(a, b) !== h) return this.gen(R, level);
    const n = (a / h) * (b / h);
    const built = numOpts(R, n, [
      { v: (a / 10) * (b / 10), why: 'uses 10 cm tiles, which are not the largest that fit', tag: 'misread' },
      { v: a / h + b / h, why: 'adds the tiles along each side instead of multiplying', tag: 'operation' },
      { v: (a / (h / 5)) * (b / (h / 5)) / 25, why: 'is an arithmetic slip', tag: 'slip' },
      { v: n * 2, why: 'uses a tile that is too small', tag: 'misread' },
      { v: Math.round(n / 2), why: 'uses a tile that does not fit exactly', tag: 'misread' },
    ], { min: 1 });
    return item(`A floor measures ${a} cm by ${b} cm. It is covered with the largest possible square tiles that fit exactly with no cutting. How many tiles are needed?`, built,
      explainWith(`The largest square that fits both sides exactly has side equal to the HCF of ${a} and ${b}: ${h} cm. That gives ${a / h} × ${b / h} = ${n} tiles.`, built));
  } });

/* ---- multi-step word problems ---- */
defMaths({ id: 'm-multi-step', slot: 'multi-step', topic: 'multi-step problems', fam: 'Number',
  gen(R, level) {
    const v = byLevel(level, R.int(0, 1), R.int(0, 2), R.int(1, 3));
    const who = name1(R);
    if (v === 0) {
      // half-full bag, transfer
      const cap = R.int(10, 40) * 10;
      const inBag = cap / 2;
      const removed = inBag / 2;
      const jar = R.int(cap, cap * 3);
      const moved = cap - (inBag - removed);
      const ans = jar - moved;
      const built = numOpts(R, ans, [
        { v: jar - inBag, why: 'forgets the marbles taken out first', tag: 'part-only' },
        { v: jar - removed, why: 'moves only as many as were taken out', tag: 'misread' },
        { v: moved, why: 'gives the number moved, not the number left', tag: 'misread' },
        { v: jar - cap, why: 'fills the bag from empty', tag: 'misread' },
      ], { min: 0 });
      return item(`A bag is half full with ${inBag} white marbles. A jar holds ${jar} black marbles. ${who} takes out half of the marbles in the bag, then tips black marbles from the jar into the bag until the bag is completely full. How many marbles are left in the jar?`, built,
        explainWith(`A full bag holds ${cap}. After taking out ${removed}, the bag has ${inBag - removed}, so ${moved} black marbles go in. The jar has ${jar} − ${moved} = ${ans} left.`, built));
    }
    if (v === 1) {
      // broken scales offset
      const off = R.int(2, 8) * 250;
      const blockN = R.int(4, 12), block = R.pick([125, 200, 250, 400, 500]);
      const right = blockN * block - off;
      if (right <= 0) return this.gen(R, level);
      const built = numOpts(R, block, [
        { v: round6(right / blockN), why: 'ignores the fault in the scales', tag: 'part-only' },
        { v: round6((right + 2 * off) / blockN), why: 'corrects for the fault twice', tag: 'operation' },
        { v: round6(off / blockN), why: 'uses only the fault mass', tag: 'misread' },
        { v: round6((right + off) / (blockN + 1)), why: 'divides by one block too many', tag: 'off-by-one' },
      ], { fmt: x => num(x) + ' g', int: false, min: 1 });
      return item(`A pair of balance scales is faulty: with nothing on them, an extra ${num(off)} g is needed on the right-hand pan to make them balance. ${who} puts ${blockN} identical blocks on the left pan and ${num(right)} g of weights on the right pan, and the scales balance. What is the mass of one block?`, built,
        explainWith(`The right pan needs ${num(off)} g more than the left to balance, so the blocks weigh ${num(right)} + ${num(off)} = ${num(right + off)} g in total, and each block is ${num(block)} g.`, built));
    }
    if (v === 2) {
      // drivers sharing a road trip
      const ppl = R.int(5, 12), cars = R.int(2, 3);
      const each = frac(cars, ppl);
      const opts = [frac(1, ppl), each, frac(1, cars), frac(cars, ppl + cars), frac(ppl, cars * 10)];
      const uniq = [];
      opts.forEach(o => { if (!uniq.includes(o)) uniq.push(o); });
      if (uniq.length < 5) return this.gen(R, level);
      const vals = uniq.map(s => { const [a, b] = s.split('/').map(Number); return b ? a / b : a; });
      const ord = vals.map((_, i) => i).sort((x, y) => vals[x] - vals[y]);
      const whyMap = { [frac(1, ppl)]: 'forgets that two cars are driven at the same time', [frac(1, cars)]: 'shares the trip between the cars, not the people', [frac(cars, ppl + cars)]: 'counts the cars as people', [frac(ppl, cars * 10)]: 'is not a fair share' };
      const built = { options: ord.map(i => uniq[i]), answer: ord.indexOf(uniq.indexOf(each)), whys: ord.map(i => uniq[i] === each ? null : whyMap[uniq[i]]), tags: ord.map(i => uniq[i] === each ? null : 'misread') };
      return item(`${words(ppl).replace(/^./, c => c.toUpperCase())} friends go on a road trip in ${words(cars)} cars that travel together the whole way. They share the driving so that each person drives for the same amount of time. For what fraction of the journey time does each person drive?`, built,
        explainWith(`At any moment ${cars} people are driving, so there are ${cars} journeys' worth of driving to share among ${ppl} people: ${each} each.`, built));
    }
    // age problem
    const kid = R.int(5, 12), k = R.int(3, 5), adult = kid * k;
    const yrs = R.int(2, 15);
    const ansA = adult + yrs, ansK = kid + yrs;
    const ratio = ansA / ansK;
    if (!isInt(ratio * 2)) return this.gen(R, level);
    const built = numOpts(R, yrs, [
      { v: adult - kid, why: 'gives the age difference', tag: 'misread' },
      { v: yrs + 1, why: 'is one year out', tag: 'off-by-one' },
      { v: kid, why: 'gives the child\'s age now', tag: 'misread' },
      { v: Math.max(1, yrs - 2), why: 'is a slip', tag: 'slip' },
    ], { min: 1 });
    return item(`${who} is ${kid} years old and ${who}'s grandmother is ${k} times as old. In how many years will the grandmother be ${isInt(ratio) ? ratio : num(ratio)} times as old as ${who}?`, built,
      explainWith(`The age gap is always ${adult - kid} years. When the grandmother is ${num(ratio)} times as old, ${who} is ${ansK}, which is in ${yrs} years.`, built));
  } });

/* ---- challenge: magic squares, digit puzzles, grids ---- */
defMaths({ id: 'm-challenge', slot: 'challenge', topic: 'problem solving', fam: 'Patterns and algebra',
  gen(R, level) {
    const v = byLevel(level, R.int(0, 1), R.int(0, 2), R.int(1, 3));
    if (v === 0) {
      // magic square with missing numbers (3x3 from base)
      const base = [[2, 7, 6], [9, 5, 1], [4, 3, 8]];
      const add = R.int(0, 15), mul = R.int(1, 3);
      let sq = base.map(r => r.map(x => x * mul + add));
      if (R.chance(0.5)) sq = sq.map(r => r.slice().reverse());
      if (R.chance(0.5)) sq = sq[0].map((_, i) => sq.map(r => r[i]));
      const hideCount = byLevel(level, 5, 6, 6);
      const cells = R.shuffle(range(0, 8));
      const shown = new Set(cells.slice(hideCount));
      const askCell = cells[0];
      // the asked cell must be solvable; brute check: magic sum known from any full line? ensure a line with only askCell hidden OR center known
      const r = Math.floor(askCell / 3), c = askCell % 3;
      const known = i => shown.has(i);
      const rowOk = [0, 1, 2].every(j => j === c || known(r * 3 + j)), colOk = [0, 1, 2].every(i => i === r || known(i * 3 + c));
      if (!rowOk && !colOk) return this.gen(R, level);
      const ans = sq[r][c];
      const grid = sq.map((row, i) => row.map((x, j) => (i * 3 + j) === askCell ? '?' : known(i * 3 + j) ? String(x) : ''));
      const built = numOpts(R, ans, [
        { v: ans + mul, why: 'is one step out', tag: 'slip' },
        { v: ans - mul, why: 'is one step out', tag: 'slip' },
        { v: 15 * mul + 3 * add - ans, why: 'confuses the missing number with the rest of the line', tag: 'misread' },
        { v: 5 * mul + add, why: 'gives the centre number', tag: 'misread' },
      ], { min: 0 });
      return item(`In a magic square, every row, every column and both diagonals add up to the same total. Some numbers in this magic square are missing. What number should replace the question mark?`, built,
        explainWith(`The magic total is three times the centre number, ${3 * (5 * mul + add)}. Using a line with the question mark gives ${ans}.`, built), { table: { rows: grid } });
    }
    if (v === 1) {
      // missing digits in prices: greatest possible difference
      const a = R.int(50, 90), b = a - R.int(1, 3);
      const t1 = R.int(0, 9), t2 = R.int(0, 9);
      // prices $a.t1? and $b.?t2 with one missing digit each; largest difference = max first - min second
      const max1 = a + t1 / 10 + 9 / 100, min2 = b + 0 / 10 + t2 / 100;
      const ans = round2(max1 - min2);
      const built = numOpts(R, ans, [
        { v: round2(a + t1 / 10 - (b + t2 / 100)), why: 'puts 0 in both gaps', tag: 'misread' },
        { v: round2(a + t1 / 10 + 0.09 - (b + 0.9 + t2 / 100)), why: 'makes the second price as large as possible', tag: 'reversed' },
        { v: round2(a - b), why: 'compares only the dollars', tag: 'part-only' },
        { v: round2(ans + 0.1), why: 'is ten cents out', tag: 'slip' },
      ], { fmt: money, int: false, min: 0.01 });
      return item(`In the prices below, each ■ is a missing digit.<br><span class="mono">$${a}.${t1}■ &nbsp;&nbsp; $${b}.■${t2}</span><br>What is the greatest possible difference between the two prices?`, built,
        explainWith(`Make the first price as large as possible (${money(max1)}) and the second as small as possible (${money(min2)}): the difference is ${money(ans)}.`, built));
    }
    if (v === 2) {
      // grid reference of nth box in a zigzag pattern
      const cols = ['A', 'B', 'C', 'D', 'E'];
      const per = 3; // boxes per diagonal run
      const n = byLevel(level, R.int(12, 30), R.int(30, 60), R.int(60, 150));
      // boxes go B2, C3, D4, then B5, C6, D7, ... column cycles B,C,D, row = n+1
      const colIdx = 1 + (n - 1) % per, row = n + 1;
      const ans = `${cols[colIdx]}${row}`;
      const wrongs = [
        { s: `${cols[colIdx]}${n}`, why: 'forgets the pattern starts in row 2', tag: 'off-by-one' },
        { s: `${cols[1 + n % per]}${row}`, why: 'counts the columns from the wrong box', tag: 'off-by-one' },
        { s: `${cols[colIdx]}${row + per}`, why: 'goes one run too far', tag: 'misread' },
        { s: `${cols[1 + (n + 1) % per]}${row - 1}`, why: 'is one box early', tag: 'off-by-one' },
        { s: `${cols[colIdx]}${row * 2}`, why: 'doubles the row number', tag: 'operation' },
      ];
      const built = textOpts(R, ans, wrongs, { n: 5 });
      return item(`Boxes are drawn on a grid with columns A to E and rows numbered from 1 downwards. Box 1 is at B2, box 2 at C3, box 3 at D4, box 4 at B5, box 5 at C6, and so on, following the same pattern. What is the grid reference of box ${n}?`, built,
        explainWith(`Box n is always in row n + 1, and the columns repeat B, C, D. ${n} leaves remainder ${(n - 1) % per + 1 === 3 ? 0 : (n - 1) % per + 1} when divided by 3, so the column is ${cols[colIdx]}: ${ans}.`, built));
    }
    // digit sum puzzle: how many numbers between X and Y have digit sum S
    const lo = byLevel(level, 100, 100, 1000), hi = byLevel(level, 300, 999, 3000);
    const S = R.int(byLevel(level, 5, 8, 10), byLevel(level, 9, 14, 20));
    let cnt = 0;
    for (let x = lo; x <= hi; x++) if (String(x).split('').reduce((a, d) => a + Number(d), 0) === S) cnt++;
    if (!cnt) return this.gen(R, level);
    const built = numOpts(R, cnt, [
      { v: cnt - 1, why: 'misses one number', tag: 'off-by-one' },
      { v: cnt + 1, why: 'counts one number twice', tag: 'off-by-one' },
      { v: cnt * 2, why: 'counts the numbers twice', tag: 'slip' },
      { v: Math.round(cnt * 0.7), why: 'misses the numbers with a zero digit', tag: 'part-only' },
    ], { min: 1 });
    return item(`How many whole numbers from ${num(lo)} to ${num(hi)} have digits that add up to ${S}?`, built,
      explainWith(`Work through the numbers by their first digit and count systematically: there are ${cnt}.`, built));
  } });

/* ==========================================================================
   Mathematical Reasoning — challenge generators. Medium papers take a few of
   these; Hard papers replace the quick opening questions with them, which is
   what makes a Hard paper far tougher than the real test.
   All of these use slot 'challenge-x'.
   ========================================================================== */
'use strict';

function defHard(g) { g.slot = 'challenge-x'; g.fam = g.fam || 'Problem solving'; defMaths(g); }

defHard({ id: 'h-meet', topic: 'meeting problems',
  gen(R, level) {
    const [A, B] = names(R, 2);
    const va = R.pick([12, 15, 16, 18, 20]), vb = R.pick([10, 12, 14, 24, 30]);
    const delay = byLevel(level, 0, R.pick([15, 30]), R.pick([20, 30, 40]));
    const tMeet = R.pick([1, 1.5, 2, 2.5, 3]) ; // hours after B starts
    const D = round6(va * (tMeet + delay / 60) + vb * tMeet);
    if (!isInt(D * 2)) return this.gen(R, level);
    const fromA = round6(va * (tMeet + delay / 60));
    const ans = fromA;
    const built = numOpts(R, ans, [
      { v: round6(D * va / (va + vb)), why: `ignores ${A}'s head start`, tag: 'part-only' },
      { v: round6(D - fromA), why: `gives the distance from ${B}'s town`, tag: 'misread' },
      { v: round6(va * tMeet), why: `forgets the time ${A} rode alone`, tag: 'part-only' },
      { v: round6(D / 2), why: 'assumes they meet halfway', tag: 'misread' },
    ], { fmt: x => num(x) + ' km', int: false, min: 0.5 });
    return item(`${A} and ${B} live ${num(D)} km apart and cycle towards each other along the same road. ${A} rides at ${va} km/h and ${B} at ${vb} km/h.${delay ? ` ${A} sets off ${delay} minutes before ${B}.` : ' They set off at the same time.'} How far from ${A}'s home do they meet?`, built,
      explainWith(`${delay ? `In the first ${delay} minutes ${A} covers ${num(va * delay / 60)} km, leaving ${num(D - va * delay / 60)} km. ` : ''}Together they close the gap at ${va + vb} km/h, so they meet ${num(tMeet)} hours after ${B} starts. ${A} has then ridden ${num(fromA)} km.`, built));
  } });

defHard({ id: 'h-work-share', topic: 'shared work',
  gen(R, level) {
    const [A, B] = names(R, 2);
    const a = R.pick([6, 8, 10, 12, 15]), b = R.pick([10, 12, 15, 20, 24, 30]);
    if (a === b) return this.gen(R, level);
    const k = R.int(1, byLevel(level, 2, 3, 4));
    const done = k / a + k / b;
    if (done >= 1) return this.gen(R, level);
    const restDays = round6((1 - done) * b);
    if (!isInt(restDays * 2)) return this.gen(R, level);
    const built = numOpts(R, restDays, [
      { v: b - k, why: `forgets the work ${A} did`, tag: 'part-only' },
      { v: round6((1 - done) * a), why: `uses ${A}'s rate for the rest`, tag: 'misread' },
      { v: round6(b - k * 2), why: 'counts the shared days twice', tag: 'operation' },
      { v: round6(restDays + k), why: 'adds the shared days on', tag: 'misread' },
    ], { fmt: x => plural(x, 'day'), int: false, min: 0.5 });
    return item(`${A} can paint a fence alone in ${a} days. ${B} can paint the same fence alone in ${b} days. They work together for ${plural(k, 'day')}, then ${A} stops. How many more days does ${B} need to finish the fence?`, built,
      explainWith(`Each day together they paint 1/${a} + 1/${b} of the fence. In ${k} day${k > 1 ? 's' : ''} that is ${frac(Math.round(done * a * b), a * b)}, leaving ${frac(Math.round((1 - done) * a * b), a * b)}. ${B} alone does 1/${b} a day, so ${num(restDays)} more days.`, built));
  } });

defHard({ id: 'h-mixture', topic: 'mixtures',
  gen(R, level) {
    const vol = R.pick([2, 3, 4, 5, 6]) * byLevel(level, 1, 1, 2);
    const p = R.pick([20, 25, 30, 40, 50, 60]);
    const q = R.pick([10, 12, 15, 20, 24, 25].filter(x => x < p));
    if (!q) return this.gen(R, level);
    const water = round6(vol * p / q - vol);
    if (!isInt(water * 4)) return this.gen(R, level);
    const built = numOpts(R, water, [
      { v: round6(vol * (p - q) / 100), why: 'subtracts the percentages as if they were litres', tag: 'units' },
      { v: round6(vol * p / q), why: 'gives the final volume, not the water added', tag: 'misread' },
      { v: round6(vol * q / p), why: 'divides the percentages the wrong way round', tag: 'reversed' },
      { v: round6(vol * (p - q) / q / 2), why: 'adds only half the water needed', tag: 'part-only' },
    ], { fmt: x => num(x) + ' L', int: false, min: 0.25 });
    return item(`A jug holds ${vol} L of drink that is ${p}% juice and the rest water. How much water must be added so that the drink is ${q}% juice?`, built,
      explainWith(`The juice stays at ${num(vol * p / 100)} L. For that to be ${q}%, the total must be ${num(vol * p / 100)} ÷ ${q / 100} = ${num(vol * p / q)} L, so add ${num(water)} L of water.`, built));
  } });

defHard({ id: 'h-digits-reverse', topic: 'digit problems',
  gen(R, level) {
    const sols = [];
    const s = R.int(byLevel(level, 7, 9, 9), byLevel(level, 12, 14, 16));
    const diff = R.pick([9, 18, 27, 36, 45, 54]);
    for (let t = 1; t <= 9; t++) for (let u = 0; u <= 9; u++) if (t + u === s && (10 * u + t) - (10 * t + u) === diff) sols.push(10 * t + u);
    if (sols.length !== 1) return this.gen(R, level);
    const n = sols[0];
    const rev = Number(String(n).split('').reverse().join(''));
    const built = numOpts(R, n, [
      { v: rev, why: 'gives the number after its digits are swapped', tag: 'reversed' },
      { v: n + diff, why: 'adds the difference to the answer', tag: 'misread' },
      { v: s * 10 - diff, why: 'is a slip in setting up the problem', tag: 'slip' },
      { v: n + 9, why: 'swaps one digit for the next', tag: 'slip' },
    ], { min: 10 });
    return item(`A two-digit number has digits that add to ${s}. When its two digits are swapped, the new number is ${diff} more than the original. What is the original number?`, built,
      explainWith(`Swapping the digits changes the number by 9 × (difference of the digits), so the digits differ by ${diff / 9}. Digits that add to ${s} and differ by ${diff / 9}, with the smaller first: ${n}.`, built));
  } });

defHard({ id: 'h-consecutive', topic: 'consecutive numbers',
  gen(R, level) {
    const k = byLevel(level, R.int(3, 5), R.int(4, 7), R.int(5, 9));
    const start = R.int(5, 60);
    const nums = range(start, start + k - 1);
    const S = sum(nums);
    const ask = R.pick(['largest', 'smallest']);
    const ans = ask === 'largest' ? nums[k - 1] : nums[0];
    const built = numOpts(R, ans, [
      { v: Math.round(S / k), why: 'gives the middle number', tag: 'misread' },
      { v: ask === 'largest' ? nums[0] : nums[k - 1], why: `gives the ${ask === 'largest' ? 'smallest' : 'largest'} number`, tag: 'reversed' },
      { v: ans + (ask === 'largest' ? 1 : -1), why: 'is one out', tag: 'off-by-one' },
      { v: Math.round(S / k) + k, why: 'adds the count to the middle', tag: 'operation' },
    ], { min: 1 });
    return item(`${words(k).replace(/^./, c => c.toUpperCase())} consecutive whole numbers add up to ${S}. What is the ${ask} of the numbers?`, built,
      explainWith(`The middle of ${k} consecutive numbers is their mean: ${S} ÷ ${k} = ${num(S / k)}. The numbers are ${nums.join(', ')}, so the ${ask} is ${ans}.`, built));
  } });

defHard({ id: 'h-heads-legs', topic: 'heads and legs',
  gen(R, level) {
    const c = R.int(4, 30), k = R.int(3, 25);
    const three = level === 'hard' && R.chance(0.5);
    if (!three) {
      const heads = c + k, legs = 2 * c + 4 * k;
      const built = numOpts(R, k, [
        { v: c, why: 'gives the number of chickens', tag: 'misread' },
        { v: legs / 4, why: 'assumes every animal has four legs', tag: 'misread' },
        { v: Math.round(heads / 2), why: 'splits the animals in half', tag: 'misread' },
        { v: legs / 2 - heads, why: 'is right by a lucky slip', tag: 'slip' },
        { v: k + 2, why: 'is an arithmetic slip', tag: 'slip' },
      ], { min: 1 });
      return item(`A farm has only chickens and cows. Altogether they have ${heads} heads and ${legs} legs. How many cows are there?`, built,
        explainWith(`If every animal were a chicken there would be ${2 * heads} legs. The extra ${legs - 2 * heads} legs come from cows, 2 extra each: ${k} cows.`, built));
    }
    const sp = R.int(2, 8);
    const heads = c + k + sp, legs = 2 * c + 4 * k + 8 * sp;
    // condition: twice as many chickens as ... make unique using spiders count given
    const built = numOpts(R, k, [
      { v: c, why: 'gives the number of birds', tag: 'misread' },
      { v: Math.round((legs - 8 * sp) / 4), why: 'assumes the rest all have four legs', tag: 'part-only' },
      { v: k + sp, why: 'adds the spiders', tag: 'misread' },
      { v: k - 1, why: 'is one out', tag: 'off-by-one' },
    ], { min: 1 });
    return item(`A nature park has birds (2 legs), goats (4 legs) and ${sp} spiders (8 legs). Altogether there are ${heads} heads and ${legs} legs. How many goats are there?`, built,
      explainWith(`Take away the spiders: ${heads - sp} heads and ${legs - 8 * sp} legs. If all were birds there would be ${2 * (heads - sp)} legs; the extra ${legs - 8 * sp - 2 * (heads - sp)} legs give ${k} goats.`, built));
  } });

defHard({ id: 'h-page-digits', topic: 'counting digits',
  gen(R, level) {
    const N = byLevel(level, R.int(20, 99), R.int(100, 400), R.int(120, 999));
    let D = 0; for (let i = 1; i <= N; i++) D += String(i).length;
    const built = numOpts(R, N, [
      { v: Math.round(D / 3), why: 'divides every digit count by 3', tag: 'operation' },
      { v: Math.round(D / 2), why: 'divides every digit count by 2', tag: 'operation' },
      { v: N - 9, why: 'forgets the one-digit pages', tag: 'part-only' },
      { v: N + 1, why: 'is one page out', tag: 'off-by-one' },
    ], { min: 1 });
    return item(`The pages of a book are numbered 1, 2, 3, … in order. Printing all the page numbers uses ${num(D)} digits altogether. How many pages does the book have?`, built,
      explainWith(`Pages 1–9 use 9 digits${N >= 10 ? ` and pages 10–${Math.min(N, 99)} use ${2 * (Math.min(N, 99) - 9)}` : ''}${N >= 100 ? `; the remaining ${D - 9 - 180} digits are 3 per page, ${(D - 189) / 3} pages from 100` : ''}. So the last page is ${N}.`, built));
  } });

defHard({ id: 'h-units-digit', topic: 'patterns in powers',
  gen(R, level) {
    const a = R.pick([2, 3, 7, 8, 13, 17]), n = byLevel(level, R.int(10, 40), R.int(40, 200), R.int(100, 2025));
    let u = 1; for (let i = 0; i < n; i++) u = (u * a) % 10;
    const cyc = []; let x = a % 10; while (!cyc.includes(x)) { cyc.push(x); x = (x * a) % 10; }
    const built = { options: ['1', '3', '7', '9', '2', '4', '6', '8'].filter(d => cyc.includes(Number(d)) || Number(d) === u), answer: 0, whys: [], tags: [] };
    let opts = Array.from(new Set(cyc.map(String).concat([String(u), '0', '5']))).slice(0, 5);
    if (!opts.includes(String(u))) opts[0] = String(u);
    while (opts.length < 5) opts.push(String(R.int(0, 9)));
    opts = Array.from(new Set(opts)); while (opts.length < 5) { const d = String(R.int(0, 9)); if (!opts.includes(d)) opts.push(d); }
    opts.sort((p, q) => Number(p) - Number(q));
    built.options = opts; built.answer = opts.indexOf(String(u));
    built.whys = opts.map(o => o === String(u) ? null : 'comes from a wrong step in the repeating pattern');
    built.tags = opts.map(o => o === String(u) ? null : 'off-by-one');
    return item(`What is the last digit of ${a}<sup>${n}</sup>? (${a}<sup>${n}</sup> means ${n} lots of ${a} multiplied together.)`, built,
      `The last digits of the powers of ${a} repeat in a cycle of ${cyc.length}: ${cyc.join(', ')}. ${n} leaves remainder ${n % cyc.length || cyc.length} on dividing by ${cyc.length}... so the last digit is ${u}.`.replace(`${n % cyc.length || cyc.length} on dividing by ${cyc.length}...`, `${n % cyc.length} when divided by ${cyc.length}`));
  } });

defHard({ id: 'h-fast-clock', topic: 'clocks that gain time',
  gen(R, level) {
    const gain = byLevel(level, R.pick([2, 3, 5]), R.pick([2, 3, 4, 5, 6]), R.pick([3, 4, 6, 7, 9]));
    const set = R.int(6, 11) * 60;
    const hrs = byLevel(level, R.int(3, 8), R.int(6, 12), R.int(10, 30));
    const real = set + hrs * 60;
    const shows = real + gain * hrs;
    const fast = R.chance(0.6);
    const shown = fast ? shows : real - gain * hrs;
    const built = numOpts(R, shown, [
      { v: real, why: 'ignores the clock\'s error', tag: 'part-only' },
      { v: fast ? real - gain * hrs : shows, why: `treats the clock as ${fast ? 'slow' : 'fast'}`, tag: 'reversed' },
      { v: fast ? real + gain : real - gain, why: 'adds the error for one hour only', tag: 'part-only' },
      { v: fast ? shows + gain : shown - gain, why: 'counts one hour too many', tag: 'off-by-one' },
    ], { fmt: time12, min: 0 });
    return item(`A clock ${fast ? 'gains' : 'loses'} ${gain} minutes every hour. It is set to the correct time at ${time12(set)}. What time does it show when the correct time is ${time12(real)}${real >= 1440 ? ' the next day' : ''}?`, built,
      explainWith(`${hrs} hours pass, so the clock is ${fast ? 'ahead' : 'behind'} by ${hrs} × ${gain} = ${hrs * gain} minutes. It shows ${time12(shown)}.`, built));
  } });

defHard({ id: 'h-mean-remove', topic: 'changing the mean',
  gen(R, level) {
    const n = R.int(5, 12), m1 = R.int(20, 60), m2 = m1 + R.pick([-3, -2, 2, 3, 4]);
    const removed = n * m1 - (n - 1) * m2;
    if (removed <= 0) return this.gen(R, level);
    const built = numOpts(R, removed, [
      { v: m1 - m2 + m1, why: 'shifts the mean only once', tag: 'part-only' },
      { v: Math.abs(m1 - m2), why: 'gives the change in the mean', tag: 'misread' },
      { v: (n - 1) * m2, why: 'gives the new total', tag: 'misread' },
      { v: removed + (m2 - m1), why: 'is out by the change in the mean', tag: 'slip' },
    ], { min: 0 });
    return item(`The mean of ${n} numbers is ${m1}. One number is removed and the mean of the ${n - 1} numbers left is ${m2}. What number was removed?`, built,
      explainWith(`The total was ${n} × ${m1} = ${n * m1}. Afterwards it is ${n - 1} × ${m2} = ${(n - 1) * m2}. The removed number is ${removed}.`, built));
  } });

defHard({ id: 'h-coins', topic: 'coin problems',
  gen(R, level) {
    const [a, b] = R.pick([[20, 50], [10, 50], [50, 200], [20, 100], [5, 20]]);
    const x = R.int(3, 25), y = R.int(3, 25);
    const n = x + y, total = a * x + b * y;
    const who = name1(R);
    const fmt = c => c >= 100 ? '$' + c / 100 : c + 'c';
    const built = numOpts(R, y, [
      { v: x, why: `gives the number of ${fmt(a)} coins`, tag: 'misread' },
      { v: Math.round(total / b), why: `assumes every coin is ${fmt(b)}`, tag: 'part-only' },
      { v: Math.round(n / 2), why: 'splits the coins evenly', tag: 'misread' },
      { v: y + 1, why: 'is one out', tag: 'off-by-one' },
    ], { min: 0 });
    return item(`${who} has ${n} coins, all ${fmt(a)} and ${fmt(b)} coins. Their total value is ${money(total / 100)}. How many ${fmt(b)} coins does ${who} have?`, built,

defHard({ id: 'h-grid-triangle', topic: 'area on a grid', fam: 'Space and geometry',
  gen(R, level) {
    const W = 8, H = 6;
    let P, area;
    for (let t = 0; t < 100; t++) {
      P = [[R.int(0, W), R.int(0, H)], [R.int(0, W), R.int(0, H)], [R.int(0, W), R.int(0, H)]];
      area = Math.abs(P[0][0] * (P[1][1] - P[2][1]) + P[1][0] * (P[2][1] - P[0][1]) + P[2][0] * (P[0][1] - P[1][1])) / 2;
      const axis = P.some((p, i) => P.some((q, j) => i < j && (p[0] === q[0] || p[1] === q[1])));
      if (area >= 5 && (level === 'hard' ? !axis : true)) break;
    }
    const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
    const box = (Math.max.apply(null, xs) - Math.min.apply(null, xs)) * (Math.max.apply(null, ys) - Math.min.apply(null, ys));
    const built = numOpts(R, area, [
      { v: box, why: 'gives the area of the surrounding rectangle', tag: 'part-only' },
      { v: box / 2, why: 'halves the surrounding rectangle', tag: 'misread' },
      { v: area + 1, why: 'miscounts a part square', tag: 'slip' },
      { v: area - 1.5, why: 'miscounts a part square', tag: 'slip' },
    ], { fmt: x => num(x) + ' cm²', int: false, min: 0.5 });
    const c = 26, pad = 6;
    const pic = gridSvg(W, H, [], { cell: c, extra: [() => poly(P.map(([x, y]) => [pad + x * c, pad + y * c]), { fill: 'a' })] });
    return item(`The triangle is drawn on a grid of 1 cm squares. What is its area?`, built,
      explainWith(`Draw the smallest rectangle around the triangle (${box} cm²) and subtract the right-angled triangles outside the shaded one. The area is ${num(area)} cm².`, built), { svg: pic });
  } });

defHard({ id: 'h-remainders', topic: 'remainders',
  gen(R, level) {
    const divs = R.pick([[2, 3, 4], [3, 4, 5], [2, 3, 5], [4, 5, 6], [2, 3, 4, 5, 6], [3, 5, 7], [2, 5, 9], [4, 6, 9], [3, 4, 7], [5, 6, 8]]);
    const minD = Math.min.apply(null, divs);
    const r = R.int(1, minD - 1);
    const L = divs.reduce(lcm);
    const must = R.pick([7, 11, 13, 17, 19, 23].filter(m => !divs.includes(m)));
    const mode = R.pick(['smallest', 'smallest', 'largest3']);
    let n = null;
    if (mode === 'smallest') { for (let k = 1; k < 2000; k++) { const v = L * k + r; if (v % must === 0) { n = v; break; } } }
    else { for (let k = Math.floor(999 / L); k >= 1; k--) { const v = L * k + r; if (v <= 999 && v >= 100 && v % must === 0) { n = v; break; } } }
    if (!n) return this.gen(R, level);
    const built = numOpts(R, n, [
      { v: mode === 'smallest' ? L + r : n - L, why: `does not check divisibility by ${must}`, tag: 'part-only' },
      { v: L * must, why: 'multiplies the divisors together', tag: 'operation' },
      { v: mode === 'smallest' ? n + L * must : n - L * must, why: mode === 'smallest' ? 'gives a later number that works' : 'gives a smaller number that works', tag: 'misread' },
      { v: n - r, why: 'forgets the remainder', tag: 'part-only' },
    ], { min: 1 });
    return item(mode === 'smallest' ? `What is the smallest whole number that leaves a remainder of ${r} when divided by each of ${listAnd(divs.map(String))}, and is also a multiple of ${must}?`
      : `What is the largest three-digit number that leaves a remainder of ${r} when divided by each of ${listAnd(divs.map(String))}, and is also a multiple of ${must}?`, built,
      explainWith(`Numbers leaving remainder ${r} are ${r} more than a multiple of ${L}: ${L + r}, ${2 * L + r}, ${3 * L + r}, … The ${mode === 'smallest' ? 'first' : 'largest three-digit one'} of these that ${must} divides is ${n}.`, built));
  } });

defHard({ id: 'h-train-length', topic: 'speed and length',
  gen(R, level) {
    const len = R.int(8, 30) * 10, speedMs = R.pick([10, 15, 20, 25]);
    const bridge = R.int(10, 60) * 10;
    const t = (len + bridge) / speedMs;
    if (!isInt(t)) return this.gen(R, level);
    const ask = R.chance(0.5);
    const ans = ask ? t : len;
    const built = numOpts(R, ans, ask ? [
      { v: bridge / speedMs, why: 'forgets the length of the train', tag: 'part-only' },
      { v: len / speedMs, why: 'uses only the train', tag: 'part-only' },
      { v: (bridge - len) / speedMs, why: 'subtracts the lengths', tag: 'operation' },
      { v: t + 2, why: 'is a slip', tag: 'slip' },
    ] : [
      { v: speedMs * t, why: 'gives the total distance travelled', tag: 'part-only' },
      { v: bridge, why: 'gives the bridge length', tag: 'misread' },

                    : `A train travels at ${speedMs} metres per second. From the moment its front reaches a ${bridge} m bridge until its back leaves the bridge takes ${t} seconds. How long is the train?`, built,
      explainWith(`The front must travel the bridge plus the train's own length: ${bridge} + ${len} = ${bridge + len} m, which takes ${t} seconds at ${speedMs} m/s.`, built));
  } });

defHard({ id: 'h-ratio-add', topic: 'changing ratios',
  gen(R, level) {
    const [A, B] = names(R, 2);
    const a = R.int(2, 7), b = R.int(1, a - 1 || 1);
    if (gcd(a, b) !== 1 || a === b) return this.gen(R, level);
    const unit = R.int(3, 12);
    const x = a * unit, y = b * unit;
    const add = R.int(2, 15);
    const g = gcd(x + add, y + add);
    const c = (x + add) / g, d = (y + add) / g;
    if (c > 12 || d > 12 || (c === a && d === b)) return this.gen(R, level);
    const built = numOpts(R, x + y, [
      { v: x + y + 2 * add, why: 'gives the total after the extra cards', tag: 'misread' },
      { v: x, why: `gives ${A}'s starting number only`, tag: 'part-only' },
      { v: (a + b) * add, why: 'multiplies the ratio by the cards added', tag: 'operation' },
      { v: (c + d) * unit, why: 'uses the new ratio with the old part size', tag: 'misread' },
    ], { min: 1 });
    return item(`${A} and ${B} have trading cards in the ratio ${a} : ${b}. Each of them is then given ${add} more cards, and the ratio becomes ${c} : ${d}. How many cards did they have altogether at the start?`, built,
      explainWith(`Try multiples of the first ratio: ${a}k and ${b}k with ${add} added to each must be in the ratio ${c} : ${d}. That happens when k = ${unit}: ${x} and ${y}, total ${x + y}.`, built));
  } });

defHard({ id: 'h-squares-in-grid', topic: 'counting shapes', fam: 'Space and geometry',
  gen(R, level) {

/* ==========================================================================
   Thinking Skills — logic puzzles. Every puzzle here is checked by a small

'use strict';

function perms(arr) {
  if (arr.length <= 1) return [arr.slice()];
  const out = [];
  arr.forEach((x, i) => perms(arr.slice(0, i).concat(arr.slice(i + 1))).forEach(p => out.push([x].concat(p))));
  return out;
}

/* Four-option builder for TS: correct first, then three wrongs, shuffled unless keep */
function opts4(R, correct, wrongs, keep) {
  return textOpts(R, correct, wrongs, { n: 4, order: keep ? 'keep' : 'shuffle' });

  return { options: opts, answer: ans,
    whys: opts.map((o, i) => i === ans ? null : 'misjudges whether one of the claims must follow'),
    tags: opts.map((o, i) => i === ans ? null : 'logic') };
}

  gen(R, level) {

    }));

    const good = qs.filter(works), bad = qs.filter(q => !works(q) && pool.some(q.f) && pool.some(p => !q.f(p)));
    const useless = qs.filter(q => pool.every(q.f) || pool.every(p => !q.f(p)));
    if (!good.length || bad.length + useless.length < 3) return this.gen(R, level);
    const g = R.pick(good);
    const wrongs = R.shuffle(bad).slice(0, 2).concat(R.shuffle(useless)).slice(0, 3).map(q => ({ s: q.s, why: pool.every(q.f) || pool.every(p => !q.f(p)) ? 'has an answer you already know from the clues' : 'leaves more than one order possible for one of its answers', tag: 'logic' }));
    if (wrongs.length < 3) return this.gen(R, level);
    const built = opts4(R, g.s, wrongs);
    return item(`The code to open a door is a row of four pictures: ${listAnd(pics.map(p => 'a ' + p))}. You have these clues:<br>${clues.map(c => '• ' + c.s).join('<br>')}<br>You may ask one yes-or-no question. Which question would let you work out the code, whatever the answer?`, built,
      `The clues leave ${pool.length} possible orders: ${pool.map(p => p.join('–')).join('; ')}. "${g.s}" has a different answer for each of them, so either answer fixes the code.`);
  } });

/* ---- exactly one liar ---- */
defTS({ id: 'ts-liar', topic: 'truth and lies', fam: 'Logic and deduction',
  gen(R, level) {
    const ppl = names(R, byLevel(level, 3, 4, 4));
    const culprit = R.pick(ppl);
    const deed = R.pick(['ate the last biscuit', 'broke the window', 'left the gate open', 'hid the ball']);
    const nLiars = byLevel(level, 1, 1, R.pick([1, 2]));
    const stTypes = (sp) => {
      const o = R.pick(ppl.filter(x => x !== sp));
      return R.pick([
        { s: `“${o} did it.”`, f: c => c === o },
        { s: `“I did not do it.”`, f: c => c !== sp },
        { s: `“${o} did not do it.”`, f: c => c !== o },
        { s: `“It was either ${o} or me.”`, f: c => c === o || c === sp },
      ]);
    };
    let statements, ok = false;
    for (let t = 0; t < 200 && !ok; t++) {
      statements = ppl.map(sp => ({ sp, ...stTypes(sp) }));
      // number of liars under each culprit hypothesis
      const sols = ppl.filter(c => statements.filter(s => !s.f(c)).length === nLiars);
      ok = sols.length === 1 && sols[0] === culprit;
    }
    if (!ok) return this.gen(R, level);
    const built = opts4(R, culprit, ppl.filter(x => x !== culprit).slice(0, 3).map(x => ({ s: x, why: `would make ${nLiars === 1 ? 'a different number of people' : 'the wrong number of people'} lie`, tag: 'logic' })));
    while (built.options.length < 4) built.options.push('It cannot be worked out'), built.whys.push('one person is consistent with the statements'), built.tags.push('logic');
    return item(`Someone ${deed}. Each person made one statement, and exactly ${nLiars === 1 ? 'one of them is' : 'two of them are'} lying.<br>${statements.map(s => `${s.sp}: ${s.s}`).join('<br>')}<br>Who ${deed}?`, built,
      `Try each person as the culprit and count the false statements. Only when ${culprit} is the culprit ${nLiars === 1 ? 'is exactly one statement' : 'are exactly two statements'} false.`);
  } });

/* ---- round-robin points table ---- */
defTS({ id: 'ts-tournament', topic: 'tournament tables', fam: 'Logic and deduction',
  gen(R, level) {
    const teams = R.sample(['Lions', 'Hawks', 'Sharks', 'Wolves', 'Bears'], 4);
    const pairs = [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]];
    const res = pairs.map(() => R.int(0, 2)); // 0 first wins, 1 draw, 2 second wins
    const pts = r => { const p = [0, 0, 0, 0]; pairs.forEach(([a, b], i) => { if (r[i] === 0) p[a] += 3; else if (r[i] === 2) p[b] += 3; else { p[a]++; p[b]++; } }); return p; };
    const P = pts(res);
    const all = [];
    for (let m = 0; m < 729; m++) { const r = []; let x = m; for (let i = 0; i < 6; i++) { r.push(x % 3); x = Math.floor(x / 3); } all.push(r); }
    const match = all.filter(r => pts(r).join() === P.join());
    const q = R.int(0, 1);
    const ansOf = r => q === 0 ? r.filter(x => x === 1).length : (() => { const [a, b] = pairs[0]; return r[0]; })();
    const vals = new Set(match.map(r => q === 0 ? r.filter(x => x === 1).length : r[0]));
    if (vals.size !== 1) return this.gen(R, level);
    const draws = res.filter(x => x === 1).length;
    if (q === 0) {
      const built = opts4(R, String(draws), [0, 1, 2, 3, 4, 5].filter(x => x !== draws).slice(0, 3).map(x => ({ s: String(x), why: 'does not give these points totals', tag: 'logic' })));
      const ord = built.options.map(Number).map((v, i) => i).sort((a, b) => Number(built.options[a]) - Number(built.options[b]));
      const b2 = { options: ord.map(i => built.options[i]), answer: ord.indexOf(built.answer), whys: ord.map(i => built.whys[i]), tags: ord.map(i => built.tags[i]) };
      return item(`Four teams each played each other once. A win scored 3 points, a draw 1 point and a loss 0 points. The final points were: ${teams.map((t, i) => `${t} ${P[i]}`).join(', ')}. How many of the matches were draws?`, b2,
        `There were 6 matches. Each win adds 3 points to the total and each draw adds 2. The total is ${sum(P)}, so 3 × wins + 2 × draws = ${sum(P)} with wins + draws = 6, giving ${draws} draw${draws === 1 ? '' : 's'}.`);
    }
    const outcome = r => r[0] === 0 ? `${teams[0]} beat ${teams[1]}` : r[0] === 2 ? `${teams[1]} beat ${teams[0]}` : `${teams[0]} and ${teams[1]} drew`;
    const ans = outcome(res);
    const wrongs = [`${teams[0]} beat ${teams[1]}`, `${teams[1]} beat ${teams[0]}`, `${teams[0]} and ${teams[1]} drew`, 'It cannot be worked out'].filter(s => s !== ans).map(s => ({ s, why: 'does not fit the points table', tag: 'logic' }));
    const built = textOpts(R, ans, wrongs, { n: 4, order: 'keep' });
    return item(`Four teams each played each other once. A win scored 3 points, a draw 1 point and a loss 0 points. The final points were: ${teams.map((t, i) => `${t} ${P[i]}`).join(', ')}. What was the result of the match between ${teams[0]} and ${teams[1]}?`, built,
      `Work out how each team could have reached its total. Every way of getting these totals has the same result in this match: ${ans}.`);
  } });

/* ---- switches and lights ---- */
defTS({ id: 'ts-switches', topic: 'switches and states', fam: 'Logic and deduction',
  gen(R, level) {
    const lights = ['red', 'green', 'blue', 'yellow'];
    const ns = byLevel(level, 3, 3, 4);
    let ctrl;
    for (let t = 0; t < 100; t++) {
      ctrl = range(1, ns).map(() => lights.filter(() => R.chance(0.45)));
      if (ctrl.every(c => c.length >= 1) && lights.every(l => ctrl.some(c => c.includes(l)))) break;
    }
    const states = [];
    for (let m = 0; m < (1 << ns); m++) {
      const on = new Set();
      ctrl.forEach((c, i) => { if (m & (1 << i)) c.forEach(l => { if (on.has(l)) on.delete(l); else on.add(l); }); });
      states.push(on);
    }
    const st = [
      { s: 'It is possible to have all four lights on.', v: states.some(o => o.size === 4) },
      ...lights.flatMap(a => lights.filter(b => b !== a).map(b => ({ s: `The ${a} light cannot be on when the ${b} light is on.`, v: !states.some(o => o.has(a) && o.has(b)) }))),
      ...lights.flatMap(a => lights.filter(b => b !== a).map(b => ({ s: `Whenever the ${a} light is on, the ${b} light is also on.`, v: states.every(o => !o.has(a) || o.has(b)) }))),
    ];
    const tr = st.filter(x => x.v), fa = st.filter(x => !x.v);
    if (!tr.length || fa.length < 3) return this.gen(R, level);
    const g = R.pick(tr);
    const built = opts4(R, g.s, R.sample(fa, 3).map(x => ({ s: x.s, why: 'fails for at least one setting of the switches', tag: 'logic' })));
    return item(`Some switches control a set of four lights. Changing a switch changes every light it controls (off to on, or on to off).<br>${ctrl.map((c, i) => `• Switch ${i + 1} controls the ${listAnd(c)} light${c.length > 1 ? 's' : ''}.`).join('<br>')}<br>When all the switches are off, all the lights are off. Which one of the following is true?`, built,
      g.s.startsWith('It is possible') ? `List what each combination of switches does. Turning on ${(() => { for (let m = 0; m < (1 << ns); m++) if (states[m].size === 4) return 'switches ' + listAnd(range(1, ns).filter(i => m & (1 << (i - 1))).map(String)); return ''; })()} lights all four. Each of the other statements fails for at least one combination.`
        : `List what each combination of switches does. "${g.s}" holds in every case, and each of the other statements fails for at least one combination.`);
  } });

/* ==========================================================================
   Thinking Skills — number and code puzzles (four options, A–D)
