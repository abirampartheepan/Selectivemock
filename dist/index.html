'use strict';

function numOpts4(R, correct, cands, o) { return numOpts(R, correct, cands, Object.assign({ n: 4 }, o || {})); }

/* ---- letters counted from a daily starting position ---- */
defTS({ id: 'ts-letter-position', topic: 'codes', fam: 'Number and code puzzles',
  gen(R, level) {
    const sentences = ['Only members will be allowed in.', 'Every good plan begins with a question.', 'Bring your own lunch on Friday.',
      'The quickest route is not always the shortest.', 'Please knock twice before entering.', 'Silence is golden in the library.'];
    const sent = R.pick(sentences);
    const letters = sent.replace(/[^A-Za-z]/g, '').toLowerCase().split('');
    const L = letters.length;
    const start = R.int(1, Math.min(12, L - 12));
    const at = (st, k) => letters[(st - 1 + k - 1) % L];
    const [p1, p2] = [R.int(2, 6), R.int(7, 11)];
    const first = [at(start, p1), at(start, p2)];
    // the start must be the only one consistent with the first answer
    const starts = range(1, L).filter(st => at(st, p1) === first[0] && at(st, p2) === first[1]);
    if (starts.length !== 1) return this.gen(R, level);
    const [q1, q2] = byLevel(level, [R.int(2, 6), R.int(7, 12)], [R.int(3, 9), R.int(10, 16)], [R.int(5, 12), R.int(14, 22)]);
    const ans = `${at(start, q1)} and ${at(start, q2)}`;
    const wrongs = [
      { s: `${letters[q1 - 1]} and ${letters[q2 - 1]}`, why: 'counts from the start of the sentence instead of the starting position', tag: 'misread' },
      { s: `${at(start + 1, q1)} and ${at(start + 1, q2)}`, why: 'starts counting one letter late', tag: 'off-by-one' },
      { s: `${at(start - 1 > 0 ? start - 1 : L, q1)} and ${at(start - 1 > 0 ? start - 1 : L, q2)}`, why: 'starts counting one letter early', tag: 'off-by-one' },
      { s: `${at(start, q2)} and ${at(start, q1)}`, why: 'gives the letters in the wrong order', tag: 'reversed' },
    ];
    const built = textOpts(R, ans, wrongs, { n: 4 });
    if (built.options.length < 4) return this.gen(R, level);
    return item(`To get into a secret club you must answer two questions about this sentence:<br><b>${sent}</b><br>Each day there is a secret starting letter. You are given two numbers and must say the letters in those positions, counting the starting letter as 1 and ignoring spaces and punctuation. Today the first person was given ${p1} and ${p2}, and correctly answered <b>${first[0]}</b> and <b>${first[1]}</b>. The second person is given ${q1} and ${q2}. What should they answer?`, built,
      `${first[0]} and ${first[1]} only fit if today's starting letter is letter ${start} of the sentence. Counting from there, positions ${q1} and ${q2} are ${ans}.`);
  } });

/* ---- symbol substitution code ---- */
const CODE_SETS = [
  ['SPRING', 'SUMMER', 'AUTUMN', 'WINTER'], ['MONDAY', 'FRIDAY', 'SUNDAY', 'TUESDAY'], ['YELLOW', 'PURPLE', 'ORANGE', 'SILVER'],
  ['TIGER', 'ZEBRA', 'CAMEL', 'KOALA'], ['PIANO', 'FLUTE', 'DRUMS', 'CELLO'], ['APPLE', 'MANGO', 'LEMON', 'PEACH'],
];
const SYMS = ['@', '#', '$', '%', '&', '!', '?', '+', '=', '~', '^', '*', '§', '¤', '◇', '○', '△', '□', '☆', '♠', '♣', '♥', '♦', '¶', '∞', '≈'];
defTS({ id: 'ts-cipher', topic: 'codes', fam: 'Number and code puzzles',
  gen(R, level) {
    const words4 = R.pick(CODE_SETS);
    const target = R.pick(words4);
    const map = {}; const syms = R.shuffle(SYMS);
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach((c, i) => { map[c] = syms[i]; });
    const enc = w => w.split('').map(c => map[c]).join(' ');
    const knownPool = ['JODY', 'TODD', 'MARK', 'LUCY', 'IVAN', 'NOAH', 'RUBY', 'OMAR', 'ELLA', 'SAMI', 'PRIYA', 'GRACE'];
    const known = R.sample(knownPool, byLevel(level, 2, 2, 1));
    // the coded word must be identifiable: exactly one option fits the known letters and the symbol pattern
    const fits = w => {
      if (w.length !== target.length) return false;
      const m = {}; const used = {};
      known.forEach(k => k.split('').forEach(c => { m[c] = map[c]; used[map[c]] = c; }));
      const code = target.split('').map(c => map[c]);
      for (let i = 0; i < w.length; i++) {
        const c = w[i], s = code[i];
        if (m[c] && m[c] !== s) return false;
        if (used[s] && used[s] !== c) return false;
        m[c] = s; used[s] = c;
      }
      return true;
    };
    const opts = words4.filter(w => w.length === target.length || true);
    const ok = opts.filter(fits);
    if (ok.length !== 1 || ok[0] !== target) return this.gen(R, level);
    const built = textOpts(R, cap(target.toLowerCase()), opts.filter(w => w !== target).map(w => ({ s: cap(w.toLowerCase()), why: w.length !== target.length ? 'has the wrong number of letters' : 'clashes with a letter whose symbol is already known', tag: 'logic' })), { n: 4, order: 'keep' });
    return item(`Two friends write messages in a code in which every letter of the alphabet always has its own symbol. In this code, ${known.map(k => `${cap(k.toLowerCase())} is written <span class="mono">${enc(k)}</span>`).join(' and ')}. One of them writes this word: <span class="mono">${enc(target)}</span>. Which word is it?`, built,
      `Line up each word with the coded symbols. Only ${cap(target.toLowerCase())} has the right number of letters and agrees with every symbol already known from ${listAnd(known.map(k => cap(k.toLowerCase())))}, with different letters always getting different symbols.`);
  } });

/* ---- exchange rates (barter) ---- */
defTS({ id: 'ts-exchange', topic: 'exchange rates', fam: 'Number and code puzzles',
  gen(R, level) {
    const items = R.pick([['shells', 'beads', 'feathers', 'stones'], ['azzes', 'bayos', 'cotts', 'duits'], ['red tokens', 'blue tokens', 'gold tokens', 'silver tokens']]);
    const r1 = [R.int(2, 5), R.int(2, 5)], r2 = [R.int(2, 6), R.int(2, 6)];
    if (r1[0] === r1[1] || r2[0] === r2[1]) return this.gen(R, level);
    // r1[0] A = r1[1] B ; r2[0] B = r2[1] C ; how many A for n C
    const n = lcm(r2[1], 1) * R.int(1, 4) * byLevel(level, 1, 2, 3);
    const B = n * r2[0] / r2[1];
    const A = B * r1[0] / r1[1];
    if (!isInt(A) || !isInt(B) || A > 400) return this.gen(R, level);
    const built = numOpts4(R, A, [
      { v: B, why: 'stops at the middle item', tag: 'part-only' },
      { v: round6(n * r2[1] / r2[0] * r1[1] / r1[0]), why: 'turns both rates upside down', tag: 'reversed' },
      { v: round6(n * r1[0] * r2[0]), why: 'multiplies without dividing', tag: 'operation' },
    ], { min: 1 });
    return item(`At a market, ${r1[0]} ${items[0]} can be swapped for ${r1[1]} ${items[1]}, and ${r2[0]} ${items[1]} can be swapped for ${r2[1]} ${items[2]}. How many ${items[0]} are needed to get ${n} ${items[2]}?`, built,
      explainWith(`${n} ${items[2]} cost ${B} ${items[1]} (${n} × ${r2[0]} ÷ ${r2[1]}), and ${B} ${items[1]} cost ${A} ${items[0]} (${B} × ${r1[0]} ÷ ${r1[1]}).`, built));
  } });

/* ---- token piles ---- */
defTS({ id: 'ts-token-piles', topic: 'number puzzles', fam: 'Number and code puzzles',
  gen(R, level) {
    const vals = R.pick([[2, 5, 10], [3, 4, 6], [2, 7, 9], [5, 8, 12], [1, 4, 10]]);
    const k = R.int(4, 14);
    const pair = R.sample([0, 1, 2], 2);
    const other = [0, 1, 2].find(i => !pair.includes(i));
    const tot2 = (vals[pair[0]] + vals[pair[1]]) * k;
    const ans = vals[other] * k;
    const built = numOpts4(R, ans, [
      { v: tot2 - ans, why: 'subtracts instead of finding the number of tokens first', tag: 'operation' },
      { v: vals[other] * Math.round(tot2 / vals[other] / 3), why: 'shares the total equally between the piles', tag: 'misread' },
      { v: (vals[0] + vals[1] + vals[2]) * k, why: 'gives the total of all three piles', tag: 'misread' },
      { v: ans + vals[other], why: 'counts one token too many', tag: 'off-by-one' },
    ], { fmt: x => x + ' points', min: 1 });
    return item(`In a game, tokens are worth ${vals[0]}, ${vals[1]} or ${vals[2]} points. I have one pile of each kind of token, and each pile has the same number of tokens. The ${vals[pair[0]]}-point pile and the ${vals[pair[1]]}-point pile together are worth ${tot2} points. What is the ${vals[other]}-point pile worth?`, built,
      explainWith(`One token from each of the two piles is worth ${vals[pair[0]] + vals[pair[1]]}, so each pile has ${tot2} ÷ ${vals[pair[0]] + vals[pair[1]]} = ${k} tokens. The other pile is ${k} × ${vals[other]} = ${ans} points.`, built));
  } });

/* ---- target zones: unknown values, deduce a score ---- */
defTS({ id: 'ts-target', topic: 'number puzzles', fam: 'Number and code puzzles',
  gen(R, level) {
    const zones = ['inner ring', 'second ring', 'third ring', 'outer ring'];
    // values: inner highest, each ring fewer than the one inside it
    for (let t = 0; t < 200; t++) {
      const v = R.sample(range(1, byLevel(level, 9, 12, 15)), 4).sort((a, b) => b - a);
      const ppl = names(R, 4);
      const shots = ppl.map(() => { const s = [0, 0, 0, 0, 0]; for (let i = 0; i < 3; i++) s[R.int(0, 4)]++; return s; }); // index 4 = miss
      const score = s => s[0] * v[0] + s[1] * v[1] + s[2] * v[2] + s[3] * v[3];
      const scores = shots.map(score);
      // solve: which value sets (strictly decreasing, 1..15) fit the first three players
      const fitting = [];
      for (let a = 1; a <= 15; a++) for (let b = 1; b < a; b++) for (let c = 1; c < b; c++) for (let d = 1; d < c; d++) {
        const vv = [a, b, c, d];
        if (shots.slice(0, 3).every((s, i) => s[0] * a + s[1] * b + s[2] * c + s[3] * d === scores[i])) fitting.push(vv);
      }
      const answers = new Set(fitting.map(vv => shots[3][0] * vv[0] + shots[3][1] * vv[1] + shots[3][2] * vv[2] + shots[3][3] * vv[3]));
      if (answers.size !== 1 || shots[3][4] === 3) continue;
      const desc = s => { const parts = []; zones.forEach((z, i) => { if (s[i]) parts.push(`${s[i]} in the ${z}`); }); if (s[4]) parts.push(`${s[4]} miss${s[4] > 1 ? 'es' : ''}`); return parts.join(', '); };
      const ans = scores[3];
      const built = numOpts4(R, ans, [
        { v: ans + v[3], why: 'gives one ring the wrong value', tag: 'logic' },
        { v: Math.max(1, ans - v[3]), why: 'gives one ring the wrong value', tag: 'logic' },
        { v: ans + 2, why: 'is a slip', tag: 'slip' },
        { v: Math.round(sum(scores.slice(0, 3)) / 3), why: 'averages the other scores', tag: 'misread' },
      ], { min: 0 });
      return item(`Four friends each had three shots at a target with four rings. Each ring is worth a different whole number of points; the inner ring is worth the most and each ring is worth less than the ring inside it.<br>${ppl.slice(0, 3).map((p, i) => `${p}: ${desc(shots[i])}, scoring ${scores[i]}`).join('<br>')}<br>${ppl[3]}: ${desc(shots[3])}<br>What did ${ppl[3]} score?`, built,
        explainWith(`The first three results fix the rings at ${fitting.length === 1 ? v.join(', ') + ' points (inner to outer)' : 'values that always give the same total'}, so ${ppl[3]} scored ${ans}.`, built));
    }
    return this.gen(R, level);
  } });

/* ---- Venn counting ---- */
defTS({ id: 'ts-venn', topic: 'sorting into groups', fam: 'Number and code puzzles',
  gen(R, level) {
    const ctx = R.pick([
      { intro: 'On a cold morning a teacher counted what the children were wearing.', g: ['a beanie', 'a scarf', 'gloves'], ph: (n, x) => `${n} ${n === 1 ? 'was' : 'were'} wearing ${x}`, both: (n, x, y) => `${n} ${n === 1 ? 'was' : 'were'} wearing both ${x} and ${y}`, all: n => `${n} ${n === 1 ? 'was' : 'were'} wearing all three`, none: n => `${n} ${n === 1 ? 'was' : 'were'} wearing none of them`, q: 'How many children were there?' },
      { intro: 'Every student in a class was asked which sports they play.', g: ['soccer', 'tennis', 'basketball'], ph: (n, x) => `${n} play${n === 1 ? 's' : ''} ${x}`, both: (n, x, y) => `${n} play${n === 1 ? 's' : ''} both ${x} and ${y}`, all: n => `${n} play${n === 1 ? 's' : ''} all three`, none: n => `${n} play${n === 1 ? 's' : ''} none of them`, q: 'How many students are in the class?' },
      { intro: 'Every family in a street was asked about their pets.', g: ['a dog', 'a cat', 'a bird'], ph: (n, x) => `${n} ${n === 1 ? 'has' : 'have'} ${x}`, both: (n, x, y) => `${n} ${n === 1 ? 'has' : 'have'} both ${x} and ${y}`, all: n => `${n} ${n === 1 ? 'has' : 'have'} all three`, none: n => `${n} ${n === 1 ? 'has' : 'have'} none of them`, q: 'How many families live in the street?' },
    ]);
    const [A, B, C] = ctx.g;
    const r = { a: R.int(2, 9), b: R.int(1, 6), c: R.int(1, 7), ab: R.int(0, 4), ac: R.int(1, 5), bc: R.int(0, 4), abc: R.int(1, 4), none: R.int(0, 5) };
    if (level === 'easy') { r.bc = 0; r.ab = 0; }
    const nA = r.a + r.ab + r.ac + r.abc, nB = r.b + r.ab + r.bc + r.abc, nC = r.c + r.ac + r.bc + r.abc;

    // non-increasing to the back for a clean drawing

    const flipV = cs => cs.map(([x, y]) => [x, rows - 1 - y]);
    const drop = cs => cs.slice(1);

    let g = sk ? groups.find(x => x.key === sk) : null;

function sparkline(vals, o) {
  o = o || {};
  const W = 148, H = 40, pad = 3;
  if (!vals.length) return '';
  const n = vals.length;
  const x = i => (n === 1 ? W / 2 : pad + i * (W - 2 * pad) / (n - 1));
  const y = v => pad + (1 - v / 100) * (H - 2 * pad);
  const pts = vals.map((v, i) => [x(i), y(v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[n - 1][0].toFixed(1)} ${H - pad} L${pts[0][0].toFixed(1)} ${H - pad} Z`;
  const last = pts[n - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc((o.label || 'score') + ': ' + vals.join('%, ') + '%')}">` +
    `<line x1="${pad}" y1="${y(50)}" x2="${W - pad}" y2="${y(50)}" stroke="currentColor" stroke-opacity="0.14" stroke-dasharray="2 3"/>` +
    (n > 1 ? `<path d="${area}" fill="var(--chart-soft)"/>` : '') +
    `<path d="${line}" fill="none" stroke="var(--chart)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>` +
    `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.9" fill="var(--chart)"/></svg>`;
}
/* A larger score-over-time chart with labelled axes. pts: [{ts, pct, label}] */
function scoreChart(pts, o) {
  o = o || {};
  const W = 560, H = 190, L = 34, Rr = 10, T = 10, B = 26;
  if (!pts.length) return '';
  const n = pts.length;
  const pw = W - L - Rr, ph = H - T - B;
  const x = i => L + (n === 1 ? pw / 2 : i * pw / (n - 1));
  const y = v => T + ph - v / 100 * ph;
  let s = '';
  [0, 25, 50, 75, 100].forEach(v => {
    s += `<line x1="${L}" y1="${y(v)}" x2="${W - Rr}" y2="${y(v)}" stroke="currentColor" stroke-opacity="${v === 0 ? 0.35 : 0.1}"/>`;
    s += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="currentColor" fill-opacity=".6">${v}%</text>`;
  });
  const d = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.pct).toFixed(1)).join(' ');
  s += `<path d="${d}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { s += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.pct).toFixed(1)}" r="3.4" fill="var(--chart)"><title>${esc(p.label)}: ${p.pct}%</title></circle>`; });
  const step = Math.max(1, Math.ceil(n / 6));
  pts.forEach((p, i) => { if (i % step === 0 || i === n - 1) s += `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity=".6">${esc(dateShort(p.ts))}</text>`; });
  return `<svg class="scorechart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'scores over time')}">${s}</svg>`;
}

'use strict';

/* ---------- time spent on each question ---------- */
function bankTime() {
  if (S.enteredAt == null) return;
  const it = S.paper && S.paper.items[S.cur];
  if (it) { const dt = (Date.now() - S.enteredAt) / 1000; if (dt > 0.15 && dt < 3600) S.times[it.n] = (S.times[it.n] || 0) + dt; }
  S.enteredAt = null;
}
function enterQuestion() { if (S.enteredAt == null && S.running) S.enteredAt = Date.now(); }

function tick() {
  if (!S.running) return;
  if (S.countUp) S.secsUp++; else S.secsLeft--;
  const c = $('.clock');
  if (c) { c.textContent = S.countUp ? mmss(S.secsUp) : fmtClock(S.secsLeft); c.classList.toggle('warn', !S.countUp && S.secsLeft <= 300); }
  if (!S.countUp && S.secsLeft <= 0) {
    bankTime(); S.running = false;
    if (S.view === 'writing') finishWriting(); else if (S.view === 'player') finish();
  }
}
function startTimer(mins, countUp) {
  S.countUp = !!countUp; S.secsLeft = mins * 60; S.secsUp = 0; S.running = true;
  if (S.timerId) clearInterval(S.timerId);
  S.timerId = setInterval(tick, 1000);
}
function stopTimer() { bankTime(); S.running = false; if (S.timerId) clearInterval(S.timerId); S.timerId = null; }
function usedSeconds() {
  const p = S.paper; if (!p) return 0;
  return S.countUp ? S.secsUp : Math.max(0, p.spec.minutes * 60 - Math.max(0, S.secsLeft));
}
function resetSitting() {
  S.responses = {}; S.flags = {}; S.cur = 0; S.marked = null; S.navOpen = false; S.essay = ''; S.selfBands = {};
  S.times = {}; S.enteredAt = null; S.scratch = ''; S.scratchOpen = false; S.stimOpen = true; S.reviewing = null;
}

/* ---------- starting things ---------- */
function startExamTest(examId, module) {
  const p = buildExamModule(examId, module);
  if (!p) { toast('That test is not available yet.'); return; }
  S.paper = p; S.examId = examId;
  resetSitting();
  if (module === 'writing') { S.view = 'writing'; startTimer(SPEC.writing.minutes); }
  else { S.view = 'player'; startTimer(SPEC[module].minutes); }
  render(); window.scrollTo(0, 0);
}
function startFullExam(examId) {
  const mods = MODULE_ORDER.filter(m => examReady(examId, m));
  if (!mods.length) return;
  QUEUE = mods.slice(1);
  startExamTest(examId, mods[0]);
}
function startDrill(famKey, n) {
  const p = assembleDrill(famKey, S.drillLevel, n || 8, (Date.now() % 1e9) + 7);
  if (!p) return;
  QUEUE = []; S.paper = p; resetSitting(); S.view = 'player'; startTimer(p.spec.minutes, true);
  render(); window.scrollTo(0, 0);
}
/* Redo questions from saved records. Cloze and gapped texts are redone whole,
   because a passage with eight gaps and two questions makes no sense. */
function startRedo(records, label) {
  if (!records || !records.length) { toast('Nothing to redo here.'); return; }
  const out = [], seen = new Set();
  records.forEach(r => {
    if (r.kind === 'exam' && r.module === 'reading') {
      const p = buildExamModule(r.exam, 'reading');
      const it = p && p.items.find(x => x.n === r.n);
      const sec = it && p.sections[it.sectionIdx];
      if (sec && (sec.type === 's2' || sec.type === 's4')) {
        for (let n = sec.from; n <= sec.to; n++) { const rr = { kind: 'exam', exam: r.exam, module: 'reading', n }; const k = recKey(rr); if (!seen.has(k)) { seen.add(k); out.push(rr); } }
        return;
      }
    }
    const k = recKey(r); if (!seen.has(k)) { seen.add(k); out.push(r); }
  });
  const p = buildSet(out.slice(0, 40), { mode: 'redo', name: label || 'Redo', short: 'Redo', restTitle: label || 'Questions to redo' });
  if (!p) { toast('Those questions could not be rebuilt.'); return; }
  QUEUE = []; S.paper = p; resetSitting(); S.view = 'player'; startTimer(p.spec.minutes, true);
  render(); window.scrollTo(0, 0);
}

/* ---------- finishing ---------- */
function finish() {
  bankTime();
  const usedSec = usedSeconds();
  stopTimer();
  const p = S.paper;
  S.marked = mark(p, S.responses);
  S.view = 'results'; S.navOpen = false; S.scratchOpen = false;
  const missed = p.items.filter(it => S.responses[it.n] !== it.answer).map(it => ({ rec: recordOf(it, p), given: S.responses[it.n] == null ? null : S.responses[it.n], fam: it.fam, module: it.module || p.module, tag: it.tags && S.responses[it.n] != null ? it.tags[S.responses[it.n]] : null, slow: (S.times[it.n] || 0) > 2 * (p.spec.minutes * 60 / p.items.length) }));
  if (p.mode === 'redo') p.items.forEach(it => { const r = recordOf(it, p); if (r) recordRedo(recKey(r), S.responses[it.n] === it.answer); });
  const a = {
    id: 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(),
    kind: p.mode === 'exam' ? 'exam' : p.mode, exam: p.examId || null, tier: p.tier || p.level, module: p.mode === 'exam' ? p.module : (p.module || 'practice'),
    label: p.mode === 'exam' ? null : p.label || p.spec.name,
    responses: Object.assign({}, S.responses), flags: Object.assign({}, S.flags),
    times: p.items.map(it => Math.round(S.times[it.n] || 0)),
    correct: S.marked.correct, n: S.marked.n, pct: S.marked.pct,
    secondsUsed: Math.round(usedSec), minutes: p.spec.minutes, countUp: S.countUp,
    topics: S.marked.topics, missed,
    records: p.mode === 'exam' ? null : p.items.map(it => recordOf(it, p)),

  addAttempt(a);
  S.reviewing = a.id;
  render(); window.scrollTo(0, 0);
}
function finishWriting() {
  const usedSec = usedSeconds();
  stopTimer();
  S.view = 'writingResult';
  const p = S.paper;
  const a = {
    id: 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(),
    kind: 'exam', exam: p.examId, tier: p.tier, module: 'writing',
    essay: S.essay, words: wordsIn(S.essay), bands: {}, promptTitle: p.prompt.title, genre: p.prompt.genre,
    secondsUsed: Math.round(usedSec), minutes: 30,

  addAttempt(a);

  render(); window.scrollTo(0, 0);
}

'use strict';

/* Rebuild the paper a saved attempt was sat on. */
function paperForAttempt(a) {
  if (a.kind === 'exam') return buildExamModule(a.exam, a.module);
  if (a.records) return buildSet(a.records.filter(Boolean), { mode: a.kind, name: a.label, short: a.label, restTitle: a.label, module: a.module });
  return null;
}
function paceStrip(paper, responses, times) {
  const secs = paper.items.map((it, i) => times[i] || 0);
  const max = Math.max.apply(null, secs.concat([1]));
  return '<div class="pacestrip">' + paper.items.map((it, i) => {
    const g = responses[it.n];
    const cls = g == null ? 'skip' : (g === it.answer ? 'ok' : 'no');
    const h = Math.max(3, Math.round(secs[i] / max * 100));
    return `<span class="b ${cls}" style="height:${h}%" title="${esc('Q' + it.n + ' · ' + (secs[i] ? mmss(secs[i]) : 'not visited') + ' · ' + (g == null ? 'blank' : g === it.answer ? 'correct' : 'wrong'))}"></span>`;
  }).join('') + '</div>';
}
function tagCounts(paper, responses) {
  const c = {};
  paper.items.forEach(it => {
    const g = responses[it.n];
    if (g == null || g === it.answer || !it.tags) return;
    const t = it.tags[g]; if (t) c[t] = (c[t] || 0) + 1;
  });
  return Object.keys(c).map(k => ({ tag: k, n: c[k] })).sort((a, b) => b.n - a.n);
}
const TAG_TIPS = {

  'units': 'Units tripped you up (minutes and hours, mL and L). Convert everything to one unit first.',
  'place': 'A decimal point or zero went astray. Estimate the size of the answer before you calculate.',
  'off-by-one': 'You counted one too many or too few. Check where your counting starts and ends.',
  'misread': 'You answered a slightly different question. Underline exactly what is being asked.',
  'reversed': 'You worked something the wrong way round. Check the direction: before or after, more or less.',
  'slip': 'An arithmetic slip. Check the last step of your working, where slips are most common.',
  'logic': 'A logic step did not hold. Test the option against every rule, not just one.',
  'spatial': 'A visualising mistake. Track one corner or one face at a time.',
};

function renderResults() {

  const m = { correct: a.correct, n: a.n, pct: a.pct, attempted: Object.keys(resp).length };
  const b = band(m.pct);
  const fresh = S.view === 'results' && Date.now() - a.ts < 10 * 60 * 1000;
  const budget = a.minutes * 60 / Math.max(1, p.items.length);
  const times = a.times || [];
  const slowWrong = p.items.map((it, i) => ({ it, t: times[i] || 0 })).filter(x => x.t > 2 * budget && resp[x.it.n] !== x.it.answer);
  const missedRecs = p.items.filter(it => resp[it.n] !== it.answer).map(it => recordOf(it, p)).filter(Boolean);
  const tags = tagCounts(p, resp);
  const topics = (a.topics || []).slice().sort((x, y) => x.right / x.total - y.right / y.total);
  const weakest = topics.find(t => t.right < t.total && drillFamilies().some(f => f.key === t.module + '·' + t.topic));
  const groups = p.sections.length > 1
    ? p.sections.map(s => ({ sec: s, items: p.items.filter(i => i.n >= s.from && i.n <= s.to) }))
    : [{ sec: p.sections[0], items: p.items }];
  const onlyWrong = S.onlyWrong;
  const crumbs = a.kind === 'exam'
    ? `<button class="linkbtn" data-act="home">Exams</button> › <button class="linkbtn" data-act="openExam" data-id="${esc(a.exam)}">${esc(examLabel(a.exam))}</button> › ${esc(SPEC[a.module].name)}`
    : `<button class="linkbtn" data-act="go" data-view="papers">My papers</button> › ${esc(attemptTitle(a))}`;
  return `
  <div class="results">
    <div class="crumbs">${crumbs}</div>
    <div class="scoreline">
      <div class="big">${m.correct}<s>/${m.n}</s></div>
      <div class="meta"><b>${esc(b.label)} · ${m.pct}%</b><span>${esc(b.note)}</span></div>
      <div class="pills">
        <span class="pill">${dateShort(a.ts)}</span>
        ${a.kind === 'exam' ? `<span class="pill tier-${a.tier}">${esc(TIERS[a.tier].label)}</span>` : `<span class="pill">${a.kind === 'redo' ? 'Redo' : 'Drill'}</span>`}
        <span class="pill ${!a.countUp && a.secondsUsed >= a.minutes * 60 ? 'warn' : 'good'}">${!a.countUp && a.secondsUsed >= a.minutes * 60 ? 'Time ran out' : Math.max(1, Math.round(a.secondsUsed / 60)) + ' min' + (a.countUp ? '' : ' of ' + a.minutes)}</span>
        ${m.attempted < m.n ? `<span class="pill warn">${m.n - m.attempted} left blank</span>` : ''}
      </div>
    </div>

    <div class="rowbtns">
      ${fresh && QUEUE.length ? `<button class="btn primary" data-act="nextTest">Next test: ${esc(SPEC[QUEUE[0]].name)} →</button>` : ''}
      ${missedRecs.length ? `<button class="btn ${fresh && QUEUE.length ? '' : 'primary'}" data-act="redoAttempt" data-id="${esc(a.id)}">Redo the ${missedRecs.length} you missed</button>` : ''}
      ${weakest ? `<button class="btn" data-act="drill" data-fam="${esc(weakest.module + '·' + weakest.topic)}">Drill ${esc(weakest.topic)}</button>` : ''}
      <button class="btn" data-act="print">Print / save as PDF</button>
      ${a.kind === 'exam' ? `<button class="btn" data-act="openExam" data-id="${esc(a.exam)}">Back to ${esc(examLabel(a.exam))}</button>` : `<button class="btn" data-act="go" data-view="papers">My papers</button>`}
    </div>

    ${tags.length ? `<div class="panel">
      <h2>Your mistakes in this paper</h2>
      <p class="lede">Each wrong option on this site is built from a particular mistake. Here is what your wrong answers had in common.</p>
      <div class="tagrows">${tags.map(t => `<div class="tagrow"><span class="tagname">${esc(MISTAKE[t.tag] || t.tag)}</span><span class="tagn">${t.n}</span><span class="tagtip">${esc(TAG_TIPS[t.tag] || '')}</span></div>`).join('')}</div>
    </div>` : ''}

    <div class="panel">
      <h2>By topic</h2>
      <p class="lede">Weakest first.</p>
      <table class="grid"><thead><tr><th>Topic</th><th>Score</th><th></th></tr></thead><tbody>
      ${topics.map(t => { const pc = Math.round(t.right / t.total * 100); return `<tr><td>${esc(t.topic)}</td><td class="num" style="width:56px">${t.right}/${t.total}</td><td style="width:40%"><span class="bar"><i class="${meterClass(pc)}" style="width:${pc}%"></i></span></td></tr>`; }).join('')}
      </tbody></table>
    </div>

    ${times.some(x => x > 0) ? `<div class="panel">
      <h2>Where the time went</h2>
      <p class="lede">One bar per question, tall where you spent longest. An even pace for this test is about ${mmss(budget)} a question.</p>
      <div class="pace">${paceStrip(p, resp, times)}
        <div class="pacekey"><span><i style="background:var(--good)"></i>Correct</span><span><i style="background:var(--bad)"></i>Wrong</span><span><i style="background:var(--rule)"></i>Blank</span></div>
        ${slowWrong.length ? `<div class="notice"><b>${slowWrong.length} question${slowWrong.length > 1 ? 's' : ''} took more than twice the even pace and still went wrong</b> (Q${slowWrong.map(x => x.it.n).join(', Q')}). In the real test, skip a question like this, flag it and come back at the end.</div>` : ''}
      </div>
    </div>` : ''}

    <div class="revhead"><h2>Every question, worked</h2>
      <label class="check"><input type="checkbox" data-act="onlyWrong" ${onlyWrong ? 'checked' : ''}> Show only my mistakes</label>
      <button class="btn small" data-act="openAll">Open all</button></div>
    ${groups.map(g => {
      const its = g.items.filter(it => !onlyWrong || resp[it.n] !== it.answer);
      if (!its.length) return '';
      return `${g.sec && g.sec.stimulus ? `<details class="rev passage"><summary><span class="n">§</span><span class="st">Text</span><span class="sq">${esc(g.sec.title)}: read the passage again</span></summary><div class="body">${renderStimulus(g.sec, -1, resp)}</div></details>` : ''}
      <div class="review">${its.map(it => {
        const given = resp[it.n];
        const cls = given == null ? 'skip' : given === it.answer ? 'ok' : 'no';
        const st = given == null ? 'Blank' : given === it.answer ? 'Correct' : 'Wrong';
        const rec = recordOf(it, p);
        const key = rec ? recKey(rec) : null;
        return `<details class="rev ${cls}"${S.openAll ? ' open' : ''}>
          <summary><span class="n">${it.n}</span><span class="st">${st}</span><span class="sq">${esc(plain(it.stem).slice(0, 110))}</span>
            <span class="counter">${given == null ? '—' : LETTERS[given]} → ${LETTERS[it.answer]}</span>${key && noteFor(key) ? '<span class="hasnote" title="You wrote a note">✎</span>' : ''}</summary>
          <div class="body"><div class="qhead"><span class="qnum">Question ${it.n}</span><span class="qtopic">${esc(it.fam || '')}</span></div>
            ${renderQuestionBody(it, given, true)}${renderFeedback(it, given, key)}</div>
        </details>`;
      }).join('')}</div>`;
    }).join('')}

    ${p.key ? `<div class="panel"><h2>Answer key</h2><div class="keystrip">${p.key.split('').map((c, i) => (i % 10 === 0 && i ? ' &nbsp;' : '') + c).join('')}</div></div>` : ''}
  </div>`;
}

/* ==========================================================================
   Hub pages — My papers, Mistakes, Progress, Drills, Backup
   ========================================================================== */
'use strict';

function hubNav(active) {
  const tabs = [['home', 'Exams'], ['papers', 'My papers'], ['mistakes', 'Mistakes'], ['progress', 'Progress'], ['drills', 'Drills'], ['backup', 'Backup']];
  return `<div class="masthead">
    <div><h1>Selective <span>Exam</span> Practice</h1>
      <p class="sub">100 full practice exams for the NSW Selective High School Placement Test: Reading, Thinking Skills, Mathematical Reasoning and Writing.</p></div>
    <div class="toolbar"><button class="icon-btn" data-act="theme">Theme</button></div>
  </div>
  <nav class="hubnav" aria-label="Sections">${tabs.map(([v, l]) => `<button data-act="go" data-view="${v}" aria-current="${active === v ? 'page' : 'false'}">${l}${v === 'mistakes' && openMistakes().length ? ` <span class="badge">${openMistakes().length}</span>` : ''}</button>`).join('')}</nav>`;
}
function shell(active, body) {
  return `<div class="home">${hubNav(active)}${body}
    <footer class="fine"><span>Practice material written for this site. Not an official publication of the NSW Department of Education.</span>
    <span>Your progress is saved in this browser only. Use Backup to move it to another device.</span>
    <span>Keys while sitting a test: A–E or 1–7 to answer · ← → to move · M to flag</span></footer></div>`;
}

/* ==========================================================================
   My papers
   ========================================================================== */
function renderPapers() {
  const f = S.papersFilter;
  const list = DB.attempts.filter(a => f === 'all' ? true : f === 'practice' ? a.kind !== 'exam' : a.kind === 'exam' && a.module === f);
  const chips = [['all', 'All'], ['reading', 'Reading'], ['thinking', 'Thinking Skills'], ['maths', 'Maths'], ['writing', 'Writing'], ['practice', 'Drills and redos']];
  return shell('papers', `
    <div class="panel">
      <h2>My papers</h2>
      <p class="lede">Every test you have finished, newest first. Open one to see every question again with your answers, the explanations and your notes.</p>
      <div class="chiprow">${chips.map(([k, l]) => `<button class="tchip" data-act="papersFilter" data-f="${k}" aria-pressed="${f === k}">${l}</button>`).join('')}</div>
      ${list.length ? `<table class="grid papers"><thead><tr><th>Date</th><th>Paper</th><th>Score</th><th class="hide-sm">Time</th><th></th></tr></thead><tbody>
        ${list.map(a => `<tr>
          <td>${dateShort(a.ts)}</td>
          <td><b>${esc(attemptTitle(a))}</b>${a.kind === 'exam' ? ` <span class="tierdot tier-${a.tier}" title="${esc(TIERS[a.tier].label)}"></span>` : ''}</td>
          <td class="num">${a.module === 'writing' ? a.words + ' words' : `${a.correct}/${a.n} <span class="pct">${a.pct}%</span>`}</td>
          <td class="num hide-sm">${Math.max(1, Math.round((a.secondsUsed || 0) / 60))} min</td>
          <td class="num"><button class="icon-btn" data-act="review" data-id="${esc(a.id)}">${a.module === 'writing' ? 'Read' : 'Review'}</button>
            ${(a.missed || []).length ? `<button class="icon-btn" data-act="redoAttempt" data-id="${esc(a.id)}">Redo ${a.missed.length}</button>` : ''}</td>
        </tr>`).join('')}</tbody></table>` : `<p class="empty">Nothing here yet. Finished tests appear here automatically.</p>`}
    </div>`);
}

/* ==========================================================================
   Mistakes notebook
   ========================================================================== */
/* Every question answered wrongly (or left blank) in an exam or drill, newest first,
   one entry per question. A question leaves the list once you redo it correctly twice. */
function allMistakes() {
  const seen = new Map();
  DB.attempts.forEach(a => (a.missed || []).forEach(mm => {
    if (!mm.rec) return;
    const k = recKey(mm.rec);
    if (seen.has(k)) { seen.get(k).times++; return; }
    seen.set(k, { key: k, rec: mm.rec, given: mm.given, fam: mm.fam, module: mm.module, tag: mm.tag, ts: a.ts, tier: a.tier, attempt: a.id, times: 1, slow: mm.slow });
  }));
  return Array.from(seen.values());
}
function openMistakes() { return allMistakes().filter(x => !isMastered(x.key)); }
function renderMistakes() {
  const F = S.mistakesFilter;
  const all = allMistakes();
  const fams = Array.from(new Set(all.map(x => x.fam).filter(Boolean))).sort();
  const list = all.filter(x => (F.mastered || !isMastered(x.key)) && (F.module === 'all' || x.module === F.module) &&
    (F.tier === 'all' || x.tier === F.tier) && (F.fam === 'all' || x.fam === F.fam));
  const sel = Object.keys(S.mistakeSel).filter(k => S.mistakeSel[k]);
  const shown = list.slice(0, 60);
  return shell('mistakes', `
    <div class="panel">
      <h2>Mistakes notebook</h2>
      <p class="lede">Every question you got wrong, in one place. Open one to see your answer, the right answer, why your choice was wrong and the full explanation, and add your own note.
      Redo a question correctly twice and it counts as mastered.</p>
      <div class="filters">
        <label>Test <select data-act="mf" data-k="module"><option value="all">All tests</option>${MODULE_ORDER.filter(m => m !== 'writing').map(m => `<option value="${m}" ${F.module === m ? 'selected' : ''}>${SPEC[m].name}</option>`).join('')}</select></label>
        <label>Level <select data-act="mf" data-k="tier"><option value="all">All levels</option>${TIER_ORDER.map(t => `<option value="${t}" ${F.tier === t ? 'selected' : ''}>${TIERS[t].label}</option>`).join('')}</select></label>
        <label>Topic <select data-act="mf" data-k="fam"><option value="all">All topics</option>${fams.map(f => `<option ${F.fam === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select></label>
        <label class="check"><input type="checkbox" data-act="mfMastered" ${F.mastered ? 'checked' : ''}> Show mastered</label>
      </div>
      <div class="rowbtns">
        <button class="btn primary" data-act="redoMistakes" ${list.length ? '' : 'disabled'}>Redo ${sel.length ? sel.length + ' selected' : Math.min(20, list.length) + ' shown'}</button>
        ${sel.length ? `<button class="btn" data-act="clearSel">Clear selection</button>` : ''}
        <span class="hint">${list.length} question${list.length === 1 ? '' : 's'}${list.length > 60 ? ', first 60 shown' : ''}</span>
      </div>
    </div>
    ${shown.length ? `<div class="review">${shown.map(x => renderMistakeRow(x)).join('')}</div>` : `<p class="empty">${all.length ? 'No mistakes match these filters.' : 'No mistakes yet. Questions you get wrong in any test will be collected here.'}</p>`}`);
}
function renderMistakeRow(x) {
  const it = S.openMistake === x.key ? materialise(x.rec) : null;
  const mastered = isMastered(x.key);
  const label = x.rec.kind === 'exam' ? `${examLabel(x.rec.exam)} · ${SPEC[x.rec.module].short} Q${x.rec.n}` : `Drill · ${x.fam}`;
  return `<details class="rev ${mastered ? 'ok' : 'no'}" ${it ? 'open' : ''} data-act="openMistake" data-key="${esc(x.key)}">
    <summary><input type="checkbox" class="selbox" data-act="selMistake" data-key="${esc(x.key)}" ${S.mistakeSel[x.key] ? 'checked' : ''} aria-label="Select for redo">
      <span class="st">${mastered ? 'Mastered' : x.given == null ? 'Blank' : 'Wrong'}</span>
      <span class="sq">${esc(label)} · ${esc(x.fam || '')}</span>
      <span class="counter">${dateShort(x.ts)}${x.times > 1 ? ` · missed ${x.times}×` : ''}</span>${noteFor(x.key) ? '<span class="hasnote" title="You wrote a note">✎</span>' : ''}</summary>
    <div class="body">${it ? `
      ${it._sec ? `<details class="rev passage"><summary><span class="n">§</span><span class="sq">Show the passage</span></summary><div class="body">${renderStimulus(Object.assign({}, it._sec), it.n)}</div></details>` : ''}
      ${renderQuestionBody(it, x.given, true)}${renderFeedback(it, x.given, x.key)}
      <div class="rowbtns"><button class="btn small" data-act="redoOne" data-key="${esc(x.key)}">Redo this question</button></div>` : '<p class="hint">Loading…</p>'}</div>
  </details>`;
}

/* ==========================================================================
   Progress
   ========================================================================== */
function renderProgress() {
  const exams = DB.attempts.filter(a => a.kind === 'exam' && a.module !== 'writing').slice().sort((a, b) => a.ts - b.ts);
  const byMod = {};
  exams.forEach(a => { (byMod[a.module] = byMod[a.module] || []).push(a); });
  const charts = ['reading', 'thinking', 'maths'].map(m => {
    const pts = (byMod[m] || []).map(a => ({ ts: a.ts, pct: a.pct, label: examLabel(a.exam) }));
    const avg = pts.length ? Math.round(pts.reduce((s, p) => s + p.pct, 0) / pts.length) : null;
    const last5 = pts.slice(-5), prev5 = pts.slice(-10, -5);
    const a5 = last5.length ? Math.round(last5.reduce((s, p) => s + p.pct, 0) / last5.length) : null;
    const p5 = prev5.length ? Math.round(prev5.reduce((s, p) => s + p.pct, 0) / prev5.length) : null;
    return `<div class="panel chartpanel"><header><h3>${SPEC[m].name}</h3>
      ${pts.length ? `<span class="fig">${pts.length} paper${pts.length > 1 ? 's' : ''} · average ${avg}%${a5 != null && p5 != null ? ` · last 5 ${a5}% <span class="delta ${a5 > p5 ? 'up' : a5 < p5 ? 'down' : ''}">${a5 > p5 ? '+' : ''}${a5 - p5}</span>` : ''}</span>` : ''}</header>
      ${pts.length ? scoreChart(pts, { label: SPEC[m].name + ' scores' }) : '<p class="empty">No papers yet.</p>'}</div>`;
  }).join('');

  // topic accuracy over the last five papers of each test
  const famRows = ['reading', 'thinking', 'maths'].map(m => {
    const last = (byMod[m] || []).slice(-5);
    const agg = {};
    last.forEach(a => (a.topics || []).forEach(t => { agg[t.topic] = agg[t.topic] || { r: 0, t: 0 }; agg[t.topic].r += t.right; agg[t.topic].t += t.total; }));
    const rows = Object.keys(agg).map(k => ({ topic: k, pct: Math.round(agg[k].r / agg[k].t * 100), r: agg[k].r, t: agg[k].t })).sort((a, b) => a.pct - b.pct);
    if (!rows.length) return '';
    return `<div class="famblock"><span class="eyebrow">${SPEC[m].name} · last ${last.length} paper${last.length > 1 ? 's' : ''}</span>
      ${rows.map(r => `<div class="rec"><span class="who"><b>${esc(r.topic)}</b><span>${r.r} of ${r.t} right</span></span>
        <span class="meter"><i class="${meterClass(r.pct)}" style="width:${r.pct}%"></i></span><span class="fig">${r.pct}%</span>
        ${drillFamilies().some(f => f.key === m + '·' + r.topic) ? `<button class="btn small" data-act="drill" data-fam="${esc(m + '·' + r.topic)}">Drill</button>` : ''}</div>`).join('')}</div>`;
  }).join('');

  // mistake patterns across everything
  const tagC = {};
  DB.attempts.forEach(a => (a.missed || []).forEach(mm => { if (mm.tag) tagC[mm.tag] = (tagC[mm.tag] || 0) + 1; }));
  const tagRows = Object.keys(tagC).map(k => ({ tag: k, n: tagC[k] })).sort((a, b) => b.n - a.n);
  const tagMax = tagRows.length ? tagRows[0].n : 1;

  // timing habits
  const timing = ['reading', 'thinking', 'maths'].map(m => {
    const list = (byMod[m] || []).slice(-5);
    if (!list.length) return '';
    const per = list.map(a => a.secondsUsed / Math.max(1, a.n));
    const avg = per.reduce((s, x) => s + x, 0) / per.length;
    const budget = SPEC[m].minutes * 60 / SPEC[m].n;
    const ranOut = list.filter(a => !a.countUp && a.secondsUsed >= a.minutes * 60).length;
    const slow = list.reduce((s, a) => s + (a.missed || []).filter(x => x.slow).length, 0);
    const blanks = list.reduce((s, a) => s + (a.missed || []).filter(x => x.given == null).length, 0);
    return `<tr><td>${SPEC[m].short}</td><td class="num">${mmss(avg)}</td><td class="num">${mmss(budget)}</td><td class="num">${ranOut}/${list.length}</td><td class="num">${slow}</td><td class="num">${blanks}</td></tr>`;
  }).join('');
  const essays = DB.attempts.filter(a => a.module === 'writing');

  return shell('progress', `
    ${exams.length ? '' : `<div class="nextup"><h2>Nothing to show yet</h2><p class="lede">Finish a Reading, Thinking Skills or Maths test and your scores, weak topics, mistake habits and timing will appear here.</p></div>`}
    <div class="charts">${charts}</div>
    ${famRows ? `<div class="panel"><h2>Topics, weakest first</h2><p class="lede">Accuracy in each topic over your last five papers of each test. Drills give fresh questions on that topic.</p>${famRows}</div>` : ''}
    ${tagRows.length ? `<div class="panel"><h2>Your mistake habits</h2><p class="lede">Every wrong option is built from a particular mistake. These are the ones you make most, across every test and drill.</p>
      <div class="tagrows">${tagRows.map(t => `<div class="tagrow"><span class="tagname">${esc(MISTAKE[t.tag] || t.tag)}</span>
        <span class="bar"><i style="width:${Math.round(t.n / tagMax * 100)}%"></i></span><span class="tagn">${t.n}</span><span class="tagtip">${esc(TAG_TIPS[t.tag] || '')}</span></div>`).join('')}</div></div>` : ''}
    ${timing ? `<div class="panel"><h2>Timing habits</h2><p class="lede">Your last five papers of each test. "Slow and wrong" counts questions that took more than twice the even pace and were still wrong: those are the ones to skip and come back to.</p>
      <table class="grid"><thead><tr><th>Test</th><th>Your pace</th><th>Even pace</th><th>Ran out</th><th>Slow and wrong</th><th>Left blank</th></tr></thead><tbody>${timing}</tbody></table></div>` : ''}
    ${essays.length ? `<div class="panel"><h2>Your writing</h2><table class="grid"><thead><tr><th>Date</th><th>Task</th><th>Words</th><th></th></tr></thead><tbody>
      ${essays.map(a => `<tr><td>${dateShort(a.ts)}</td><td>${esc(a.promptTitle || '')} <span class="hint">${esc(a.genre || '')}</span></td><td class="num">${a.words}</td><td class="num"><button class="icon-btn" data-act="review" data-id="${esc(a.id)}">Read</button></td></tr>`).join('')}
      </tbody></table></div>` : ''}`);
}

/* ==========================================================================
   Drills
   ========================================================================== */
function renderDrills() {
  const fams = drillFamilies();
  return shell('drills', `
    <div class="panel">
      <h2>Drills</h2>
      <p class="lede">Fresh questions on one topic, made new every time, with a stopwatch instead of a countdown. Drills use the Maths and Thinking Skills puzzle types, so they never use up questions from the 100 exams.</p>
      <div class="field"><span class="eyebrow">Level</span><div class="seg">${TIER_ORDER.map(t => `<button data-act="drillLevel" data-t="${t}" aria-pressed="${S.drillLevel === t}">${TIERS[t].label}</button>`).join('')}</div></div>
      ${['maths', 'thinking'].map(m => `<div class="chiprow" style="margin-top:16px"><span class="eyebrow">${SPEC[m].name}</span>
        ${fams.filter(f => f.module === m).map(f => `<button class="tchip" data-act="drill" data-fam="${esc(f.key)}">${esc(f.family)}<span class="n">${f.gens.length} types</span></button>`).join('')}</div>`).join('')}
    </div>`);
}

/* ==========================================================================
   Backup
   ========================================================================== */
function renderBackup() {
  const n = DB.attempts.length;
  let size = 0; try { size = (localStorage.getItem(STORE_KEY) || '').length; } catch (e) { /* ignore */ }
  return shell('backup', `
    <div class="panel">
      <h2>Backup and move your progress</h2>
      <p class="lede">Your papers, mistakes, notes and essays are saved in this browser only. Clearing browser data or using a different device or browser starts you from scratch. Download a backup file now and then, and load it on another device to carry on there.</p>
      <p class="hint">${n} saved paper${n === 1 ? '' : 's'}, ${Object.keys(DB.notes).length} note${Object.keys(DB.notes).length === 1 ? '' : 's'}${size ? `, about ${Math.ceil(size / 1024)} KB` : ''}.</p>
      <div class="rowbtns">
        <button class="btn primary" data-act="export">Download backup file</button>
        <label class="btn filebtn">Load a backup file<input type="file" accept=".json,application/json" data-act="import" hidden></label>
      </div>
      <p class="hint" id="backupMsg"></p>
    </div>
    <div class="panel">
      <h2>Start again</h2>
      <p class="lede">Deletes every saved paper, mistake and note in this browser. Download a backup first if you might want them back.</p>
      <button class="btn danger" data-act="resetAll">Delete all my progress</button>
    </div>`);
}
function exportBackup() {
  const blob = new Blob([JSON.stringify(Object.assign({ exported: new Date().toISOString(), site: 'selective-exam-practice' }, DB))], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `selective-practice-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  const m = $('#backupMsg'); if (m) m.textContent = 'Backup downloaded. Keep the file somewhere safe.';
}
function importBackup(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || !Array.isArray(d.attempts)) throw new Error('not a backup');
      const ids = new Set(DB.attempts.map(a => a.id));
      const added = d.attempts.filter(a => a && a.id && !ids.has(a.id));
      DB.attempts = DB.attempts.concat(added).sort((a, b) => b.ts - a.ts).slice(0, MAX_ATTEMPTS);
      DB.notes = Object.assign({}, d.notes || {}, DB.notes);
      Object.keys(d.mastery || {}).forEach(k => { if (!DB.mastery[k] || (d.mastery[k].last || 0) > (DB.mastery[k].last || 0)) DB.mastery[k] = d.mastery[k]; });
      saveDB();
      render();
      toast(`Backup loaded: ${added.length} paper${added.length === 1 ? '' : 's'} added.`);
    } catch (e) { toast('That file is not a backup from this site.'); }
  };
  rd.readAsText(file);
}

/* ---- src/ui/home.js ---- */
/* ==========================================================================
   Home (the exam list) and the page for one exam
   ========================================================================== */
'use strict';

function bestFor(examId, module) {
  const rows = DB.attempts.filter(a => a.kind === 'exam' && a.exam === examId && a.module === module);
  if (!rows.length) return null;
  if (module === 'writing') return { done: true, n: rows.length, last: rows[0] };
  return { pct: Math.max.apply(null, rows.map(a => a.pct)), n: rows.length, last: rows[0] };
}
function examStatus(id) {
  const ready = MODULE_ORDER.filter(m => examReady(id, m));
  const done = MODULE_ORDER.filter(m => bestFor(id, m));
  return { ready, done, full: ready.length === 4 };
}

function renderHome() {
  const t = S.tier;
  const list = EXAMS.filter(e => e.tier === t);
  const readyCount = list.filter(e => examFullyReady(e.id)).length;
  const lastExam = DB.attempts.find(a => a.kind === 'exam');
  const open = openMistakes().length;
  // suggest the next exam: the first fully ready exam in this tier with an unsat test
  const next = list.find(e => examFullyReady(e.id) && examStatus(e.id).done.length < 4);
  return shell('home', `
    ${DB.attempts.length ? `<div class="nextup">
      <h2>Welcome back</h2>
      <div class="recs">
        ${lastExam ? `<div class="rec"><span class="who"><b>Last paper: ${esc(attemptTitle(lastExam))}</b><span>${dateLong(lastExam.ts)}${lastExam.module !== 'writing' ? ` · ${lastExam.correct}/${lastExam.n} (${lastExam.pct}%)` : ''}</span></span>
          <button class="btn" data-act="review" data-id="${esc(lastExam.id)}">Review it</button></div>` : ''}
        ${open ? `<div class="rec"><span class="who"><b>${open} question${open === 1 ? '' : 's'} in your mistakes notebook</b><span>Redo them until you get each one right twice.</span></span>
          <button class="btn" data-act="go" data-view="mistakes">Open notebook</button></div>` : ''}
        ${next ? `<div class="rec"><span class="who"><b>Next up: ${esc(next.label)}</b><span>${4 - examStatus(next.id).done.length} test${4 - examStatus(next.id).done.length === 1 ? '' : 's'} not yet sat</span></span>
          <button class="btn primary" data-act="openExam" data-id="${next.id}">Open</button></div>` : ''}
      </div>
    </div>` : `<div class="nextup">
      <h2>How this works</h2>
      <p class="lede">There are 100 complete practice exams: 40 Easy, 40 Medium and 20 Hard. Each exam has the four tests of the real Selective test, timed the same way.
      Pick an exam, sit one test or all four, and every question is marked with an explanation. Your mistakes are collected in a notebook so you can redo them.</p>
    </div>`}

    <div class="tiertabs" role="tablist">${TIER_ORDER.map(k => `<button role="tab" data-act="tier" data-t="${k}" aria-selected="${t === k}" class="tier-${k}">
      <b>${TIERS[k].label}</b><span>${TIERS[k].count} exams</span></button>`).join('')}</div>
    <p class="tierblurb">${esc(TIERS[t].blurb)}${readyCount < list.length ? ` ${readyCount} of these ${list.length} exams have all four tests ready now; the rest have Maths ready and the other tests are being added.` : ''}</p>

    <div class="examgrid">${list.map(e => {
      const st = examStatus(e.id);
      return `<button class="examcard ${st.full ? '' : 'partial'}" data-act="openExam" data-id="${e.id}">
        <span class="num">${esc(TIERS[e.tier].label.toUpperCase())}</span>
        <h3>Exam ${e.n}</h3>
        <span class="dots">${MODULE_ORDER.map(m => {
          const b = bestFor(e.id, m), ready = examReady(e.id, m);
          const cls = !ready ? 'na' : !b ? 'todo' : m === 'writing' ? 'done' : meterClass(b.pct);
          const title = `${SPEC[m].name}: ${!ready ? 'coming soon' : !b ? 'not sat' : m === 'writing' ? 'done' : 'best ' + b.pct + '%'}`;
          return `<span class="dot ${cls}" title="${esc(title)}">${SPEC[m].short[0]}${b && m !== 'writing' ? `<i>${b.pct}</i>` : ''}</span>`;
        }).join('')}</span>
        ${st.full ? '' : '<span class="soon">Maths ready</span>'}
      </button>`;
    }).join('')}</div>`);
}

function renderExam() {
  const e = EXAM_BY_ID[S.examId];
  if (!e) return renderHome();
  const st = examStatus(e.id);
  return shell('home', `
    <div class="crumbs"><button class="linkbtn" data-act="home">Exams</button> › <button class="linkbtn" data-act="tier" data-t="${e.tier}">${esc(TIERS[e.tier].label)}</button> › Exam ${e.n}</div>
    <div class="examhead">
      <div><span class="eyebrow tier-${e.tier}">${esc(TIERS[e.tier].label)}</span><h2>${esc(e.label)}</h2>
        <p class="lede">${st.full ? 'All four tests, in the order of the real test. Sit them one at a time, or all four in a row.' : 'Maths is ready now. The other tests for this exam are being written and will appear in a later update.'}</p></div>
      ${st.full ? `<button class="btn primary big" data-act="startFull" data-id="${e.id}">Sit the full exam (2 hrs 35 min)</button>` : ''}
    </div>
    <div class="modules">${MODULE_ORDER.map((m, i) => {
      const sp = SPEC[m], ready = examReady(e.id, m), b = bestFor(e.id, m);
      const tries = DB.attempts.filter(a => a.kind === 'exam' && a.exam === e.id && a.module === m);
      return `<div class="mod ${ready ? '' : 'locked'}">
        <span class="num">Test ${i + 1}</span>
        <h3>${sp.name}</h3>
        <div class="spec"><span>${m === 'writing' ? '1 task' : sp.n + ' questions'}</span><span>${sp.minutes} min</span>${b && m !== 'writing' ? `<span>best ${b.pct}%</span>` : ''}</div>
        ${ready ? `<div class="rowbtns">
          <button class="btn primary" data-act="startTest" data-id="${e.id}" data-mod="${m}">${tries.length ? 'Sit again' : 'Start'}</button>
          ${tries.length ? `<button class="btn" data-act="review" data-id="${esc(tries[0].id)}">${m === 'writing' ? 'Read my essay' : 'Review last'}</button>` : ''}
        </div>
        ${tries.length > 1 ? `<div class="tries">${tries.slice(0, 5).map(a => `<button class="linkbtn" data-act="review" data-id="${esc(a.id)}">${dateShort(a.ts)}${m !== 'writing' ? ' · ' + a.pct + '%' : ''}</button>`).join(' ')}</div>` : ''}`
        : `<p class="hint">Coming in a later update.</p>`}
      </div>`;
    }).join('')}</div>`);
}

/* ---- src/ui/app.js ---- */
/* ==========================================================================
   Rendering and events
   ========================================================================== */
'use strict';

function render() {
  const views = { home: renderHome, exam: renderExam, player: renderPlayer, results: renderResults, review: renderResults,
    writing: renderWriting, writingResult: renderWritingResult, papers: renderPapers, mistakes: renderMistakes,
    progress: renderProgress, drills: renderDrills, backup: renderBackup };
  const v = views[S.view] || renderHome;
  app().innerHTML = v() + `<div id="toast" class="toast" role="status" aria-live="polite"></div>`;
  if (S.view === 'writing') {
    const ta = $('#essay');
    if (ta) {
      ta.value = S.essay;
      ta.addEventListener('input', () => {
        S.essay = ta.value;
        const n = wordsIn(S.essay) + ' words';
        const a = $('#wc'), b = $('#wc2'); if (a) a.textContent = n; if (b) b.textContent = n;
      });
      if (!S.essay) ta.focus();
    }
  }
  if (S.view === 'player') {
    const qp = $('#qpane'); if (qp) qp.scrollTop = 0;
    const sp = $('#scratch'); if (sp) { sp.value = S.scratch; sp.addEventListener('input', () => { S.scratch = sp.value; }); }
    const here = $('.gapmark.here'); if (here && here.scrollIntoView) here.scrollIntoView({ block: 'nearest' });
    enterQuestion();
  }
}
function go(view) {
  if (S.timerId && (S.view === 'player' || S.view === 'writing')) return;
  S.view = view; S.openMistake = null; render(); window.scrollTo(0, 0);
}
function leaveTest() {
  if (!confirm('Leave this test? Your answers so far will not be saved.')) return;
  stopTimer(); QUEUE = []; S.view = S.paper && S.paper.examId ? 'exam' : 'home'; render(); window.scrollTo(0, 0);
}
function openReview(id) {
  const a = DB.attempts.find(x => x.id === id);
  if (!a) return;
  S.reviewing = id; S.onlyWrong = false; S.openAll = false;
  S.paper = null;
  S.view = a.module === 'writing' ? 'writingResult' : 'review';
  render(); window.scrollTo(0, 0);
}
function attemptMissedRecords(a) { return (a.missed || []).map(m => m.rec).filter(Boolean); }

document.addEventListener('click', (ev) => {
  const goto = ev.target.closest('[data-goto]');
  const el = ev.target.closest('[data-act]');
  if (goto && S.view === 'player') { bankTime(); S.cur = parseInt(goto.dataset.goto, 10) - 1; render(); return; }
  if (!el) return;
  const a = el.dataset.act;
  if (a === 'closenav' && ev.target.closest('[data-stop]') && !ev.target.closest('button')) return;
  if (a === 'selMistake') { ev.preventDefault(); ev.stopPropagation(); const k = el.dataset.key; S.mistakeSel[k] = !S.mistakeSel[k]; render(); return; }
  if (el.tagName === 'DETAILS' || el.tagName === 'INPUT' || el.tagName === 'SELECT') {
    // handled by change/toggle listeners below
    return;
  }
  switch (a) {
    case 'theme': {
      const root = document.documentElement, now = root.getAttribute('data-theme');
      const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const nextT = now ? (now === 'dark' ? 'light' : null) : (sysDark ? 'light' : 'dark');
      if (nextT) root.setAttribute('data-theme', nextT); else root.removeAttribute('data-theme');
      try { localStorage.setItem('sel-theme', nextT || ''); } catch (e) { /* ignore */ }
      return;
    }
    case 'go': go(el.dataset.view); return;
    case 'home': stopTimer(); QUEUE = []; S.view = 'home'; render(); window.scrollTo(0, 0); return;
    case 'tier': S.tier = el.dataset.t; S.view = 'home'; render(); return;
    case 'openExam': S.examId = el.dataset.id; S.view = 'exam'; render(); window.scrollTo(0, 0); return;
    case 'startTest': QUEUE = []; startExamTest(el.dataset.id, el.dataset.mod); return;
    case 'startFull': startFullExam(el.dataset.id); return;
    case 'nextTest': { const m = QUEUE.shift(); if (m) startExamTest(S.paper.examId || S.examId, m); return; }
    case 'answer': {
      if (S.view !== 'player') return;
      const it = S.paper.items[S.cur], i = parseInt(el.dataset.i, 10);
      if (S.responses[it.n] === i) delete S.responses[it.n]; else S.responses[it.n] = i;
      render(); return;
    }
    case 'flag': { const n = S.paper.items[S.cur].n; S.flags[n] = !S.flags[n]; render(); return; }
    case 'nav': bankTime(); S.navOpen = true; render(); return;
    case 'closenav': S.navOpen = false; render(); return;
    case 'goto': bankTime(); S.cur = parseInt(el.dataset.n, 10) - 1; S.navOpen = false; render(); return;
    case 'prev': bankTime(); if (S.cur > 0) S.cur--; render(); return;
    case 'next': bankTime(); if (S.cur < S.paper.items.length - 1) S.cur++; render(); return;
    case 'finish': {
      const left = S.paper.items.length - Object.keys(S.responses).length;
      if (left && S.secsLeft > 0 && !S.countUp && !confirm(`You have ${left} unanswered question${left > 1 ? 's' : ''}. Finish anyway?`)) return;
      finish(); return;
    }
    case 'finishWriting': if (S.secsLeft > 60 && !confirm('Finish your writing now?')) return; finishWriting(); return;
    case 'pause': bankTime(); S.running = !S.running; render(); return;
    case 'scratch': bankTime(); S.scratchOpen = !S.scratchOpen; render(); return;
    case 'stim': S.stimOpen = !S.stimOpen; render(); return;
    case 'leave': leaveTest(); return;
    case 'review': openReview(el.dataset.id); return;
    case 'redoAttempt': { const at = DB.attempts.find(x => x.id === el.dataset.id); if (at) startRedo(attemptMissedRecords(at), 'Mistakes from ' + attemptTitle(at)); return; }
    case 'drill': startDrill(el.dataset.fam, parseInt(el.dataset.n || '8', 10)); return;
    case 'drillLevel': S.drillLevel = el.dataset.t; render(); return;
    case 'band': {
      const at = DB.attempts.find(x => x.id === S.reviewing); if (!at) return;
      at.bands = at.bands || {}; at.bands[el.dataset.crit] = parseInt(el.dataset.band, 10); saveDB(); render(); return;
    }
    case 'copyEssay': {
      const at = DB.attempts.find(x => x.id === S.reviewing);
      if (at && navigator.clipboard) navigator.clipboard.writeText(at.essay || '').then(() => toast('Copied.'), () => toast('Select the text and copy it instead.'));
      return;
    }
    case 'print': $$('details.rev').forEach(d => { d.open = true; }); setTimeout(() => window.print(), 50); return;
    case 'openAll': S.openAll = !S.openAll; $$('details.rev:not(.passage)').forEach(d => { d.open = S.openAll; }); return;
    case 'papersFilter': S.papersFilter = el.dataset.f; render(); return;
    case 'redoMistakes': {
      const F = S.mistakesFilter;
      const sel = Object.keys(S.mistakeSel).filter(k => S.mistakeSel[k]);
      let list = allMistakes().filter(x => (F.mastered || !isMastered(x.key)) && (F.module === 'all' || x.module === F.module) && (F.tier === 'all' || x.tier === F.tier) && (F.fam === 'all' || x.fam === F.fam));
      if (sel.length) list = list.filter(x => sel.includes(x.key)); else list = list.slice(0, 20);
      S.mistakeSel = {};
      startRedo(list.map(x => x.rec), 'Mistakes notebook'); return;
    }
    case 'redoOne': { const x = allMistakes().find(m => m.key === el.dataset.key); if (x) startRedo([x.rec], 'One question'); return; }
    case 'clearSel': S.mistakeSel = {}; render(); return;
    case 'export': exportBackup(); return;
    case 'resetAll':
      if (!confirm('Delete every saved paper, mistake and note in this browser? This cannot be undone.')) return;
      DB = { v: 3, attempts: [], notes: {}, mastery: {} }; saveDB(); render(); toast('All progress deleted.'); return;
  }
});

/* opening a mistake builds its question only when needed */
document.addEventListener('toggle', (ev) => {
  const d = ev.target;
  if (!(d instanceof HTMLElement) || d.dataset.act !== 'openMistake') return;
  if (d.open && S.openMistake !== d.dataset.key) {
    S.openMistake = d.dataset.key;
    const x = allMistakes().find(m => m.key === d.dataset.key);
    if (x) { const tmp = document.createElement('div'); tmp.innerHTML = renderMistakeRow(x); d.replaceWith(tmp.firstElementChild); }
  }
}, true);

document.addEventListener('change', (ev) => {
  const el = ev.target;
  const a = el.dataset && el.dataset.act;
  if (a === 'onlyWrong') { S.onlyWrong = el.checked; render(); return; }
  if (a === 'mf') { S.mistakesFilter[el.dataset.k] = el.value; render(); return; }
  if (a === 'mfMastered') { S.mistakesFilter.mastered = el.checked; render(); return; }
  if (a === 'import' && el.files && el.files[0]) { importBackup(el.files[0]); el.value = ''; }
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.note != null) setNote(el.dataset.note, el.value);
});

document.addEventListener('keydown', (ev) => {
  if (ev.target && /^(TEXTAREA|INPUT|SELECT)$/.test(ev.target.tagName)) {
    if (ev.key === 'Escape' && S.scratchOpen) { S.scratchOpen = false; render(); }
    return;
  }
  if (S.view !== 'player') return;
  const it = S.paper.items[S.cur];
  const nopts = (it.optionSvgs || it.options || []).length;
  const k = ev.key.toUpperCase();
  const li = LETTERS.indexOf(k);
  if (li >= 0 && li < nopts && k.length === 1) { S.responses[it.n] = li; render(); ev.preventDefault(); return; }
  if (/^[1-7]$/.test(k)) { const i = parseInt(k, 10) - 1; if (i < nopts) { S.responses[it.n] = i; render(); ev.preventDefault(); } return; }
  if (ev.key === 'ArrowRight' && S.cur < S.paper.items.length - 1) { bankTime(); S.cur++; render(); ev.preventDefault(); }
  if (ev.key === 'ArrowLeft' && S.cur > 0) { bankTime(); S.cur--; render(); ev.preventDefault(); }
  if (k === 'M') { S.flags[it.n] = !S.flags[it.n]; render(); ev.preventDefault(); }
  if (ev.key === 'Escape') { if (S.navOpen) { S.navOpen = false; render(); } else if (S.scratchOpen) { S.scratchOpen = false; render(); } }
});
window.addEventListener('beforeunload', (ev) => {
  if ((S.view === 'player' || S.view === 'writing') && S.timerId) { ev.preventDefault(); ev.returnValue = ''; }
});

(function boot() {
  try { const t = localStorage.getItem('sel-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { /* ignore */ }
  loadDB();
  render();
})();
