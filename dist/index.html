'use strict';

/* ---- litres and millilitres / kilograms and grams combined ---- */
defMaths({ id: 'm-units-combine', slot: 'units-measure', topic: 'units of measurement', fam: 'Measurement and time',
  gen(R, level) {
    const liq = R.chance(0.5);
    const [big, small, f] = liq ? ['L', 'mL', 1000] : ['kg', 'g', 1000];
    const k = byLevel(level, 3, 3, 4);
    const parts = [];
    for (let i = 0; i < k; i++) {
      const style = R.int(0, 2);
      const tot = R.int(byLevel(level, 300, 800, 900), byLevel(level, 4000, 6000, 9000));
      const v = byLevel(level, tot - tot % 5, tot, tot);
      parts.push({ v, style });
    }
    const show = p => p.style === 0 ? `${Math.floor(p.v / f)} ${big} ${p.v % f} ${small}` : p.style === 1 ? `${num(p.v)} ${small}` : `${num(round6(p.v / f))} ${big}`;
    const total = sum(parts.map(p => p.v));
    const fmt = v => `${Math.floor(v / f)} ${big} ${v % f} ${small}`;
    const label = R.shuffle(['X', 'Y', 'Z', 'W']).slice(0, k).sort();
    const cands = [
      { v: total - (total % f) + Math.round((total % f) / 10), why: `writes the ${small} as if a ${big} were 100 ${small}`, tag: 'units' },
      { v: total + 9 * (total % f), why: `misplaces the ${small} digits`, tag: 'place' },
      { v: total + f, why: `carries one ${big} too many`, tag: 'slip' },
      { v: total - f, why: `forgets to carry the ${big}`, tag: 'slip' },
      { v: total + 100, why: 'is 100 ' + small + ' out', tag: 'slip' },
    ];
    const built = numOpts(R, total, cands, { fmt, min: 1 });
    const things = liq ? 'containers hold water' : 'bags hold sand';
    return item(`Three ${things}.<br>${parts.map((p, i) => `${liq ? 'Container' : 'Bag'} ${label[i]} holds ${show(p)}.`).join('<br>')}<br>If everything is put together, what will the total be, in ${big} and ${small}?`.replace('Three', words(k).replace(/^./, c => c.toUpperCase())),
      built, explainWith(`In ${small}: ${parts.map(p => num(p.v)).join(' + ')} = ${num(total)} ${small}, which is ${fmt(total)}.`, built));
  } });

/* ---- reading a scale / juice from fruit ---- */
defMaths({ id: 'm-scale-reading', slot: 'units-measure', topic: 'reading scales', fam: 'Measurement and time',
  gen(R, level) {
    const max = byLevel(level, 1000, 2000, 5000), step = byLevel(level, 100, 200, 250);
    const per = byLevel(level, 500, 250, 400), out = byLevel(level, 0.8, 0.6, 0.45);
    let val, tries = 0;
    do { val = step * R.int(2, max / step - 1) + byLevel(level, 0, step / 2, step / 2) * R.int(0, 1); }
    while (!isInt(round6(val / per * out * 1000)) && tries++ < 50);
    if (!isInt(round6(val / per * out * 1000))) return this.gen(R, level);
    // scale drawing: a straight ruler-style scale with pointer
    const W = 380, L = 20, Rr = 360, Y = 60;
    let s = line(L, Y, Rr, Y, { w: 2 });
    for (let v = 0; v <= max; v += step / 2) {
      const x = L + v / max * (Rr - L);
      const major = v % step === 0;
      s += line(x, Y, x, Y - (major ? 14 : 7));
      if (major && (v / step) % byLevel(level, 1, 2, 4) === 0) s += txt(x, Y + 14, num(v), { size: 11 });
    }
    const px = L + val / max * (Rr - L);
    s += poly([[px, Y - 18], [px - 6, Y - 30], [px + 6, Y - 30]], { fill: 'ink' });
    s += txt(W / 2, 12, 'grams', { size: 11 });
    const pic = svg(W, 88, s, 'scale');
    const fruit = R.pick(['oranges', 'lemons', 'apples', 'mandarins']);
    const ans = round6(val / per * out * 1000);
    const who = name1(R);
    const built = numOpts(R, ans, [
      { v: round6(val / per * out * 100), why: 'converts litres to millilitres with 100 instead of 1000', tag: 'units' },
      { v: round6((val + step / 2) / per * out * 1000), why: 'misreads the scale by one small division', tag: 'misread' },
      { v: round6((val - step / 2) / per * out * 1000), why: 'misreads the scale by one small division', tag: 'misread' },
      { v: round6(val / per * 1000), why: 'forgets to multiply by the juice from each batch', tag: 'part-only' },
      { v: round6(per / val * out * 1000), why: 'divides the wrong way round', tag: 'reversed' },
    ], { fmt: x => num(x) + ' mL', min: 1, int: false });
    return item(`${who} makes juice. Every ${per} g of ${fruit} makes ${out} L of juice. A bag of ${fruit} is placed on the scale shown. How much juice can ${who} make from the bag?`,
      built, explainWith(`The scale reads ${val} g. That is ${num(round6(val / per))} lots of ${per} g, giving ${num(round6(val / per * out))} L = ${num(ans)} mL.`, built), { svg: pic });
  } });

/* ---- money: change, multi-buy, savings ---- */
defMaths({ id: 'm-money', slot: 'money', topic: 'money', fam: 'Number',
  gen(R, level) {
    const v = byLevel(level, R.int(0, 1), R.int(0, 2), R.int(1, 2));
    const who = name1(R);
    if (v === 0) {
      const items = R.sample([['notebook', 2.35, 4.9], ['pen', 0.85, 2.6], ['ruler', 1.1, 3.4], ['glue stick', 1.45, 3.2], ['eraser', 0.6, 1.8], ['folder', 1.75, 4.5]], 3);
      const qty = items.map(() => R.int(1, byLevel(level, 3, 5, 7)));
      const price = items.map(it => round2(R.int(Math.round(it[1] * 20), Math.round(it[2] * 20)) / 20));
      const tot = round2(sum(price.map((p, i) => p * qty[i])));
      const paid = Math.ceil(tot / 10) * 10 + (tot % 10 > 8 ? 10 : 0);
      const ans = round2(paid - tot);
      const built = numOpts(R, ans, [
        { v: round2(paid - sum(price)), why: 'pays for only one of each item', tag: 'part-only' },
        { v: tot, why: 'gives the total cost, not the change', tag: 'misread' },
        { v: round2(ans + price[0]), why: 'leaves out one of the items', tag: 'part-only' },
        { v: round2(ans - 0.1), why: 'is ten cents out', tag: 'slip' },
        { v: round2(ans + 1), why: 'is one dollar out', tag: 'slip' },
      ], { fmt: money, min: 0.05, int: false });
      return item(`${who} buys ${items.map((it, i) => `${qty[i]} ${it[0]}${qty[i] > 1 ? 's' : ''} at ${money(price[i])} each`).join(', ')}. ${who} pays with $${paid}. How much change does ${who} get?`,
        built, explainWith(`The total is ${items.map((it, i) => `${qty[i]} × ${money(price[i])}`).join(' + ')} = ${money(tot)}. Change: $${paid} − ${money(tot)} = ${money(ans)}.`, built));
    }
    if (v === 1) {
      // working back: spent fractions
      const left = byLevel(level, R.int(3, 8) * 2, R.int(4, 9) * 2 + 0.5, R.int(5, 12) * 1.5);
      const f2 = byLevel(level, 2, 3, 4); // fraction used on book: 1/f2 of remaining
      const afterTicket = left * f2 / (f2 - 1);
      const beforeTicket = afterTicket * 2;
      const start = Math.ceil(beforeTicket / 5) * 5 + byLevel(level, 5, 5, 10);
      const snacks = round2(start - beforeTicket);
      if (!isInt(afterTicket * 100) || snacks <= 0) return this.gen(R, level);
      const built = numOpts(R, snacks, [
        { v: round2(start - afterTicket), why: 'forgets to undo the halving for the ticket', tag: 'part-only' },
        { v: round2(start - left * 2), why: 'undoes only the ticket step', tag: 'part-only' },
        { v: round2(afterTicket / 2), why: 'gives the cost of the ticket', tag: 'misread' },
        { v: round2(afterTicket - left), why: 'gives the cost of the book', tag: 'misread' },
        { v: round2(snacks + 1), why: 'is one dollar out', tag: 'slip' },
      ], { fmt: money, int: false, min: 0.05 });
      return item(`${who} had ${money(start)}. ${who} spent some of it on snacks, then spent half of what was left on a movie ticket. ${who} then used ${byLevel(level, 'one-half', 'one-third', 'one-quarter')} of the remaining money to buy a book, and after that had ${money(left)} left. How much did ${who} spend on snacks?`,
        built, explainWith(`Work backwards: before the book ${who} had ${money(afterTicket)}; before the ticket, ${money(beforeTicket)}. So the snacks cost ${money(start)} − ${money(beforeTicket)} = ${money(snacks)}.`, built));
    }
    // best way to spend: bags of fruit
    const single = byLevel(level, 0.5, 0.6, 0.45);
    const bagA = byLevel(level, [10, 4.5], [8, 4.2], [12, 4.9]), bagB = byLevel(level, [30, 13], [25, 12.5], [40, 15.5]);
    const budget = byLevel(level, R.int(20, 30), R.int(28, 45), R.int(45, 70));
    let best = 0;
    for (let b = 0; b * bagB[1] <= budget; b++) for (let a = 0; a * bagA[1] + b * bagB[1] <= budget; a++) {
      const rest = budget - a * bagA[1] - b * bagB[1];
      best = Math.max(best, b * bagB[0] + a * bagA[0] + Math.floor(round2(rest / single) + 1e-9));
    }
    const greedyB = Math.floor(budget / bagB[1]);
    const r1 = budget - greedyB * bagB[1];
    const greedy = greedyB * bagB[0] + Math.floor(r1 / bagA[1]) * bagA[0] + Math.floor(round2((r1 - Math.floor(r1 / bagA[1]) * bagA[1]) / single) + 1e-9);
    const fruit = R.pick(['mandarins', 'apples', 'kiwi fruit', 'lemons']);
    const built = numOpts(R, best, [
      { v: Math.floor(budget / single), why: 'buys every piece of fruit singly', tag: 'part-only' },
      { v: greedy === best ? best - 2 : greedy, why: 'fills up with the biggest bags first without checking other mixes', tag: 'part-only' },
      { v: Math.floor(budget / bagB[1]) * bagB[0], why: 'buys only big bags and wastes the rest of the money', tag: 'part-only' },
      { v: Math.floor(budget / bagA[1]) * bagA[0], why: 'buys only medium bags', tag: 'part-only' },
      { v: best + 1, why: 'spends more money than there is', tag: 'slip' },
    ], { min: 1 });
    return item(`A shop sells ${fruit} three ways: 1 for ${money(single)}, a bag of ${bagA[0]} for ${money(bagA[1])}, or a bag of ${bagB[0]} for ${money(bagB[1])}. ${who} has $${budget}. What is the largest number of ${fruit} ${who} can buy?`,
      built, explainWith(`Trying the mixes of bags and single fruit, the most ${fruit} for $${budget} is ${best}.`, built));
  } });

/* ---- conversion chains with invented or old units ---- */
defMaths({ id: 'm-unit-chain', slot: 'unit-chain', topic: 'conversion chains', fam: 'Measurement and time',
  gen(R, level) {
    const sets = [
      ['gill', 'pint', 'quart', 'peck'], ['tok', 'bix', 'mun', 'zarl'], ['grain', 'scruple', 'dram', 'ounce'],
      ['pip', 'tab', 'rond', 'crown'], ['link', 'chain', 'furlong', 'league'], ['zep', 'kal', 'dorn', 'vask'],
      ['span', 'cubit', 'pace', 'rod'], ['mote', 'fleck', 'lump', 'heap'],
    ];
    const u = R.pick(sets);
    const pl = w => /(s|x|ch|sh)$/.test(w) ? w + 'es' : w + 's';
    const k = byLevel(level, 3, 4, 4);
    const rel = [];
    for (let i = 0; i < k - 1; i++) rel.push(R.int(2, byLevel(level, 5, 6, 8)));
    const total = rel.reduce((a, b) => a * b, 1);
    // medium and hard state one link the other way round ("1 pint is half a quart")
    const flip = level !== 'easy' ? R.int(0, k - 2) : -1;
    const clean = rel.map((r, i) => {
      if (i === flip && (r === 2 || r === 4)) return `• 1 ${u[i]} is ${r === 2 ? 'half' : 'a quarter'} of a ${u[i + 1]}.`;
      return R.chance(0.5) ? `• ${r} ${pl(u[i])} equal 1 ${u[i + 1]}.` : `• 1 ${u[i + 1]} is the same as ${r} ${pl(u[i])}.`;
    });
    const askN = byLevel(level, 1, R.int(2, 3), R.int(3, 5));
    const ans = total * askN;
    const built = numOpts(R, ans, [
      { v: sum(rel) * askN, why: 'adds the numbers in the chain instead of multiplying', tag: 'operation' },
      { v: total / rel[rel.length - 1] * askN, why: 'leaves out the last step of the chain', tag: 'part-only' },
      { v: total, why: `finds the number in one ${u[k - 1]} only`, tag: 'misread' },
      { v: total * 2 * askN, why: 'doubles one of the steps', tag: 'slip' },
    ], { min: 1 });
    return item(`Here are some units:<br>${clean.join('<br>')}<br>How many ${pl(u[0])} are in ${askN === 1 ? '1 ' + u[k - 1] : askN + ' ' + pl(u[k - 1])}?`,
      built, explainWith(`Multiply along the chain: ${rel.join(' × ')}${askN > 1 ? ' × ' + askN : ''} = ${num(ans)}.`, built));
  } });

/* ---- rates: work together / speed ---- */
defMaths({ id: 'm-rate', slot: 'rate', topic: 'rates', fam: 'Ratio, rate and percentage',
  gen(R, level) {
    const v = byLevel(level, R.int(0, 1), R.int(0, 2), R.int(1, 2));
    const who = name1(R);
    if (v === 0) {
      const speed = byLevel(level, R.pick([40, 60, 80, 90]), R.pick([45, 72, 84, 96]), R.pick([54, 66, 78, 105]));
      const mins = byLevel(level, R.pick([15, 30, 45, 90]), R.pick([20, 40, 50, 75, 100]), R.pick([25, 35, 55, 85, 110]));
      const d = round6(speed * mins / 60);
      if (!isInt(d * 10)) return this.gen(R, level);
      const built = numOpts(R, d, [
        { v: speed * mins / 100, why: 'treats an hour as 100 minutes', tag: 'units' },
        { v: speed * mins, why: 'forgets to change minutes into hours', tag: 'units' },
        { v: round6(speed / mins * 60), why: 'divides instead of multiplying', tag: 'operation' },
        { v: speed, why: 'gives the distance for one hour', tag: 'misread' },
      ], { fmt: x => num(x) + ' km', int: false, min: 0.1 });
      return item(`A train travels at a steady ${speed} km per hour. How far does it travel in ${hm(mins)}?`,
        built, explainWith(`${hm(mins)} is ${mixed(mins, 60)} of an hour, so the distance is ${speed} × ${mixed(mins, 60)} = ${num(d)} km.`, built));
    }
    if (v === 1) {
      const a = byLevel(level, R.int(2, 6) * 6, R.int(3, 8) * 6, R.int(4, 9) * 7), b = a * byLevel(level, 2, R.pick([2, 3]), R.pick([3, 4]));
      const pages = (a + b) * byLevel(level, R.int(2, 6), R.int(3, 8), R.int(4, 9));
      const ans = pages / (a + b);
      const built = numOpts(R, ans, [
        { v: pages / b, why: 'uses only the faster machine', tag: 'part-only' },
        { v: pages / a, why: 'uses only the slower machine', tag: 'part-only' },
        { v: pages / (a + b) * 2, why: 'averages the two machines instead of adding them', tag: 'operation' },
        { v: round6((pages / a + pages / b) / 2), why: 'averages the two separate times', tag: 'operation' },
      ], { fmt: x => plural(x, 'minute'), int: false, min: 0.5 });
      return item(`Two printers share a job. The older one prints ${a} pages a minute and the newer one prints ${b} pages a minute. They start together on a job of ${pages} pages. How long does the job take?`,
        built, explainWith(`Together they print ${a + b} pages a minute, so ${pages} pages take ${pages} ÷ ${a + b} = ${num(ans)} minutes.`, built));
    }
    // filling and emptying
    const fill = byLevel(level, 0, R.pick([6, 8, 10, 12]), R.pick([12, 15, 18, 20])), drain = byLevel(level, 0, fill * 2, fill * R.pick([2, 3]));
    const tank = lcm(fill, drain) * R.int(1, 3);
    const rateIn = tank / fill, rateOut = tank / drain;
    const ans = tank / (rateIn - rateOut);
    const built = numOpts(R, ans, [
      { v: fill, why: 'ignores the leak', tag: 'part-only' },
      { v: drain - fill, why: 'subtracts the times instead of the rates', tag: 'operation' },
      { v: round6(tank / (rateIn + rateOut)), why: 'adds the leak instead of taking it away', tag: 'reversed' },
      { v: (fill + drain) / 2, why: 'averages the two times', tag: 'operation' },
    ], { fmt: x => plural(x, 'minute'), int: false, min: 1 });
    return item(`A tap can fill a tank in ${fill} minutes. A hole in the bottom can empty the full tank in ${drain} minutes. The tank starts empty with the tap on and the hole open. How long does it take to fill the tank?`,
      built, explainWith(`Each minute the tap fills 1/${fill} of the tank and the hole empties 1/${drain}, a net 1/${ans} of the tank. So it takes ${ans} minutes.`, built));
  } });

/* ---- time zones ---- */
defMaths({ id: 'm-time-zones', slot: 'timetable', topic: 'time zones', fam: 'Measurement and time',
  gen(R, level) {
    const pool = [['Auckland', 13], ['Tokyo', 9], ['Dubai', 4], ['Calgary', -7], ['New York', -5], ['Nairobi', 3], ['Perth', 8], ['Honolulu', -10], ['Bangkok', 7]];
    if (level !== 'easy') pool.push(['Delhi', 5.5], ['Adelaide', 10.5], ['Kathmandu', 5.75]);
    let A, B;
    do { [A, B] = R.sample(pool, 2); } while (A[1] === B[1] || (level === 'hard' && (A[1] % 1 === 0 && B[1] % 1 === 0)));
    const t = R.int(0, 23) * 60 + byLevel(level, 0, R.pick([0, 30]), R.pick([15, 30, 45]));
    const diff = Math.round((A[1] - B[1]) * 60);
    const ans = t + diff;
    const fmt = time12;
    const desc = (c, v) => `${hm(Math.round(Math.abs(v) * 60))} ${v > 0 ? 'ahead of' : 'behind'} London`;
    const extra = level === 'hard' ? 24 * 60 * 0 : 0;
    const cands = [
      { v: t - diff, why: 'moves the clock the wrong way', tag: 'reversed' },
      { v: t + Math.round((A[1] + B[1]) * 60), why: 'adds the two differences instead of combining them properly', tag: 'operation' },
      { v: t + Math.round(A[1] * 60), why: 'uses only one of the time differences', tag: 'part-only' },
      { v: ans + 60, why: 'is one hour out', tag: 'slip' },
      { v: ans - 60, why: 'is one hour out', tag: 'slip' },
    ];
    const strs = [], whys = [], tags = [], vals = [];
    const push = (v, why, tag) => { const s = fmt(v); if (!strs.includes(s)) { strs.push(s); whys.push(why); tags.push(tag); vals.push(((v % 1440) + 1440) % 1440); } };
    push(ans + extra, null, null);
    cands.forEach(c => { if (strs.length < 5) push(c.v, c.why, c.tag); });
    const ord = vals.map((_, i) => i).sort((a, b) => vals[a] - vals[b]);
    const built = { options: ord.map(i => strs[i]), answer: ord.indexOf(0), whys: ord.map(i => whys[i]), tags: ord.map(i => tags[i]) };
    const dayNote = (ans >= 1440 || ans < 0) ? (ans >= 1440 ? ' on the next day' : ' on the day before') : '';
    return item(`The time in ${A[0]} is ${desc(A[0], A[1])}. The time in ${B[0]} is ${desc(B[0], B[1])}. When it is ${fmt(t)} in ${B[0]}, what time is it in ${A[0]}?`,
      built, explainWith(`${A[0]} is ${hm(Math.abs(diff))} ${diff >= 0 ? 'ahead of' : 'behind'} ${B[0]}, so the time is ${fmt(ans)}${dayNote}.`, built));
  } });

/* ---- bus timetable ---- */
defMaths({ id: 'm-timetable', slot: 'timetable', topic: 'timetables', fam: 'Measurement and time',
  gen(R, level) {
    const [T1, T2] = R.sample(TOWNS, 2);
    const mk = (start) => {
      const out = []; let t = start;
      for (let i = 0; i < 4; i++) { const dur = R.int(55, 80) - R.int(0, 5) * 0; out.push([t, t + dur]); t += R.int(110, 260) - (R.int(0, 11)) ; }
      return out.map(([a, b]) => [a - a % 5, b - b % 5]);
    };
    const go = mk(R.int(6 * 60 + 30, 8 * 60 + 15)), back = mk(R.int(7 * 60, 8 * 60 + 45));
    const who = name1(R);
    const k = R.int(0, 1);
    const out = go[k];
    // returns on the first bus back that leaves after arriving (+ some wait for hard)
    const wait = byLevel(level, 0, R.pick([0, 60]), R.pick([60, 90, 120]));
    const ret = back.find(b => b[0] >= out[1] + wait);
    if (!ret) return this.gen(R, level);
    const ans = ret[1] - out[0];
    const table = { caption: `Buses between ${T1} and ${T2}`, head: [`${T1} → ${T2} depart`, 'arrive', `${T2} → ${T1} depart`, 'arrive'],
      rows: go.map((g, i) => [time24(g[0]), time24(g[1]), time24(back[i][0]), time24(back[i][1])]) };
    const fmt = m => hm(m);
    const built = numOpts(R, ans, [
      { v: ret[0] - out[0], why: 'stops at the time the return bus leaves, not when it arrives', tag: 'part-only' },
      { v: ret[1] - out[1], why: 'starts counting when the first bus arrives', tag: 'misread' },
      { v: ans + 40, why: 'subtracts the times as if an hour were 100 minutes', tag: 'units' },
      { v: (back.find(b => b[0] > ret[0]) || [0, ret[1] + 120])[1] - out[0], why: 'catches a later bus back than needed', tag: 'misread' },
    ], { fmt, min: 10, step: 15 });
    const extraTxt = wait ? ` ${who} spends at least ${hm(wait)} in ${T2}, then returns on the next bus.` : ` ${who} returns on the next bus.`;
    return item(`${who} catches the ${k === 0 ? 'first' : 'second'} bus of the day from ${T1} to ${T2}.${extraTxt} How long is ${who} away from ${T1}?`,
      built, explainWith(`${who} leaves at ${time24(out[0])}, arrives in ${T2} at ${time24(out[1])}, takes the ${time24(ret[0])} bus back and arrives at ${time24(ret[1])}: ${hm(ans)} in all.`, built), { table });
  } });

/* ---- clock hands and calendars ---- */
defMaths({ id: 'm-clock-calendar', slot: 'clock-calendar', topic: 'clocks and calendars', fam: 'Measurement and time',
  gen(R, level) {
    if (R.chance(0.5)) {
      const h = R.int(1, 11), m = byLevel(level, R.pick([0, 30]), R.pick([15, 30, 45]), R.pick([10, 20, 35, 50, 25]));
      const ha = (h % 12) * 30 + m * 0.5, ma = m * 6;
      let ang = Math.abs(ha - ma); if (ang > 180) ang = 360 - ang;
      const built = numOpts(R, ang, [
        { v: Math.abs((h % 12) * 30 - ma) > 180 ? 360 - Math.abs((h % 12) * 30 - ma) : Math.abs((h % 12) * 30 - ma), why: 'forgets that the hour hand moves between the numbers', tag: 'part-only' },
        { v: 360 - ang, why: 'gives the reflex angle', tag: 'misread' },
        { v: ang + 15, why: 'moves the hour hand half an hour too far', tag: 'slip' },
        { v: Math.abs(ang - 30), why: 'is one hour-gap out', tag: 'off-by-one' },
      ], { fmt: x => num(x) + '°', int: false, min: 0 });
      return item(`What is the smaller angle between the hour hand and the minute hand of a clock at ${h}:${pad2(m)}?`,
        built, explainWith(`The minute hand is at ${ma}°. The hour hand is at ${h} × 30° + ${m} × 0.5° = ${ha}°. The angle between them is ${ang}°.`, built), { svg: clockSvg(h, m) });
    }
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const months = [['January', 31], ['February', 28], ['March', 31], ['April', 30], ['May', 31], ['June', 30], ['July', 31], ['August', 31], ['September', 30], ['October', 31], ['November', 30], ['December', 31]];
    const mi = R.int(0, 10), d0 = R.int(1, months[mi][1]), w0 = R.int(0, 6);
    const add = byLevel(level, R.int(10, 40), R.int(40, 120), R.int(100, 300));
    const ans = days[(w0 + add) % 7];
    // date after adding
    let m = mi, d = d0 + add;
    while (d > months[m % 12][1]) { d -= months[m % 12][1]; m++; }
    const wrongs = [
      { s: days[(w0 + add + 1) % 7], why: 'counts the starting day as well', tag: 'off-by-one' },
      { s: days[(w0 + add + 6) % 7], why: 'is one day short', tag: 'off-by-one' },
      { s: days[(w0 + add % 10) % 7], why: 'uses the last digit of the number of days instead of the remainder after dividing by 7', tag: 'operation' },
      { s: days[(w0 + Math.floor(add / 7)) % 7], why: 'counts weeks instead of leftover days', tag: 'misread' },
      { s: days[(w0 + 3) % 7], why: 'is a guess', tag: 'slip' }, { s: days[(w0 + 5) % 7], why: 'is a guess', tag: 'slip' },
    ];
    days.forEach(dd => wrongs.push({ s: dd, why: 'does not count the days correctly', tag: 'slip' }));
    const built = textOpts(R, ans, wrongs, { n: 5 });
    const ord = days.filter(x => built.options.includes(x));
    const o2 = { options: ord, answer: ord.indexOf(ans), whys: ord.map(x => x === ans ? null : built.whys[built.options.indexOf(x)]), tags: ord.map(x => x === ans ? null : built.tags[built.options.indexOf(x)]) };
    return item(`${d0} ${months[mi][0]} is a ${days[w0]}. In a year that is not a leap year, what day of the week is ${d} ${months[m % 12][0]}${m >= 12 ? ' of the following year' : ''}?`,
      o2, explainWith(`${d} ${months[m % 12][0]} is ${add} days later. ${add} = ${Math.floor(add / 7)} weeks and ${add % 7} days, so it is ${add % 7} days after ${days[w0]}: ${ans}.`, o2));
  } });

/* ---- src/gen/maths-proportion.js ---- */
/* ==========================================================================
   Mathematical Reasoning — fractions, percentages, ratio, best buy, averages
   ========================================================================== */
'use strict';

/* ---- fraction of a shape / fraction of a quantity ---- */
defMaths({ id: 'm-fraction-of', slot: 'fraction-of', topic: 'fractions of a quantity', fam: 'Fractions and decimals',
  gen(R, level) {
    if (R.chance(0.5)) {
      // garden/wall divided into a grid; some sections done, then a fraction of the whole, rest = ?
      const cols = R.pick([4, 5, 6]), rows = R.pick([2, 3, 4]);
      const n = cols * rows;
      const fracs = [[1, 2], [1, 3], [1, 4], [2, 3], [3, 4], [1, 6], [5, 6], [2, 5], [3, 5], [1, 5]].filter(([a, b]) => n % b === 0);
      if (!fracs.length) return this.gen(R, level);
      const [fa, fb] = R.pick(fracs);
      const second = n * fa / fb;
      const firstMax = n - second - 1;
      if (firstMax < 1) return this.gen(R, level);
      const first = R.int(1, Math.min(firstMax, byLevel(level, 6, 8, 10)));
      const ans = n - first - second;
      const cells = R.sample(range(0, n - 1), first).map(i => [i % cols, Math.floor(i / cols), 'a']);
      const pic = gridSvg(cols, rows, cells, { cell: 30, label: 'wall divided into equal sections' });
      const who = name1(R);
      const [c1, c2, c3] = R.pick([['purple', 'yellow', 'green'], ['blue', 'white', 'red'], ['flowers', 'vegetables', 'herbs']]);
      const built = numOpts(R, ans, [
        { v: n - n * fa / fb, why: 'forgets the sections that were already done', tag: 'part-only' },
        { v: second, why: 'gives the number of ' + c2 + ' sections', tag: 'misread' },
        { v: Math.abs(n - first - Math.round((n - first) * fa / fb)), why: `takes ${fa}/${fb} of what is left instead of ${fa}/${fb} of the whole`, tag: 'misread' },
        { v: ans + 1, why: 'is one out', tag: 'off-by-one' },
      ], { min: 0 });
      const plants = c1 === 'flowers';
      return item(plants
        ? `${who} divides a garden bed into equal sections and plants ${c1} in the shaded sections, as shown. ${who} then plants ${fa}/${fb} of the whole bed with ${c2}. The rest is planted with ${c3}. How many sections are planted with ${c3}?`
        : `${who} divides a wall into equal sections and paints the shaded sections ${c1}, as shown. ${who} then paints ${fa}/${fb} of the whole wall ${c2}. Finally, ${who} paints the rest of the wall ${c3}. How many sections are painted ${c3}?`,
        built, explainWith(`There are ${n} sections. ${first} are shaded and ${fa}/${fb} of ${n} is ${second}, so ${n} − ${first} − ${second} = ${ans} are left.`, built), { svg: pic });
    }
    // fraction chain of quantities
    const total = byLevel(level, R.int(4, 12) * 12, R.int(5, 15) * 24, R.int(6, 20) * 60);
    const [a1, b1] = R.pick([[1, 2], [1, 3], [1, 4], [2, 3], [3, 4]]);
    const [a2, b2] = R.pick([[1, 2], [1, 3], [1, 4], [2, 5], [3, 5], [1, 6]]);
    const after1 = total - total * a1 / b1;
    const used2 = after1 * a2 / b2;
    if (!isInt(after1) || !isInt(used2)) return this.gen(R, level);
    const ans = after1 - used2;
    const who = name1(R);
    const thing = R.pick([['stickers', 'gives', 'to a friend'], ['marbles', 'loses', 'at school'], ['cards', 'sells', 'at a market'], ['books', 'donates', 'to the library']]);
    const built = numOpts(R, ans, [
      { v: total - total * a1 / b1 - total * a2 / b2, why: `takes ${a2}/${b2} of the original amount instead of what was left`, tag: 'misread' },
      { v: after1, why: 'stops after the first step', tag: 'part-only' },
      { v: used2, why: 'gives the amount from the second step, not what is left', tag: 'misread' },
      { v: total * a1 / b1 + used2, why: 'adds up what was given away', tag: 'misread' },
    ], { min: 0 });
    return item(`${who} has ${total} ${thing[0]} and ${thing[1]} ${a1}/${b1} of them ${thing[2]}. ${who} then ${thing[1]} ${a2}/${b2} of the ${thing[0]} that are left. How many ${thing[0]} does ${who} have now?`,
      built, explainWith(`After the first step ${who} has ${total} − ${total * a1 / b1} = ${after1}. Then ${a2}/${b2} of ${after1} is ${used2}, leaving ${ans}.`, built));
  } });

/* ---- fraction arithmetic and comparison ---- */
defMaths({ id: 'm-fraction-ops', slot: 'fraction-ops', topic: 'fraction arithmetic', fam: 'Fractions and decimals',
  gen(R, level) {
    if (R.chance(0.5)) {
      // three statements about fractions, which are correct
      const mk = () => {
        const d1 = R.pick([3, 4, 5, 6, 8, 10, 12]), d2 = R.pick([3, 4, 5, 6, 8, 10, 12]);
        const n1 = R.int(1, d1 - 1), n2 = R.int(1, d2 - 1);
        const t = R.int(0, 2);
        if (t === 0) { // sum compared with a fraction
          const s = n1 / d1 + n2 / d2; const cmp = R.pick([[1, 2], [3, 4], [1, 1]]); const v = cmp[0] / cmp[1];
          if (Math.abs(s - v) < 1e-9) return null;
          const more = R.chance(0.5);
          return { text: `${n1}/${d1} + ${n2}/${d2} is ${more ? 'more' : 'less'} than ${cmp[0] === cmp[1] ? '1' : cmp[0] + '/' + cmp[1]}`, truth: more ? s > v : s < v };
        }
        if (t === 1) { // 1 − a/b compared
          const v = 1 - n1 / d1, c = n2 / d2; if (Math.abs(v - c) < 1e-9) return null;
          const more = R.chance(0.5);
          return { text: `1 − ${n1}/${d1} is ${more ? 'more' : 'less'} than ${n2}/${d2}`, truth: more ? v > c : v < c };
        }
        const a = 1 / d1, b = 1 / d2; if (d1 === d2) return null;
        const more = R.chance(0.5);
        return { text: `1/${d1} is ${more ? 'more' : 'less'} than 1/${d2}`, truth: more ? a > b : a < b };
      };
      const st = []; let guard = 0;
      while (st.length < 3 && guard++ < 50) { const s = mk(); if (s && !st.some(x => x.text === s.text)) st.push(s); }
      const built = statementOpts(R, st.map(s => s.truth), ['X', 'Y', 'Z']);
      return item(`Which of these statements is/are correct?<br>X&nbsp; ${st[0].text}<br>Y&nbsp; ${st[1].text}<br>Z&nbsp; ${st[2].text}`,
        built, `Statement X is ${st[0].truth ? 'true' : 'false'}, Y is ${st[1].truth ? 'true' : 'false'} and Z is ${st[2].truth ? 'true' : 'false'}. Change each fraction to a common denominator, or to a decimal, to compare.`);
    }
    // relative multiples: F has k times G, H has 1/m of G, F is ? times H
    const k = byLevel(level, R.int(2, 8), R.int(3, 12), R.int(4, 15)), m = byLevel(level, R.pick([2, 3, 4]), R.pick([3, 4, 5]), R.pick([4, 5, 6, 8]));
    const [F, G, H] = names(R, 3);
    const ans = k * m;
    const built = numOpts(R, ans, [
      { v: round6(k / m), why: 'divides instead of multiplying', tag: 'operation' },
      { v: k + m, why: 'adds the two numbers', tag: 'operation' },
      { v: round6(m / k), why: 'works it the wrong way round', tag: 'reversed' },
      { v: k, why: `ignores what ${H} has`, tag: 'part-only' },
    ], { fmt: x => isInt(x) ? String(x) : frac(Math.round(x * k * m), k * m), int: false, min: 0 });
    return item(`${F}, ${G} and ${H} collect stickers. ${F} has ${k} times as many stickers as ${G}. ${H} has 1/${m} as many stickers as ${G}. ${F} has ☐ times as many stickers as ${H}. What is the missing number?`,
      built, explainWith(`If ${H} has 1 sticker, ${G} has ${m} and ${F} has ${k} × ${m} = ${ans}. So ${F} has ${ans} times as many as ${H}.`, built));
  } });

/* ---- percentages ---- */
defMaths({ id: 'm-percent', slot: 'percent', topic: 'percentages', fam: 'Ratio, rate and percentage',
  gen(R, level) {
    const v = byLevel(level, R.int(0, 1), R.int(0, 2), R.int(1, 3));
    const who = name1(R);
    if (v === 0) {
      const price = R.int(4, 30) * byLevel(level, 5, 4, 3);
      const p = R.pick([10, 20, 25, 30, 40, 50, 15]);
      const ans = round2(price * (1 - p / 100));
      const built = numOpts(R, ans, [
        { v: round2(price * p / 100), why: 'gives the discount, not the sale price', tag: 'misread' },
        { v: round2(price - p), why: `takes $${p} off instead of ${p}%`, tag: 'units' },
        { v: round2(price * (1 + p / 100)), why: 'adds the percentage on', tag: 'reversed' },
        { v: round2(price * (1 - p / 1000)), why: 'works out the percentage with the decimal point in the wrong place', tag: 'place' },
      ], { fmt: moneyShort, int: false, min: 0.5 });
      return item(`A jacket normally costs $${price}. In a sale, its price is reduced by ${p}%. What is the sale price?`, built,
        explainWith(`${p}% of $${price} is ${money(price * p / 100)}, so the sale price is ${money(ans)}.`, built));
    }
    if (v === 1) {
      // reverse percentage
      const p = R.pick([20, 25, 40, 50, 60, 75, 80]);
      const orig = R.int(3, 20) * (p % 40 === 0 ? 5 : 4) * byLevel(level, 1, 2, 3);
      const after = orig * (1 - p / 100);
      if (!isInt(after)) return this.gen(R, level);
      const built = numOpts(R, orig, [
        { v: round2(after * (1 + p / 100)), why: `adds ${p}% of the sale price back on`, tag: 'reversed' },
        { v: after + p, why: 'adds the percentage as dollars', tag: 'units' },
        { v: after, why: 'gives the sale price', tag: 'misread' },
        { v: round2(after / (p / 100)), why: 'divides by the percentage taken off instead of the percentage left', tag: 'misread' },
      ], { fmt: moneyShort, int: false, min: 1 });
      return item(`${who} buys a bike in a sale for $${after}. The sale price was ${p}% less than the original price. What was the original price?`, built,
        explainWith(`$${after} is ${100 - p}% of the original, so 1% is $${round2(after / (100 - p))} and 100% is $${orig}.`, built));
    }
    if (v === 2) {
      // successive percentages
      const start = R.int(4, 20) * 100;
      const up = R.pick([10, 20, 25, 50]), down = R.pick([10, 20, 25, 50]);
      const ans = round2(start * (1 + up / 100) * (1 - down / 100));
      const built = numOpts(R, ans, [
        { v: round2(start * (1 + (up - down) / 100)), why: 'combines the percentages by adding and subtracting them', tag: 'operation' },
        { v: start * (1 + up / 100), why: 'stops after the first change', tag: 'part-only' },
        { v: round2(start * (1 - down / 100)), why: 'applies only the second change', tag: 'part-only' },
        { v: start, why: 'assumes the changes cancel out', tag: 'misread' },
      ], { fmt: x => num(x), int: false, min: 1 });
      return item(`A town had ${num(start)} residents. Over one year the number grew by ${up}%. The next year it fell by ${down}%. How many residents were there at the end of the second year?`, built,
        explainWith(`After the rise: ${num(start * (1 + up / 100))}. After the fall: ${num(ans)}.`, built));
    }
    // percentage of a mixture, then a change
    const total = R.int(4, 12) * 20;
    const pA = R.pick([20, 25, 40, 60, 75]);
    const a = total * pA / 100;
    const add = R.int(1, 6) * 5;
    const newPct = round6((a + add) / (total + add) * 100);
    if (!isInt(newPct * 10)) return this.gen(R, level);
    const built = numOpts(R, newPct, [
      { v: round6((a + add) / total * 100), why: 'forgets that the total goes up as well', tag: 'part-only' },
      { v: pA + add, why: 'adds the new counters straight onto the percentage', tag: 'units' },
      { v: pA, why: 'assumes the percentage does not change', tag: 'misread' },
      { v: round6(a / (total + add) * 100), why: 'adds to the total but not to the red counters', tag: 'part-only' },
    ], { fmt: x => num(x) + '%', int: false, min: 0 });
    return item(`A bag holds ${total} counters and ${pA}% of them are red. ${who} adds another ${add} red counters. What percentage of the counters are now red?`, built,
      explainWith(`There were ${a} red counters out of ${total}. Now there are ${a + add} out of ${total + add}, which is ${num(newPct)}%.`, built));
  } });

/* ---- ratio ---- */
defMaths({ id: 'm-ratio', slot: 'ratio', topic: 'ratio', fam: 'Ratio, rate and percentage',
  gen(R, level) {
    const v = byLevel(level, R.int(0, 1), R.int(0, 2), R.int(1, 2));
    const [A, B, C] = names(R, 3);
    if (v === 0) {
      const a = R.int(1, 5), b = R.int(a + 1, 8);
      if (gcd(a, b) !== 1) return this.gen(R, level);
      const unit = R.int(3, 15) * byLevel(level, 1, 2, 3);
      const total = (a + b) * unit;
      const ans = b * unit;
      const built = numOpts(R, ans, [
        { v: a * unit, why: `gives ${A}'s share`, tag: 'misread' },
        { v: Math.round(total / b) , why: 'divides by one part of the ratio instead of the total number of parts', tag: 'operation' },
        { v: total - a, why: 'subtracts the ratio number instead of the share', tag: 'misread' },
        { v: (b - a) * unit, why: 'gives the difference between the shares', tag: 'misread' },
      ], { min: 1 });
      return item(`${A} and ${B} share $${total} in the ratio ${a} : ${b}. How much does ${B} get?`, built,
        explainWith(`There are ${a + b} parts, each worth $${total} ÷ ${a + b} = $${unit}. ${B} gets ${b} × $${unit} = $${ans}.`, built), {});
    }
    if (v === 1) {
      // ratio changes after a transfer
      const a = R.int(2, 5), b = R.int(1, a - 1 || 1);
      if (a === b) return this.gen(R, level);
      const unit = R.int(4, 12);
      const x = a * unit, y = b * unit;
      // after giving g from A to B, equal
      const g = (x - y) / 2;
      if (!isInt(g) || g <= 0) return this.gen(R, level);
      const built = numOpts(R, g, [
        { v: x - y, why: 'gives the whole difference instead of half of it', tag: 'misread' },
        { v: unit, why: 'gives the size of one part', tag: 'misread' },
        { v: (x + y) / 2, why: 'gives the number each ends up with', tag: 'misread' },
        { v: a - b, why: 'uses the ratio numbers instead of the amounts', tag: 'units' },
      ], { min: 1 });
      return item(`${A} and ${B} have marbles in the ratio ${a} : ${b}. Together they have ${x + y} marbles. How many marbles must ${A} give to ${B} so that they have the same number?`, built,
        explainWith(`${A} has ${x} and ${B} has ${y}. The difference is ${x - y}, so ${A} gives half of it: ${g}.`, built));
    }
    // three-way packets: large/medium/small equivalences
    const L = R.int(3, 9) * 12;
    const lm = R.pick([[2, 3], [3, 4], [2, 5], [3, 2]]), ms = R.pick([[2, 3], [3, 4], [3, 5], [4, 3]]);
    const M = L * lm[0] / lm[1], S = M * ms[0] / ms[1];
    if (!isInt(M) || !isInt(S)) return this.gen(R, level);
    const thing = R.pick(['biscuits', 'crackers', 'muesli bars', 'tea bags']);
    const built = numOpts(R, S, [
      { v: L * ms[0] / ms[1], why: 'skips the middle-sized packet', tag: 'part-only' },
      { v: M, why: 'gives the medium packet', tag: 'misread' },
      { v: round6(L * lm[1] / lm[0] * ms[1] / ms[0]), why: 'uses each ratio upside down', tag: 'reversed' },
      { v: round6(M * ms[1] / ms[0]), why: 'turns the second ratio upside down', tag: 'reversed' },
    ], { min: 1 });
    return item(`A large packet holds ${L} ${thing}. ${words(lm[0]).replace(/^./, c => c.toUpperCase())} large packets hold the same number of ${thing} as ${words(lm[1])} medium packets. ${words(ms[0]).replace(/^./, c => c.toUpperCase())} medium packets hold the same number as ${words(ms[1])} small packets. How many ${thing} does a small packet hold?`, built,
      explainWith(`${lm[0]} × ${L} = ${lm[0] * L}, so a medium packet holds ${lm[0] * L} ÷ ${lm[1]} = ${M}. Then ${ms[0]} × ${M} = ${ms[0] * M}, so a small packet holds ${ms[0] * M} ÷ ${ms[1]} = ${S}.`, built));
  } });

/* ---- best buy ---- */
defMaths({ id: 'm-best-buy', slot: 'best-buy', topic: 'best buy', fam: 'Ratio, rate and percentage',
  gen(R, level) {
    const thing = R.pick([['juice', 'mL', 'bottle'], ['rice', 'g', 'bag'], ['shampoo', 'mL', 'bottle'], ['pasta', 'g', 'packet']]);
    const sizes = R.sample(byLevel(level, [250, 500, 750, 1000, 2000], [300, 450, 600, 750, 1200, 1500], [350, 450, 650, 800, 1250, 1750]), 4).sort((a, b) => a - b);
    const baseRate = R.int(3, 9) / 1000; // dollars per unit
    const prices = sizes.map(s => round2(s * baseRate * (1 + R.int(-12, 12) / 100)));
    const per = prices.map((p, i) => p / sizes[i]);
    const best = per.indexOf(Math.min.apply(null, per));
    if (per.filter(x => Math.abs(x - per[best]) < 1e-6).length > 1) return this.gen(R, level);
    const labels = ['P', 'Q', 'R', 'S'];

    const table = { head: [thing[2], 'size', 'price'], rows: sizes.map((s, i) => [labels[i], num(s) + ' ' + thing[1], money(prices[i])]) };

      `Work out the price for the same amount of each: ${sizes.map((s, i) => `${labels[i]} costs ${money(prices[i] / s * 100)} per 100 ${thing[1]}`).join('; ')}. ${labels[best]} is cheapest.`, { table });
  } });

/* ---- averages ---- */
defMaths({ id: 'm-mean', slot: 'mean', topic: 'averages', fam: 'Data and chance',
  gen(R, level) {
    const v = byLevel(level, 0, R.int(0, 1), R.int(1, 2));
    const who = name1(R);
    if (v === 0) {
      const k = R.int(4, 6);
      const target = R.int(12, 25);
      const scores = range(1, k - 1).map(() => target + R.int(-6, 6));
      const last = target * k - sum(scores);
      if (last < 1 || last > 40) return this.gen(R, level);
      const built = numOpts(R, last, [
        { v: target, why: 'assumes the last score equals the average', tag: 'misread' },
        { v: target * (k - 1) - sum(scores) + target, why: 'is right by coincidence of a slip', tag: 'slip' },
        { v: Math.round(sum(scores) / (k - 1)), why: 'gives the average of the other scores', tag: 'misread' },
        { v: target * k - sum(scores) + k, why: 'adds the number of games', tag: 'slip' },
        { v: last + target, why: 'adds the average on again', tag: 'slip' },
      ], { min: 0 });
      return item(`${who} played ${k} games of basketball. The points in the first ${k - 1} games were ${scores.join(', ')}. ${who}'s mean score for all ${k} games was ${target}. How many points did ${who} score in the last game?`, built,
        explainWith(`A mean of ${target} over ${k} games is ${target * k} points in total. The first ${k - 1} games give ${sum(scores)}, so the last game was ${last}.`, built));
    }
    if (v === 1) {
      // new member changes the mean
      const n = R.int(4, 9), m1 = R.int(30, 50), m2 = m1 + R.pick([1, 2, 3]);
      const newAge = m2 * (n + 1) - m1 * n;
      const thing = R.pick([['ages', 'years old', 'joins'], ['masses', 'kg', 'joins']]);
      const built = numOpts(R, newAge, [
        { v: m2, why: 'assumes the new person is the new mean', tag: 'misread' },
        { v: m2 + (m2 - m1), why: 'adds the change in the mean only once', tag: 'part-only' },
        { v: m1 * n + m2, why: 'forgets to subtract the old total', tag: 'part-only' },
        { v: newAge + m2 - m1, why: 'is out by the change in the mean', tag: 'slip' },
      ], { min: 0 });
      return item(`The mean age of the ${n} teachers in a staffroom is ${m1}. One more teacher arrives and the mean age becomes ${m2}. How old is the teacher who arrived?`, built,
        explainWith(`Before: ${n} × ${m1} = ${n * m1} years. After: ${n + 1} × ${m2} = ${(n + 1) * m2} years. The new teacher is ${newAge}.`, built));
    }
    // median & mean statements
    const k = R.pick([5, 7]);
    const vals = range(1, k).map(() => R.int(2, 20)).sort((a, b) => a - b);
    const mean = sum(vals) / k, median = vals[(k - 1) / 2], rangeV = vals[k - 1] - vals[0];
    const mode = (() => { const c = {}; vals.forEach(x => c[x] = (c[x] || 0) + 1); const mx = Math.max.apply(null, Object.values(c)); const ms = Object.keys(c).filter(x => c[x] === mx); return mx > 1 && ms.length === 1 ? Number(ms[0]) : null; })();
    const s1 = R.chance(0.5) ? { t: `The mean is greater than the median.`, v: mean > median } : { t: `The median is ${median + (R.chance(0.5) ? 0 : 1)}.`, v: null };
    if (s1.v === null) s1.v = s1.t === `The median is ${median}.`;
    const rr = rangeV + (R.chance(0.5) ? 0 : 2);
    const s2 = { t: `The range is ${rr}.`, v: rr === rangeV };
    const add = R.int(2, 20);
    const s3 = { t: `Adding a score of ${add} would increase the mean.`, v: add > mean };
    const built = statementOpts(R, [s1.v, s2.v, s3.v]);
    return item(`Here are ${k} test scores:<br><span class="mono">${R.shuffle(vals).join(', ')}</span><br>Which of these statements is/are correct?<br>X&nbsp; ${s1.t}<br>Y&nbsp; ${s2.t}<br>Z&nbsp; ${s3.t}`, built,
      `In order the scores are ${vals.join(', ')}. The mean is ${num(round2(mean))}, the median is ${median} and the range is ${rangeV}.${mode != null ? '' : ''}`);
  } });

/* ---- angles: triangle / straight line / isosceles / around a point ---- */
defMaths({ id: 'm-angles', slot: 'angles', topic: 'angles', fam: 'Space and geometry',
  gen(R, level) {
    const v = byLevel(level, R.int(0, 1), R.int(1, 2), R.int(2, 3));
    if (v === 0) {
      // straight line split into angles
      const a = R.int(25, 70), b = R.int(25, 70);
      const x = 180 - a - b;
      const W = 320, H = 150, cx = 160, cy = 120;
      const ang = [0, a, a + b, 180];
      let s = line(20, cy, 300, cy, { w: 2 });
      [a, a + b].forEach(t => { const r = t * Math.PI / 180; s += line(cx, cy, cx + Math.cos(Math.PI - r) * -120 * -1 * 1, cy - Math.sin(r) * 110); });
      // labels
      const mid = (t1, t2) => (t1 + t2) / 2 * Math.PI / 180;
      const lab = (t1, t2, str) => { const m = mid(t1, t2); return txt(cx + Math.cos(m) * 48, cy - Math.sin(m) * 40, str, { size: 13 }); };
      s = line(20, cy, 300, cy, { w: 2 });
      [a, a + b].forEach(t => { const r = t * Math.PI / 180; s += line(cx, cy, cx + Math.cos(r) * 120, cy - Math.sin(r) * 110); });
      s += lab(0, a, a + '°') + lab(a, a + b, b + '°') + lab(a + b, 180, 'x');
      const pic = svg(W, H, s, 'angles on a straight line');
      void ang;
      const built = numOpts(R, x, [
        { v: 360 - a - b, why: 'uses 360° instead of 180° for a straight line', tag: 'misread' },
        { v: 90 - Math.min(a, b), why: 'treats one angle as part of a right angle', tag: 'misread' },
        { v: a + b, why: 'adds the two marked angles', tag: 'operation' },
        { v: x + 10, why: 'is a slip of 10°', tag: 'slip' },
      ], { fmt: n => n + '°', min: 1 });
      return item(`Three angles meet on a straight line, as shown. What is the size of angle x?`, built,
        explainWith(`Angles on a straight line add to 180°, so x = 180° − ${a}° − ${b}° = ${x}°.`, built), { svg: pic });
    }
    if (v === 1) {
      // isosceles triangle with exterior angle
      const apex = R.int(20, 100) * 1;
      if (apex % 2) return this.gen(R, level);
      const base = (180 - apex) / 2;
      const ext = 180 - base;
      const built = numOpts(R, ext, [
        { v: base, why: 'gives the inside base angle', tag: 'part-only' },
        { v: 180 - apex, why: 'uses the top angle instead of the base angle', tag: 'misread' },
        { v: apex + base, why: 'adds the wrong two angles', tag: 'misread' },
        { v: 360 - ext, why: 'goes all the way round', tag: 'misread' },
      ], { fmt: n => n + '°', min: 1 });
      const pts = [[40, 150], [200, 150], [120, 150 - 80 / Math.tan(apex / 2 * Math.PI / 180)]];
      const top = Math.max(10, pts[2][1]);
      const s = poly([[40, 150], [200, 150], [120, top]]) + line(200, 150, 290, 150) +
        txt(120, top + 22, apex + '°', { size: 12 }) + txt(222, 138, 'y', { size: 14 }) +
        line(78, 146, 82, 154) + line(158, 146, 162, 154) + txt(150, 175, 'The two marked sides are equal.', { size: 11 });
      return item(`The triangle is isosceles: the two sloping sides are equal. The top angle is ${apex}°. One side is extended, as shown. What is the size of angle y?`, built,
        explainWith(`The two base angles are equal, so each is (180° − ${apex}°) ÷ 2 = ${base}°. Angle y is on a straight line with one of them: 180° − ${base}° = ${ext}°.`, built),
        { svg: svg(300, 185, s, 'isosceles triangle') });
    }
    if (v === 2) {
      // regular polygon interior angle / angle in a shape with symmetry
      const n = R.pick([5, 6, 8, 9, 10, 12]);
      const interior = 180 - 360 / n;
      const built = numOpts(R, interior, [
        { v: 360 / n, why: 'gives the exterior angle', tag: 'misread' },
        { v: 180 * n / n - 180 / n, why: 'divides 180° instead of 360°', tag: 'operation' },
        { v: 180 * (n - 2), why: 'gives the total of all the angles', tag: 'part-only' },
        { v: interior + 360 / n, why: 'adds the exterior angle', tag: 'slip' },
      ], { fmt: x => num(x) + '°', int: false, min: 1 });
      return item(`A regular polygon has ${n} equal sides and ${n} equal angles. What is the size of each inside angle?`, built,
        explainWith(`Walking round the shape turns through 360°, so each outside angle is 360° ÷ ${n} = ${num(360 / n)}°, and each inside angle is 180° − ${num(360 / n)}° = ${num(interior)}°.`, built));
    }
    // two parallel lines and a transversal plus triangle: hard

      { v: (180 - p - q / 2), why: 'uses 180° for a four-sided shape', tag: 'misread' },
      { v: (360 - p) / 3, why: 'treats three angles as equal', tag: 'misread' },
      { v: other + 5, why: 'is a slip of 5°', tag: 'slip' },
    ], { fmt: n => num(n) + '°', int: false, min: 1 });
    const s = poly([[150, 20], [250, 110], [150, 190], [50, 110]]) + line(150, 10, 150, 200, { dash: true, op: 0.6 }) +

    return item(`This shape has one line of symmetry, shown dashed. Two of its angles are ${p}° and ${q}°. What is the size of angle P?`, built,
      explainWith(`The angles of a four-sided shape add to 360°. The two side angles are equal by symmetry, so each is (360° − ${p}° − ${q}°) ÷ 2 = ${num(other)}°.`, built),
      { svg: svg(300, 210, s, 'kite') });
  } });

/* ---- symmetry: calculator digits / tiles to add ---- */
const SEG = { // seven-segment: a top, b top-right, c bottom-right, d bottom, e bottom-left, f top-left, g middle
  0: 'abcdef', 1: 'bc', 2: 'abdeg', 3: 'abcdg', 4: 'bcfg', 5: 'acdfg', 6: 'acdefg', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };
function segSymmetry(numStr) {
  // segments of a whole number drawn side by side; check vertical & horizontal mirror lines
  const segs = [];
  numStr.split('').forEach((ch, k) => SEG[ch].split('').forEach(s => segs.push([k, s])));
  const key = (k, s) => k + s;
  const set = new Set(segs.map(([k, s]) => key(k, s)));
  const n = numStr.length;
  const hMap = { a: 'd', d: 'a', b: 'c', c: 'b', e: 'f', f: 'e', g: 'g' };
  const vMap = { a: 'a', d: 'd', g: 'g', b: 'f', f: 'b', c: 'e', e: 'c' };
  const horiz = segs.every(([k, s]) => set.has(key(k, hMap[s])));
  const vert = segs.every(([k, s]) => set.has(key(n - 1 - k, vMap[s])));
  return (horiz ? 1 : 0) + (vert ? 1 : 0);
}
function segSvg(numStr) {
  const w = 30, h = 54, gap = 14, pad = 8;
  let s = '';
  numStr.split('').forEach((ch, k) => {
    const x = pad + k * (w + gap), y = pad;
    const P = { a: [[x, y], [x + w, y]], b: [[x + w, y], [x + w, y + h / 2]], c: [[x + w, y + h / 2], [x + w, y + h]], d: [[x, y + h], [x + w, y + h]],
      e: [[x, y + h / 2], [x, y + h]], f: [[x, y], [x, y + h / 2]], g: [[x, y + h / 2], [x + w, y + h / 2]] };
    SEG[ch].split('').forEach(sg => { const [[x1, y1], [x2, y2]] = P[sg]; s += line(x1, y1, x2, y2, { w: 4 }); });
  });
  return s;
}
defMaths({ id: 'm-symmetry', slot: 'symmetry', topic: 'symmetry', fam: 'Space and geometry',
  gen(R, level) {
    if (R.chance(0.55)) {
      const digits = byLevel(level, 2, 3, 3);
      const want = R.int(0, 2);
      const pool = [];
      for (let t = 0; t < 400 && pool.length < 60; t++) {
        let n = String(R.int(Math.pow(10, digits - 1), Math.pow(10, digits) - 1));
        pool.push([n, segSymmetry(n)]);
      }
      const uniq = pool.filter((p, i) => pool.findIndex(q => q[0] === p[0]) === i);
      const right = uniq.filter(p => p[1] === want);
      const wrong = uniq.filter(p => p[1] !== want);
      if (!right.length || wrong.length < 4) return this.gen(R, level);
      const ans = R.pick(right);
      const ws = [];
      R.shuffle(wrong).forEach(w => { if (ws.length < 4 && !ws.some(x => x[0] === w[0])) ws.push(w); });
      const all = [ans].concat(ws).sort((a, b) => Number(a[0]) - Number(b[0]));
      const built = { options: all.map(x => x[0]), answer: all.indexOf(ans),
        whys: all.map(x => x === ans ? null : `has ${x[1] === 0 ? 'no' : x[1] === 1 ? 'one' : 'two'} line${x[1] === 1 ? '' : 's'} of symmetry`), tags: all.map(x => x === ans ? null : 'spatial') };
      const ex = '8' .repeat(digits);
      const pic = svg(digits * 44 + 10, 72, segSvg(ex), 'calculator digits');
      const wd = ['no lines', 'exactly one line', 'exactly two lines'][want];
      return item(`'Calculator numbers' are written in the style of digits on a calculator, like the number ${ex} shown. A line of symmetry can run across the whole number, either up-and-down or side-to-side. Which of these numbers has ${wd} of symmetry when written as a calculator number?`,
        built, `${ans[0]} has ${wd} of symmetry. Check each number for a side-to-side line through the middle of every digit, and for an up-and-down line through the middle of the whole number.`, { svg: pic });
    }
    // add the fewest tiles to make a shape symmetric about a given line
    const cols = 6, rows = byLevel(level, 4, 5, 6);
    const mid = cols / 2; // vertical mirror between col 2 and 3
    const cells = new Set();
    const pairs = byLevel(level, R.int(1, 2), R.int(2, 4), R.int(3, 6)), lone = byLevel(level, R.int(2, 4), R.int(3, 6), R.int(4, 8));
    let guard = 0;
    while (cells.size < pairs * 2 && guard++ < 200) { const x = R.int(0, cols / 2 - 1), y = R.int(0, rows - 1); cells.add(x + ',' + y); cells.add((cols - 1 - x) + ',' + y); }
    guard = 0;
    while (cells.size < pairs * 2 + lone && guard++ < 400) { const x = R.int(0, cols - 1), y = R.int(0, rows - 1); if (!cells.has((cols - 1 - x) + ',' + y)) cells.add(x + ',' + y); }
    const arr = Array.from(cells).map(s => s.split(',').map(Number));
    const need = arr.filter(([x, y]) => !cells.has((cols - 1 - x) + ',' + y)).length;
    if (need < 2) return this.gen(R, level);
    const built = numOpts(R, need, [
      { v: arr.length, why: 'copies every tile instead of only the ones without a partner', tag: 'misread' },
      { v: cols * rows - arr.length, why: 'fills the whole grid', tag: 'misread' },
      { v: need - 1, why: 'misses one tile', tag: 'off-by-one' },
      { v: need + 1, why: 'counts one tile twice', tag: 'off-by-one' },
    ], { min: 1 });
    const pic = gridSvg(cols, rows, arr.map(([x, y]) => [x, y, 'a']), { cell: 28, label: 'tiles',
      extra: [(pad, c) => line(pad + mid * c, pad - 4, pad + mid * c, pad + rows * c + 4, { dash: true, w: 2 })] });
    return item(`Some square tiles are placed on a grid, as shown. What is the smallest number of tiles that must be added so that the pattern is symmetrical about the dashed line?`, built,
      explainWith(`Reflect each tile in the dashed line. ${need} of the tiles have no partner on the other side, so ${need} tiles must be added.`, built), { svg: pic });
  } });

/* ---- perimeter: cut square / L-shape with cut-outs ---- */
defMaths({ id: 'm-perimeter', slot: 'perimeter', topic: 'perimeter', fam: 'Space and geometry',
  gen(R, level) {
    const v = byLevel(level, R.int(0, 1), R.int(0, 2), R.int(1, 2));
    if (v === 0) {
      const side = R.int(3, 12) * 4;
      const P = side * 4;
      const cuts = R.pick([[2, 2], [3, 3], [2, 4]]);
      const pw = side / cuts[0], ph = side / cuts[1];
      if (!isInt(pw) || !isInt(ph)) return this.gen(R, level);
      const ans = 2 * (pw + ph);
      const s = rect(10, 10, 180, 180) + range(1, cuts[0] - 1).map(i => line(10 + i * 180 / cuts[0], 10, 10 + i * 180 / cuts[0], 190)).join('') +
        range(1, cuts[1] - 1).map(i => line(10, 10 + i * 180 / cuts[1], 190, 10 + i * 180 / cuts[1])).join('') + txt(100, 208, `perimeter = ${P} cm`, { size: 12 });
      const built = numOpts(R, ans, [
        { v: P / (cuts[0] * cuts[1]), why: 'divides the perimeter by the number of pieces', tag: 'operation' },
        { v: side, why: 'gives the side of the big square', tag: 'misread' },
        { v: pw * ph, why: 'gives the area of a piece', tag: 'misread' },
        { v: P / 2, why: 'halves the perimeter', tag: 'operation' },
      ], { fmt: x => x + ' cm', min: 1 });
      return item(`The perimeter of a square is ${P} cm. It is cut into ${cuts[0] * cuts[1]} equal rectangles, as shown. What is the perimeter of one of the rectangles?`, built,
        explainWith(`Each side of the square is ${side} cm, so each piece is ${pw} cm by ${ph} cm, with perimeter 2 × (${pw} + ${ph}) = ${ans} cm.`, built), { svg: svg(200, 218, s, 'square cut into rectangles') });
    }
    if (v === 1) {
      // rectangle with notches cut from edges
      const W = R.int(10, 15), H = R.int(6, 11);
      const nw = R.int(2, 3), nh = R.int(2, 3);
      // notch 1 from the top edge, notch 2 from the right edge; each adds 2*depth
      const ans = 2 * (W + H) + 4 * nh;
      const pts = [[0, 0], [3, 0], [3, nh], [3 + nw, nh], [3 + nw, 0], [W, 0], [W, 2], [W - nh, 2], [W - nh, 2 + nw], [W, 2 + nw], [W, H], [0, H]];
      const pic = shapeSvg([{ pts, fill: 'a' }], [[W / 2, H + 1.2, W + ' m'], [-1.4, H / 2, H + ' m'], [3 + nw / 2, nh + 0.9, nw + ' m'], [3 + nw + 0.9, nh / 2, nh + ' m', 'start'], [W - nh / 2, 2 + nw + 0.9, nh + ' m'], [W - nh - 0.4, 2 + nw / 2, nw + ' m', 'end']], { scale: 18, note: 'diagram not to scale' });
      const built = numOpts(R, ans, [
        { v: 2 * (W + H), why: 'ignores the extra edges made by the cut-outs', tag: 'part-only' },
        { v: 2 * (W + H) + 2 * nh, why: 'counts the extra edges for only one cut-out', tag: 'part-only' },
        { v: 2 * (W + H) + 2 * nh + 2 * nw, why: 'adds the cut-out widths as well', tag: 'slip' },
        { v: W * H - 2 * nw * nh, why: 'works out the area instead', tag: 'misread' },
        { v: 2 * (W + H) - nw - nh, why: 'subtracts the cut-out widths', tag: 'reversed' },
      ], { fmt: x => x + ' m', min: 1 });
      return item(`Two rectangles are cut out of the edges of a rectangular playground to make room for garden beds. The shaded shape is the playground that is left. What is the perimeter of the shaded shape?`, built,
        explainWith(`Pushing the edges of each cut-out back out gives the full rectangle, with perimeter 2 × (${W} + ${H}) = ${2 * (W + H)} m. Each cut-out also adds two sides of ${nh} m, so the perimeter is ${2 * (W + H)} + 4 × ${nh} = ${ans} m.`, built), { svg: pic });
    }
    // squares arranged in a row with overlaps: perimeter of a staircase
    const n = R.int(3, 6), s = R.int(2, 6);
    const ans = 4 * n * s; // staircase made of n squares each side s placed diagonally touching edges -> perimeter equals 4*n*s? Use stair: rows of 1..n squares
    const stair = n * s * 4;
    const pts = [[0, 0]];
    for (let i = 0; i < n; i++) { pts.push([(i + 1) * s, i * s]); pts.push([(i + 1) * s, (i + 1) * s]); }
    pts.push([0, n * s]);
    const built = numOpts(R, stair, [
      { v: n * s * 2 + 2 * s, why: 'counts only the outside edges of the bottom row and one column', tag: 'part-only' },
      { v: s * s * n * (n + 1) / 2, why: 'works out the area', tag: 'misread' },
      { v: 4 * s * n * (n + 1) / 2, why: 'adds the perimeters of all the squares', tag: 'misread' },
      { v: stair - 2 * s, why: 'misses two edges', tag: 'slip' },
    ], { fmt: x => x + ' cm', min: 1 });
    void ans;
    const pic = shapeSvg([{ pts, fill: 'a' }], [[n * s / 2, n * s + 1, `${n * s} cm`], [-1.3, n * s / 2, `${n * s} cm`]], { scale: Math.max(6, Math.floor(160 / (n * s))) });
    return item(`This staircase shape is made of squares of side ${s} cm. It is ${n} steps high and ${n} steps wide. What is its perimeter?`, built,
      explainWith(`Every step's top and side edges can be pushed out to make a ${n * s} cm by ${n * s} cm square, so the perimeter is 4 × ${n * s} = ${stair} cm.`, built), { svg: pic });
  } });

/* ---- area: rectangles in a design / shaded square ---- */
defMaths({ id: 'm-area', slot: 'area', topic: 'area', fam: 'Space and geometry',
  gen(R, level) {
    const v = byLevel(level, R.int(0, 1), R.int(0, 2), R.int(1, 2));
    if (v === 0) {
      // pinwheel: four rectangles around a square
      const w = R.int(2, 6), l = w + R.int(2, 7);
      const areaR = w * l;
      const sq = (l - w) * (l - w);
      const s = l + w, sc = 200 / s, o = 8;
      const rects = [[0, 0, l, w], [l, 0, w, l], [w, l, l, w], [0, w, w, l]];
      let body = rects.map(([x, y, ww, hh]) => rect(o + x * sc, o + y * sc, ww * sc, hh * sc)).join('');
      body += rect(o + w * sc, o + w * sc, (l - w) * sc, (l - w) * sc, { fill: 'a' });
      const built = numOpts(R, sq, [
        { v: (l + w) * (l + w), why: 'gives the area of the whole design', tag: 'misread' },
        { v: w * w, why: 'uses the width of a rectangle as the side of the square', tag: 'misread' },
        { v: (l + w) * (l + w) - 4 * areaR + w, why: 'is a slip in the subtraction', tag: 'slip' },
        { v: l * l, why: 'uses the length of a rectangle as the side of the square', tag: 'misread' },
        { v: l - w, why: 'gives the side of the square, not its area', tag: 'part-only' },
      ], { fmt: x => x + ' cm²', min: 1 });
      return item(`The design is made of four identical white rectangles around a shaded square. Each rectangle is ${w} cm wide and has an area of ${areaR} cm². What is the area of the shaded square?`, built,
        explainWith(`Each rectangle is ${areaR} ÷ ${w} = ${l} cm long. The square's side is the length minus the width: ${l} − ${w} = ${l - w} cm, so its area is ${sq} cm².`, built), { svg: svg(216, 216, body, 'pinwheel design') });
    }
    if (v === 1) {
      // compare shapes on a grid: area & perimeter statements
      const mk = () => { const set = new Set(['0,0']); const k = R.int(5, 9); while (set.size < k) { const [x, y] = R.pick(Array.from(set)).split(',').map(Number); const d = R.pick([[1, 0], [0, 1], [-1, 0], [0, -1]]); const nx = x + d[0], ny = y + d[1]; if (nx >= 0 && ny >= 0 && nx < 5 && ny < 4) set.add(nx + ',' + ny); } return Array.from(set).map(s => s.split(',').map(Number)); };
      const per = cells => { const set = new Set(cells.map(c => c.join(','))); let p = 0; cells.forEach(([x, y]) => [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => { if (!set.has((x + dx) + ',' + (y + dy))) p++; })); return p; };
      const X = mk(), Y = mk();
      const aX = X.length, aY = Y.length, pX = per(X), pY = per(Y);
      const st = [{ t: 'Shape X has a larger perimeter than shape Y.', v: pX > pY }, { t: 'Shapes X and Y have the same perimeter.', v: pX === pY },
        { t: 'Shape X has a larger area than shape Y.', v: aX > aY }];
      const built = statementOpts(R, st.map(s => s.v), ['1', '2', '3']);
      const pic = gridSvg(12, 4, X.map(([x, y]) => [x, y, 'a']).concat(Y.map(([x, y]) => [x + 7, y, 'b'])), { cell: 24,
        extra: [(pad, c) => txt(pad + 2.5 * c, pad + 4 * c + 12, 'X', { weight: 600 }), (pad, c) => txt(pad + 9.5 * c, pad + 4 * c + 12, 'Y', { weight: 600 })] });
      return item(`The shapes X and Y are drawn on a square grid. Which of the following statements is/are correct?<br>1&nbsp; ${st[0].t}<br>2&nbsp; ${st[1].t}<br>3&nbsp; ${st[2].t}`,
        built, `X has area ${aX} squares and perimeter ${pX} units; Y has area ${aY} squares and perimeter ${pY} units.`, { svg: pic.replace(/height="[^"]*"/, '') });
    }
    // area of a triangle inside a rectangle (shaded region)
    const W = R.int(6, 14) * 2, H = R.int(4, 10) * 2;
    const px = R.int(1, W - 1);
    const area = W * H / 2;
    const built = numOpts(R, area, [
      { v: W * H, why: 'gives the area of the whole rectangle', tag: 'misread' },
      { v: px * H / 2, why: 'uses only part of the base', tag: 'part-only' },
      { v: (W + H) * 2, why: 'works out the perimeter', tag: 'misread' },
      { v: W * H / 4, why: 'halves the area twice', tag: 'operation' },
    ], { fmt: x => x + ' cm²', min: 1 });
    const sc = 220 / W;
    const s = rect(10, 10, W * sc, H * sc) + poly([[10, 10 + H * sc], [10 + W * sc, 10 + H * sc], [10 + px * sc, 10]], { fill: 'a' }) +
      txt(10 + W * sc / 2, 24 + H * sc, `${W} cm`, { size: 12 }) + txt(W * sc + 30, 10 + H * sc / 2, `${H} cm`, { size: 12 });
    return item(`A triangle is drawn inside a ${W} cm by ${H} cm rectangle, as shown. Its top corner touches the top edge of the rectangle. What is the area of the shaded triangle?`, built,
      explainWith(`The triangle has base ${W} cm and height ${H} cm, so its area is ${W} × ${H} ÷ 2 = ${area} cm², wherever the top corner sits.`, built), { svg: svg(W * sc + 60, H * sc + 40, s, 'triangle in rectangle') });
  } });

/* ---- volume: cylinders, boxes, cubes in a box ---- */
defMaths({ id: 'm-volume', slot: 'volume', topic: 'volume', fam: 'Space and geometry',
  gen(R, level) {
    const v = byLevel(level, R.int(0, 1), R.int(0, 2), R.int(1, 2));
    if (v === 0) {
      const l = R.int(3, 9), w = R.int(2, 6), h = R.int(2, 8);
      const c = R.pick([1, 2]);
      const L = l * c, W = w * c, H = h * c;
      const ans = l * w * h;
      const built = numOpts(R, ans, [
        { v: L * W * H, why: `ignores that each cube has side ${c} cm`, tag: 'units' },
        { v: l * w + w * h + l * h, why: 'adds the face areas', tag: 'misread' },
        { v: l * w, why: 'counts only one layer', tag: 'part-only' },
        { v: 2 * (l * w + w * h + l * h), why: 'works out the surface area', tag: 'misread' },
      ], { min: 1 });
      return item(`A box measures ${L} cm long, ${W} cm wide and ${H} cm high on the inside. How many cubes of side ${c} cm fit exactly inside it?`, built,
        explainWith(`Along each edge fit ${l}, ${w} and ${h} cubes, so ${l} × ${w} × ${h} = ${ans} cubes.`, built));
    }
    if (v === 1) {
      // equal volume, different base
      const r1 = R.pick([2, 3, 4, 6]), h1 = R.int(2, 8) * 2;
      const k = R.pick([2, 3]);
      const r2 = r1 * (R.chance(0.5) ? k : 1), r1b = r2 === r1 ? r1 * k : r1;
      const hA = h1, rA = r1b, rB = r2;
      const hB = hA * rA * rA / (rB * rB);
      if (!isInt(hB)) return this.gen(R, level);
      const built = numOpts(R, hB, [
        { v: hA * rA / rB, why: 'scales by the radius instead of the radius squared', tag: 'operation' },
        { v: hA, why: 'assumes the heights are the same', tag: 'misread' },
        { v: hA * rB / rA, why: 'scales the wrong way', tag: 'reversed' },
        { v: hA * rB * rB / (rA * rA), why: 'scales by the square the wrong way', tag: 'reversed' },
      ], { fmt: x => num(x) + ' cm', int: false, min: 0.5 });
      return item(`Cylinders J and K have the same volume. Cylinder J has radius ${rA} cm and height ${hA} cm. Cylinder K has radius ${rB} cm. What is the height of cylinder K?`, built,
        explainWith(`Volume depends on radius × radius × height. ${rA} × ${rA} × ${hA} = ${rB} × ${rB} × h, so h = ${num(hB)} cm.`, built));
    }
    // water poured between containers
    const a = R.int(10, 20), b = R.int(8, 15), h = R.int(10, 30);
    const fill = R.int(4, h - 2);
    const vol = a * b * fill;
    const A2 = R.int(6, 12), B2 = R.int(5, 10);
    const newH = vol / (A2 * B2);
    if (!isInt(newH * 10) || newH > 60) return this.gen(R, level);
    const built = numOpts(R, newH, [
      { v: fill, why: 'assumes the water stays at the same height', tag: 'misread' },
      { v: round6(vol / (A2 * B2 * 10)), why: 'is ten times too small', tag: 'place' },
      { v: round6(vol / (A2 + B2) / 10), why: 'divides by the sum of the sides', tag: 'operation' },
      { v: round6(newH + fill), why: 'adds the old height', tag: 'slip' },
    ], { fmt: x => num(x) + ' cm', int: false, min: 0.1 });
    return item(`A rectangular tank ${a} cm long and ${b} cm wide holds water to a depth of ${fill} cm. All the water is poured into an empty tank with a base ${A2} cm by ${B2} cm. How deep is the water in the second tank?`, built,
      explainWith(`Volume of water: ${a} × ${b} × ${fill} = ${num(vol)} cm³. Depth in the second tank: ${num(vol)} ÷ (${A2} × ${B2}) = ${num(newH)} cm.`, built));
  } });

/* ---- 3D: hidden cubes, painted faces, stacks ---- */
defMaths({ id: 'm-solid-3d', slot: 'solid-3d', topic: '3D shapes', fam: 'Space and geometry',
  gen(R, level) {
    const v = byLevel(level, R.int(0, 1), R.int(0, 2), R.int(1, 2));
    if (v === 0) {
      // count cubes in a stack drawing
      const rows = R.int(2, 3), cols = R.int(2, 4);
      const hts = range(1, rows).map(() => range(1, cols).map(() => R.int(1, byLevel(level, 3, 3, 4))));
      // make heights non-increasing to the back so all are visible enough
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        if (r > 0) hts[r][c] = Math.min(hts[r][c], hts[r - 1][c]);
        if (c > 0) hts[r][c] = Math.min(hts[r][c], hts[r][c - 1]);
      }
      const n = sum(hts.map(r => sum(r)));
      const visibleTop = rows * cols;
      const pic = cubeStackSvg(hts.slice().reverse().map(r => r.slice().reverse()));
      const built = numOpts(R, n, [
        { v: visibleTop, why: 'counts only the top layer', tag: 'part-only' },
        { v: n - 1, why: 'misses one hidden cube', tag: 'off-by-one' },
        { v: n + rows, why: 'counts some cubes twice', tag: 'slip' },
        { v: Math.max.apply(null, hts.map(r => Math.max.apply(null, r))) * rows * cols, why: 'assumes the whole block is full', tag: 'spatial' },
      ], { min: 1 });
      return item(`A solid is built from identical cubes, as shown. No cubes are hidden except those directly under other cubes, and every cube rests on the table or on another cube. How many cubes are in the solid?`, built,
        explainWith(`Count each column of cubes: ${hts.map(r => r.join(' + ')).join(' + ')} = ${n}.`, built), { svg: pic });
    }
    if (v === 1) {
      // big cube of n^3: hidden cubes / painted faces
      const n = byLevel(level, R.int(3, 4), R.int(3, 5), R.int(4, 6));
      const q = R.int(0, 2);
      const hidden = Math.pow(n - 2, 3), oneFace = 6 * Math.pow(n - 2, 2), twoFace = 12 * (n - 2);
      const [ans, ask] = q === 0 ? [hidden, 'cannot be seen from any direction'] : q === 1 ? [oneFace, 'have paint on exactly one face'] : [twoFace, 'have paint on exactly two faces'];
      const built = numOpts(R, ans, [
        { v: hidden, why: 'counts the cubes completely inside', tag: 'spatial' },
        { v: oneFace, why: 'counts the cubes with one painted face', tag: 'spatial' },
        { v: twoFace, why: 'counts the cubes along the edges', tag: 'spatial' },
        { v: 8, why: 'counts the corner cubes', tag: 'spatial' },
        { v: Math.pow(n - 1, 3), why: 'takes off only one layer', tag: 'part-only' },
        { v: Math.pow(n, 3) - Math.pow(n - 2, 3), why: 'counts all the cubes on the outside', tag: 'misread' },
      ], { min: 0 });
      return item(`A large cube is made from ${Math.pow(n, 3)} identical small cubes (${n} along each edge). ${q === 0 ? 'The large cube can be picked up and looked at from every direction.' : 'The outside of the large cube is painted.'} How many of the small cubes ${ask}?`, built,
        explainWith(q === 0 ? `Only the cubes not on any face are hidden: a ${n - 2} × ${n - 2} × ${n - 2} block, ${hidden} cubes.` : q === 1 ? `Each face has a ${n - 2} × ${n - 2} middle, and there are 6 faces: ${oneFace}.` : `Each of the 12 edges has ${n - 2} cubes that are not corners: ${twoFace}.`, built));
    }
    // faces/edges/vertices of prisms & pyramids
    const sides = R.int(3, 10);
    const prism = R.chance(0.5);
    const F = prism ? sides + 2 : sides + 1, E = prism ? 3 * sides : 2 * sides, V = prism ? 2 * sides : sides + 1;
    const ask = R.pick([['edges', E], ['vertices (corners)', V], ['faces', F]]);
    const total = R.chance(0.5);
    const ans = total ? F + E + V : ask[1];
    const built = numOpts(R, ans, [
      { v: total ? F + E + V - 2 : (prism ? (ask[0] === 'edges' ? 2 * sides : ask[0] === 'faces' ? sides : sides) : (ask[0] === 'edges' ? sides : ask[0] === 'faces' ? sides : sides)), why: 'forgets some of the edges, faces or corners', tag: 'spatial' },
      { v: total ? F + E + V + 2 : ask[1] + 1, why: 'counts one too many', tag: 'off-by-one' },
      { v: total ? 2 * (F + V) : (prism ? (sides + 1) * 2 : sides * 2 + 2), why: 'mixes up a prism and a pyramid', tag: 'spatial' },
      { v: total ? E + V : ask[1] - 1, why: total ? 'leaves out the faces' : 'misses one', tag: 'part-only' },
    ], { min: 1 });
    const shape = prism ? `prism whose two ends are ${sides}-sided polygons` : `pyramid whose base is a ${sides}-sided polygon`;
    return item(total ? `A ${shape}. What is the total number of faces, edges and vertices (corners) it has?`.replace(/^A /, 'A solid is a ') : `A solid is a ${shape}. How many ${ask[0]} does it have?`, built,
      explainWith(`It has ${F} faces, ${E} edges and ${V} vertices.`, built));
  } });

/* ---- composite geometry: squares in a rectangle, overlapping shapes ---- */
defMaths({ id: 'm-composite-geo', slot: 'composite-geo', topic: 'composite shapes', fam: 'Space and geometry',
  gen(R, level) {
    if (R.chance(0.5)) {
      // overlap of two rectangles: total area covered
      const a = R.int(5, 12), b = R.int(4, 9), c = R.int(4, 11), d = R.int(3, 8);
      const ox = R.int(1, Math.min(a, c) - 1), oy = R.int(1, Math.min(b, d) - 1);
      const covered = a * b + c * d - ox * oy;
      const built = numOpts(R, covered, [
        { v: a * b + c * d, why: 'counts the overlap twice', tag: 'part-only' },
        { v: a * b + c * d - 2 * ox * oy, why: 'takes the overlap away twice', tag: 'operation' },
        { v: ox * oy, why: 'gives only the overlap', tag: 'misread' },
        { v: a * b + c * d - ox - oy, why: 'subtracts the overlap sides instead of its area', tag: 'misread' },
      ], { fmt: x => x + ' cm²', min: 1 });
      const sc = 12, x2 = a - ox, y2 = b - oy;
      const s = rect(10, 10, a * sc, b * sc, { fill: 'a' }) + rect(10 + x2 * sc, 10 + y2 * sc, c * sc, d * sc, { fill: 'b' });
      return item(`A ${a} cm by ${b} cm rectangle and a ${c} cm by ${d} cm rectangle overlap, as shown. The overlap is a ${ox} cm by ${oy} cm rectangle. What is the total area covered by the two rectangles?`, built,
        explainWith(`${a * b} + ${c * d} counts the overlap twice, so subtract it once: ${a * b + c * d} − ${ox * oy} = ${covered} cm².`, built), { svg: svg((x2 + c) * sc + 20, (y2 + d) * sc + 20, s, 'overlapping rectangles') });
    }
    // rectangle made of squares of different sizes (sides given relationally)
    const s1 = R.int(2, 6), s2 = s1 * 2;
    const W = s2 + s1 * 2, H = s2;
    const P = 2 * (W + H);
    const built = numOpts(R, P, [
      { v: W * H, why: 'gives the area', tag: 'misread' },
      { v: 4 * s2 + 8 * s1, why: 'adds the perimeters of all the squares', tag: 'misread' },
      { v: 2 * (s2 + s1), why: 'uses only one small square', tag: 'part-only' },
      { v: P - 2 * s1, why: 'misses an edge', tag: 'slip' },
    ], { fmt: x => x + ' cm', min: 1 });
    const sc = 160 / W;
    const s = rect(10, 10, s2 * sc, s2 * sc, { fill: 'a' }) +
      [[s2, 0], [s2 + s1, 0], [s2, s1], [s2 + s1, s1]].map(([x, y]) => rect(10 + x * sc, 10 + y * sc, s1 * sc, s1 * sc)).join('');
    return item(`A rectangle is made from one large square and four identical small squares, as shown. Each small square has a perimeter of ${4 * s1} cm. What is the perimeter of the rectangle?`, built,
      explainWith(`A small square has side ${s1} cm, so the large square has side ${s2} cm. The rectangle is ${W} cm by ${H} cm, so its perimeter is ${P} cm.`, built), { svg: svg(W * sc + 20, H * sc + 20, s, 'rectangle of squares') });
  } });

/* ---- positions along a line / compass directions ---- */
defMaths({ id: 'm-positions', slot: 'positions', topic: 'distance and position', fam: 'Space and geometry',
  gen(R, level) {
    const ppl = names(R, 5);
    // positions along a road, increasing
    const step = byLevel(level, 50, 25, 10);
    let pos;
    for (let t = 0; t < 200; t++) {
      const p = [0]; for (let i = 1; i < 5; i++) p.push(p[i - 1] + step * R.int(2, 8));
      // need Gina = 3 * (Heng - Gina) structure: p1 such that p1 - p0 = 3 (p2 - p1) for hard/medium
      pos = p;
      if (level === 'easy') break;
      const g = (3 * p[2]) / 4; if (isInt(g / step) && g > 0) { pos = [0, g, p[2], p[2] + (p[2] - g), p[4] < p[2] + (p[2] - g) + step ? p[2] + (p[2] - g) + step * 3 : p[4]]; break; }
    }
    pos = pos.map(round6);
    if (pos.some((x, i) => i && x <= pos[i - 1])) return this.gen(R, level);
    const [F, G, H, J, K] = ppl;
    const ans = pos[4] - pos[3];
    let clues;
    if (level === 'easy') clues = [`${F} lives ${pos[2]} m from ${H} and ${pos[4]} m from ${K}.`, `${G} lives ${pos[1]} m from ${F}.`, `${J} lives ${pos[3] - pos[2]} m from ${H}.`];
    else clues = [`${F} lives ${pos[2]} m from ${H} and ${pos[4]} m from ${K}.`, `${G} lives three times as far from ${F} as from ${H}.`, `${G} and ${J} live equal distances from ${H}.`];
    const built = numOpts(R, ans, [
      { v: pos[4] - pos[2], why: `gives the distance from ${H} to ${K}`, tag: 'misread' },
      { v: pos[4] - pos[1] * 2, why: 'places one of the houses on the wrong side', tag: 'reversed' },
      { v: pos[3], why: `gives the distance from ${F} to ${J}`, tag: 'misread' },
      { v: ans + step * 2, why: 'is a slip in one of the distances', tag: 'slip' },
    ], { fmt: x => num(x) + ' m', min: 1, step });
    return item(`Five friends live in houses on a long straight road, in this order:<br><b>${ppl.join(', ')}</b><br>${clues.join(' ')}<br>How far does ${J} live from ${K}?`, built,
      explainWith(`Measuring from ${F}: ${G} is at ${pos[1]} m, ${H} at ${pos[2]} m, ${J} at ${pos[3]} m and ${K} at ${pos[4]} m. So ${J} is ${ans} m from ${K}.`, built));
  } });
