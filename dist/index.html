<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selective Exam Practice</title>
<meta name="description" content="100 full practice exams for the NSW Selective High School Placement Test: Reading, Thinking Skills, Mathematical Reasoning and Writing, at three levels, with explanations and a mistakes notebook.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* ==========================================================================
   Palette — light is the base; dark redefines only the tokens, three ways
   ========================================================================== */
:root{
  --paper:#f5f4ef; --surface:#ffffff; --surface-2:#faf9f5;
  --ink:#171f27; --ink-soft:#5a6672; --ink-faint:#8a95a0;
  --rule:#d8d6cd; --rule-soft:#e7e5dd;
  --harbour:#14507a; --harbour-ink:#0e3b5c; --harbour-wash:#e9f0f6; --harbour-line:#a9c4d9;
  --ochre:#9d6a15; --ochre-wash:#f7efdd;
  --good:#2c6a4f; --good-wash:#e6f0ea;
  --bad:#9d3a2c; --bad-wash:#f7e9e6;
  --shadow:0 1px 2px rgba(23,31,39,.06), 0 8px 24px -16px rgba(23,31,39,.22);
  --shadow-lift:0 2px 4px rgba(23,31,39,.08), 0 18px 40px -24px rgba(23,31,39,.3);
  --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --serif:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --on-accent:#ffffff;
  --chart:#2f6f9e; --chart-soft:#cfe0ec;
  --rail:#14507a;
  --r:3px; --r-lg:6px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11171c; --surface:#19212a; --surface-2:#1e2831;
    --ink:#e8edf1; --ink-soft:#9dabb7; --ink-faint:#75828e;
    --rule:#2d3841; --rule-soft:#242e37;
    --harbour:#79b6e6; --harbour-ink:#a8d0ee; --harbour-wash:#1a2b3a; --harbour-line:#33536e;
    --ochre:#d9a44e; --ochre-wash:#2e2718;
    --on-accent:#0d1418;
    --good:#63b48c; --good-wash:#1a2b23;
    --bad:#e08a7a; --bad-wash:#2e1f1c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -24px rgba(0,0,0,.8);
    --chart:#7fb8e2; --chart-soft:#22384a;
    --rail:#4a8cbb;
  }
}
:root[data-theme="dark"]{
  --paper:#11171c; --surface:#19212a; --surface-2:#1e2831;
  --ink:#e8edf1; --ink-soft:#9dabb7; --ink-faint:#75828e;
  --rule:#2d3841; --rule-soft:#242e37;
  --harbour:#79b6e6; --harbour-ink:#a8d0ee; --harbour-wash:#1a2b3a; --harbour-line:#33536e;
  --ochre:#d9a44e; --ochre-wash:#2e2718;
  --on-accent:#0d1418;
  --good:#63b48c; --good-wash:#1a2b23;
  --bad:#e08a7a; --bad-wash:#2e1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -24px rgba(0,0,0,.8);
  --chart:#7fb8e2; --chart-soft:#22384a;
  --rail:#4a8cbb;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; line-height:1.2; font-weight:600}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
:focus-visible{outline:2px solid var(--harbour); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}

.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-faint);
}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.hidden{display:none !important}

/* ==========================================================================
   Shell
   ========================================================================== */
#app{min-height:100vh; display:flex; flex-direction:column}

/* ---------- Home ---------- */
.home{max-width:1080px; margin:0 auto; padding:32px 24px 72px; display:flex; flex-direction:column; gap:32px}
.masthead{display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap;
  border-bottom:1px solid var(--rule); padding-bottom:20px}
.masthead h1{font-size:27px; letter-spacing:-.015em}
.masthead h1 span{color:var(--harbour)}
.masthead .sub{color:var(--ink-soft); font-size:14px; margin-top:5px; max-width:56ch}
.toolbar{display:flex; gap:8px; align-items:center}
.icon-btn{border:1px solid var(--rule); border-radius:var(--r); padding:6px 10px; font-size:12px;
  font-family:var(--mono); color:var(--ink-soft); background:var(--surface)}
.icon-btn:hover{border-color:var(--harbour); color:var(--harbour)}

.setup{display:flex; flex-wrap:wrap; gap:24px; align-items:flex-end;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg); padding:18px 20px}
.field{display:flex; flex-direction:column; gap:7px}
.field > .eyebrow{color:var(--ink-soft)}
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:var(--r); overflow:hidden}
.seg button{padding:7px 15px; font-size:13px; color:var(--ink-soft); border-right:1px solid var(--rule)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--harbour); color:var(--on-accent); font-weight:500}
.hint{font-size:12.5px; color:var(--ink-faint); max-width:40ch}

.modules{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
.mod{
  position:relative; text-align:left; background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r-lg); padding:18px 18px 16px; display:flex; flex-direction:column; gap:12px;
  transition:border-color .15s, box-shadow .15s, transform .15s;
}
.mod:hover{border-color:var(--harbour-line); box-shadow:var(--shadow-lift); transform:translateY(-1px)}
.mod .num{font-family:var(--mono); font-size:11px; color:var(--ink-faint); letter-spacing:.1em}
.mod h3{font-size:18px; letter-spacing:-.01em}
.mod .spec{display:flex; gap:14px; font-family:var(--mono); font-size:12px; color:var(--ink-soft);
  font-variant-numeric:tabular-nums; border-top:1px solid var(--rule-soft); padding-top:11px}
.mod .blurb{font-size:13px; color:var(--ink-soft); line-height:1.5}
.mod .go{font-size:13px; color:var(--harbour); font-weight:500}
.mod .best{position:absolute; top:14px; right:16px; font-family:var(--mono); font-size:11px;
  color:var(--ink-faint)}

.panel{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg); padding:20px}
.panel h2{font-size:16px; margin-bottom:4px}
.panel .lede{font-size:13.5px; color:var(--ink-soft); margin-bottom:16px}
table.grid{width:100%; border-collapse:collapse; font-size:13.5px}
table.grid th{text-align:left; font-family:var(--mono); font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-faint); font-weight:400; padding:0 10px 8px 0;
  border-bottom:1px solid var(--rule)}
table.grid td{padding:9px 10px 9px 0; border-bottom:1px solid var(--rule-soft); vertical-align:middle}
table.grid td.num{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; padding-right:0}
.empty{font-size:13.5px; color:var(--ink-faint); padding:6px 0}
.bar{height:5px; background:var(--rule-soft); border-radius:3px; overflow:hidden; min-width:64px}
.bar i{display:block; height:100%; background:var(--harbour); border-radius:3px}
footer.fine{font-size:12px; color:var(--ink-faint); border-top:1px solid var(--rule); padding-top:16px;
  display:flex; flex-wrap:wrap; gap:6px 18px}

/* ==========================================================================
   Player
   ========================================================================== */
.player{display:flex; flex-direction:column; min-height:100vh; background:var(--paper)}
.topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:16px;
  padding:9px 18px; background:var(--surface); border-bottom:1px solid var(--rule);
}
.topbar .who{display:flex; flex-direction:column; min-width:0}
.topbar .who b{font-size:14px; font-weight:600; white-space:nowrap}
.topbar .who span{font-family:var(--mono); font-size:11px; color:var(--ink-faint)}
.topbar .spacer{flex:1}
.counter{font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.clock{
  font-family:var(--mono); font-size:20px; font-variant-numeric:tabular-nums; letter-spacing:.02em;
  padding:3px 11px; border:1px solid var(--rule); border-radius:var(--r); color:var(--ink);
}
.clock.warn{border-color:var(--ochre); color:var(--ochre); background:var(--ochre-wash)}
.clock.paused{color:var(--ink-faint)}
.btn{border:1px solid var(--rule); border-radius:var(--r); padding:7px 13px; font-size:13px; background:var(--surface)}
.btn:hover{border-color:var(--harbour); color:var(--harbour)}
.btn.primary{background:var(--harbour); border-color:var(--harbour); color:var(--on-accent); font-weight:500}
.btn.primary:hover{background:var(--harbour-ink); color:var(--on-accent)}
.btn.flag[aria-pressed="true"]{background:var(--ochre-wash); border-color:var(--ochre); color:var(--ochre)}
.btn:disabled{opacity:.4; cursor:default}

.stage{flex:1; display:flex; min-height:0; align-items:stretch}
.stimpane{
  flex:0 0 48%; max-width:640px; border-right:1px solid var(--rule); background:var(--surface-2);
  overflow-y:auto; padding:22px 26px 60px;
}
.qpane{flex:1; overflow-y:auto; padding:22px 26px 96px}
.qpane .inner{max-width:660px; margin:0 auto}
@media (max-width:900px){
  .stage{flex-direction:column}
  .stimpane{flex:none; max-width:none; max-height:46vh; border-right:none; border-bottom:1px solid var(--rule)}
}

/* ---------- stimulus typography ---------- */
.stim{font-family:var(--serif); font-size:16px; line-height:1.62; color:var(--ink)}
.stim .rubric{font-family:var(--sans); font-size:13px; color:var(--ink-soft); background:var(--harbour-wash);
  border-left:2px solid var(--harbour-line); padding:10px 13px; margin-bottom:20px; line-height:1.5}
.stim .sec-title{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--harbour); margin-bottom:14px}
.stim .headnote{font-style:italic; color:var(--ink-soft); font-size:14.5px; margin-bottom:16px}
.stim .label{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-faint); border-bottom:1px solid var(--rule); padding-bottom:5px; margin:22px 0 12px}
.stim p{margin:0 0 12px}
.stim p:last-child{margin-bottom:0}
.stim b{font-weight:600}
.stim .gloss{border:1px solid var(--rule); border-radius:var(--r); padding:11px 13px; margin-bottom:18px;
  font-family:var(--sans); font-size:13px; background:var(--surface)}
.stim .gloss dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px}
.stim .gloss dt{font-weight:600}
.stim .gloss dd{margin:0; color:var(--ink-soft)}
.verse{display:grid; grid-template-columns:2.6em 1fr; gap:0 8px; font-family:var(--serif)}
.verse .ln{font-family:var(--mono); font-size:11px; color:var(--ink-faint); text-align:right; padding-top:5px}
.verse .lt{white-space:pre-wrap}
.verse .brk{height:12px; grid-column:1 / -1}
.gapmark{font-family:var(--mono); font-size:13px; color:var(--harbour); font-weight:600;
  background:var(--harbour-wash); border-bottom:1px solid var(--harbour-line); padding:1px 5px; border-radius:2px}
.gapmark.done{color:var(--ink-soft); background:var(--rule-soft); border-bottom-color:var(--rule)}
.gapmark.here{box-shadow:0 0 0 2px var(--harbour)}
.sentlist{font-family:var(--sans); font-size:14px; border-top:1px solid var(--rule); margin-top:20px; padding-top:14px}
.sentlist .s{display:grid; grid-template-columns:1.6em 1fr; gap:8px; padding:5px 0}
.sentlist .s .l{font-family:var(--mono); font-weight:600; color:var(--harbour)}
.exlabel{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--harbour);
  display:inline-block; border:1px solid var(--harbour-line); border-radius:2px;
  width:1.7em; text-align:center; margin-right:8px}

/* ---------- question ---------- */
.qhead{display:flex; align-items:baseline; gap:12px; margin-bottom:14px}
.qnum{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--harbour)}
.qtopic{font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-faint); margin-left:auto}
.qpassage{font-family:var(--serif); font-size:15.5px; line-height:1.6; background:var(--surface);
  border:1px solid var(--rule); border-radius:var(--r-lg); padding:15px 17px; margin-bottom:18px}
.qpassage p{margin:0 0 10px}
.qpassage p:last-child{margin:0}
.qstem{font-size:16px; line-height:1.5; margin-bottom:16px}
.qfig{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg);
  padding:14px; margin-bottom:18px; display:flex; justify-content:center}
.qfig svg{max-width:100%; height:auto; max-height:300px; color:var(--ink)}
.qtable{overflow-x:auto; margin-bottom:18px; border:1px solid var(--rule); border-radius:var(--r-lg); background:var(--surface)}
.qtable table{border-collapse:collapse; width:100%; font-size:13.5px; font-family:var(--mono);
  font-variant-numeric:tabular-nums}
.qtable th,.qtable td{border:1px solid var(--rule-soft); padding:7px 11px; text-align:right; white-space:nowrap}
.qtable th{background:var(--surface-2); font-weight:600; color:var(--ink-soft); text-align:center}
.qtable td:first-child,.qtable th:first-child{text-align:left}
.qtable caption{caption-side:top; padding:9px 11px; font-family:var(--sans); font-size:12.5px;
  color:var(--ink-soft); text-align:left; border-bottom:1px solid var(--rule)}

.opts{display:flex; flex-direction:column; gap:8px}
.opt{
  display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
  border:1px solid var(--rule); border-radius:var(--r-lg); background:var(--surface);
  padding:11px 14px; transition:border-color .12s, background .12s;
}
.opt:hover{border-color:var(--harbour-line); background:var(--harbour-wash)}
.opt .l{
  flex:0 0 auto; font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--ink-soft);
  width:22px; height:22px; border:1px solid var(--rule); border-radius:50%;
  display:grid; place-items:center; margin-top:1px;
}
.opt .t{flex:1; font-size:15px; line-height:1.45}
.opt.sel{border-color:var(--harbour); background:var(--harbour-wash)}
.opt.sel .l{background:var(--harbour); border-color:var(--harbour); color:var(--on-accent)}
.opt.figopt .t svg{max-width:100%; height:auto; max-height:150px; color:var(--ink); display:block}
.opts.figs{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px}
.opts.letters{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.opts.letters .opt{justify-content:center; padding:13px 0}
.opts.letters .opt .t{flex:0; font-family:var(--mono); font-weight:600; font-size:15px}
.opt.right{border-color:var(--good); background:var(--good-wash)}
.opt.right .l{background:var(--good); border-color:var(--good); color:var(--on-accent)}
.opt.wrong{border-color:var(--bad); background:var(--bad-wash)}
.opt.wrong .l{background:var(--bad); border-color:var(--bad); color:var(--on-accent)}

.botbar{
  position:sticky; bottom:0; z-index:20; display:flex; align-items:center; gap:10px;
  padding:10px 18px; background:var(--surface); border-top:1px solid var(--rule);
}
.botbar .spacer{flex:1}
.progress{flex:0 0 180px; height:4px; background:var(--rule-soft); border-radius:2px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--harbour)}

/* ---------- navigator ---------- */
.navwrap{position:fixed; inset:0; z-index:50; background:rgba(10,16,20,.5); display:grid; place-items:center; padding:24px}
.navcard{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg);
  box-shadow:var(--shadow-lift); max-width:660px; width:100%; max-height:82vh; overflow-y:auto; padding:22px}
.navcard h3{font-size:16px; margin-bottom:4px}
.navcard .lede{font-size:13px; color:var(--ink-soft); margin-bottom:16px}
.chips{display:grid; grid-template-columns:repeat(auto-fill,minmax(44px,1fr)); gap:7px}
.chip{position:relative; font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums;
  border:1px solid var(--rule); border-radius:var(--r); padding:8px 0; text-align:center; background:var(--surface-2)}
.chip.answered{background:var(--harbour); border-color:var(--harbour); color:var(--on-accent)}
.chip.flagged::after{content:""; position:absolute; top:0; right:0; width:0; height:0;
  border-top:9px solid var(--ochre); border-left:9px solid transparent}
.chip.here{box-shadow:0 0 0 2px var(--harbour)}
.chip.right{background:var(--good); border-color:var(--good); color:var(--on-accent)}
.chip.wrong{background:var(--bad); border-color:var(--bad); color:var(--on-accent)}
.navlegend{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:16px; font-size:12px; color:var(--ink-soft)}
.navlegend i{display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:5px;
  vertical-align:-1px; border:1px solid var(--rule)}
.navsec{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-faint); margin:18px 0 8px}
.navsec:first-of-type{margin-top:0}

/* ==========================================================================
   Writing
   ========================================================================== */
.writing{max-width:820px; margin:0 auto; padding:24px 26px 90px; display:flex; flex-direction:column; gap:20px}
.taskcard{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg); padding:20px 22px}
.taskcard .genre{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--harbour)}
.taskcard h2{font-size:21px; margin:6px 0 12px; font-family:var(--serif)}
.taskcard .stimulus{font-family:var(--serif); font-size:15.5px; line-height:1.6; color:var(--ink); margin-bottom:14px}
.taskcard .stimulus p{margin:0 0 9px}
.taskcard .task{font-size:16px; font-weight:600; line-height:1.45; border-top:1px solid var(--rule); padding-top:14px}
.taskcard ul.guide{margin:12px 0 0; padding-left:20px; font-size:13.5px; color:var(--ink-soft); line-height:1.6}
.editor{display:flex; flex-direction:column; gap:8px}
.editor textarea{
  font-family:var(--serif); font-size:16px; line-height:1.7; color:var(--ink); background:var(--surface);
  border:1px solid var(--rule); border-radius:var(--r-lg); padding:18px 20px; min-height:44vh; resize:vertical;
  width:100%;
}
.editor textarea:focus{outline:none; border-color:var(--harbour); box-shadow:0 0 0 3px var(--harbour-wash)}
.editmeta{display:flex; gap:18px; align-items:center; font-family:var(--mono); font-size:12px; color:var(--ink-faint);
  font-variant-numeric:tabular-nums; flex-wrap:wrap}
.rubric{display:flex; flex-direction:column; gap:14px}
.crit{border:1px solid var(--rule); border-radius:var(--r-lg); background:var(--surface); padding:16px 18px}
.crit header{display:flex; align-items:baseline; gap:10px; margin-bottom:10px}
.crit header h4{font-size:15px}
.crit header .w{font-family:var(--mono); font-size:11px; color:var(--ink-faint); margin-left:auto}
.crit .checks{margin:0 0 12px; padding-left:19px; font-size:13.5px; color:var(--ink-soft); line-height:1.6}
.bands{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px}
.bandbtn{border:1px solid var(--rule); border-radius:var(--r); background:var(--surface-2); padding:9px 11px;
  text-align:left; font-size:12.5px; line-height:1.45; color:var(--ink-soft)}
.bandbtn b{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--ink-faint);
  margin-bottom:3px}
.bandbtn:hover{border-color:var(--harbour-line)}
.bandbtn[aria-pressed="true"]{border-color:var(--harbour); background:var(--harbour-wash); color:var(--ink)}
.bandbtn[aria-pressed="true"] b{color:var(--harbour)}

/* ==========================================================================
   Results
   ========================================================================== */
.results{max-width:900px; margin:0 auto; padding:28px 26px 90px; display:flex; flex-direction:column; gap:24px}
.scoreline{display:flex; gap:26px; align-items:flex-end; flex-wrap:wrap; border-bottom:1px solid var(--rule);
  padding-bottom:20px}
.scoreline .big{font-family:var(--mono); font-size:46px; line-height:1; font-variant-numeric:tabular-nums;

const TIERS = {

/* ---------- seeded rng ---------- */
function makeRng(seed) {
  let s = seed >>> 0;
  if (s === 0) s = 0x9e3779b9;

/* ---- src/engine/audit.js ---- */
/* ==========================================================================
   Key auditor — the answer key is itself an item. Four ways it has leaked on
   earlier papers: block permutations, perfectly even counts, too few adjacent
   repeats, and a letter that is never correct inside a section.
   ========================================================================== */
function auditKey(letters, nopts, sections) {
  const n = letters.length;
  const hard = [], soft = [];
  const alphabet = LETTERS.slice(0, nopts).split('');
  const count = {};
  alphabet.forEach(L => count[L] = 0);
  letters.forEach(L => { if (count[L] != null) count[L]++; });

  // --- blocking defects: a candidate could exploit any of these
  alphabet.forEach(L => { if (count[L] === 0) hard.push(`letter ${L} is never correct`); });
  const lo = Math.max(2, Math.floor(n / nopts * 0.42));
  const hi = Math.ceil(n / nopts * 1.75);
  alphabet.forEach(L => { if (count[L] > hi) hard.push(`letter ${L} used ${count[L]} times, more than ${hi}`); });
  for (let i = 0; i + 3 <= n; i++) {
    if (letters[i] === letters[i + 1] && letters[i + 1] === letters[i + 2]) hard.push(`three identical letters at Q${i + 1}`);
  }
  // Test 7's leak was that EVERY aligned block was a permutation of A-E. One or
  // two by chance is normal, so only an excess is a leak.
  const perms = [];
  for (let i = 0; i + nopts <= n; i += nopts) {
    const block = letters.slice(i, i + nopts);
    if (alphabet.every(L => block.includes(L))) perms.push(`Q${i + 1}–Q${i + nopts}`);
  }
  const nblocks = Math.floor(n / nopts);
  const permCap = Math.max(1, Math.round(nblocks * 0.25));
  if (perms.length > permCap) hard.push(`${perms.length} of ${nblocks} aligned blocks are permutations of A–${alphabet[nopts - 1]} (${perms.slice(0, 3).join(', ')})`);
  else if (perms.length === permCap && permCap > 1) soft.push(`${perms.length} aligned blocks are permutations of A–${alphabet[nopts - 1]}`);
  for (let i = 0; i + 7 <= n; i++) {
    const w = letters.slice(i, i + 7);
    if (new Set(w).size === 2 && w.every((L, k) => L === w[k % 2])) hard.push(`seven-item two-letter alternation at Q${i + 1}`);
  }
  (sections || []).forEach(sec => {
    const slice = letters.slice(sec.from - 1, sec.to);
    const opts = sec.opts || nopts;
    const abc = LETTERS.slice(0, opts).split('');
    if (slice.length >= opts * 2) {
      abc.forEach(L => { if (!slice.includes(L)) hard.push(`${sec.title}: letter ${L} never correct`); });
    }
    if (sec.matching) {
      const c = {}; abc.forEach(L => c[L] = 0); slice.forEach(L => c[L]++);
      abc.forEach(L => {
        if (c[L] < 2) hard.push(`${sec.title}: extract ${L} keyed only ${c[L]} time(s)`);
        if (c[L] > 4) hard.push(`${sec.title}: extract ${L} keyed ${c[L]} times`);
      });
    }
  });

  // --- advisory: a random key breaks these often, so they steer rather than block
  if (new Set(alphabet.map(L => count[L])).size === 1) soft.push('letter counts are perfectly even, which no real paper has');
  alphabet.forEach(L => { if (count[L] < lo) soft.push(`letter ${L} correct only ${count[L]} times`); });
  let reps = 0;
  for (let i = 1; i < n; i++) if (letters[i] === letters[i - 1]) reps++;
  const expected = (n - 1) / nopts;
  if (reps < Math.max(1, Math.floor(expected * 0.35))) soft.push(`only ${reps} adjacent repeats; chance gives about ${Math.round(expected)}`);
  if (reps > Math.ceil(expected * 2.1)) soft.push(`${reps} adjacent repeats; chance gives about ${Math.round(expected)}`);
  const win = nopts === 5 ? 16 : 12;
  for (let i = 0; i + win <= n; i++) {
    const w = new Set(letters.slice(i, i + win));
    alphabet.forEach(L => { if (!w.has(L)) soft.push(`no ${L} anywhere in Q${i + 1}–Q${i + win}`); });
  }

  return { ok: hard.length === 0, clean: hard.length === 0 && soft.length === 0,
           hard, soft, issues: hard.concat(soft), counts: count, reps };
}

/* An option list is "ordered" when its printed order carries meaning — numeric
   values (Maths keeps these ascending), or line/stanza references. Those must
   never be shuffled; everything else may be. */
function orderedOptions(opts) {
  if (!Array.isArray(opts)) return true;
  const num = opts.every(o => typeof o === 'string' && /\d/.test(o) &&
    /^[-−+]?\$?\s*[\d\s,]*\d(\.\d+)?\s*[a-zA-Z²³%°\/]*$/.test(o.trim()));
  if (num) return true;
  if (opts.every(o => /^(lines?|stanzas?|verse|the (first|second|third|last|fourth))\b/i.test(String(o).trim()))) return true;
  return false;

  const list = it.options || it.optionSvgs || [];
  const order = R.shuffle(list.map((_, i) => i));
  if (it.options) it.options = order.map(i => it.options[i]);
  if (it.optionSvgs) it.optionSvgs = order.map(i => it.optionSvgs[i]);
  if (it.whys) it.whys = order.map(i => it.whys[i]);
  if (it.tags) it.tags = order.map(i => it.tags[i]);
  it.answer = order.indexOf(it.answer);
}

/* Repair pass — hill-climb by swapping items that may legitimately trade
   places (same difficulty tier in Maths, same kind in Thinking Skills, the ten
   matching statements in Reading). Reordering never changes an item, so this
   costs nothing and is what earlier papers did by hand. */
function repairKey(paper, nopts, R) {
  const items = paper.items;
  const score = () => {
    const a = auditKey(items.map(i => LETTERS[i.answer]), nopts, paper.sections);
    return { a, v: a.hard.length * 100 + a.soft.length };
  };
  // Both move sets are recomputed from the live array on every step. Caching
  // indices once was a real defect in the first build: a swap changes which item
  // sits at which index, so a cached "shufflable" index could later hand a
  // numeric item to the option-shuffler and destroy its ascending order.
  const swapGroups = () => {
    const g = {};
    items.forEach((it, i) => { if (it.swapGroup) (g[it.swapGroup] = g[it.swapGroup] || []).push(i); });
    return Object.keys(g).map(k => g[k]).filter(a => a.length > 1);
  };
  const shufIdx = () => items.map((it, i) => (it.shufflable ? i : -1)).filter(i => i >= 0);

  let cur = score();
  if (!swapGroups().length && !shufIdx().length) return cur.a;
  for (let step = 0; step < 1400 && cur.v > 0; step++) {
    const groups = swapGroups(), shuf = shufIdx();
    const useShuffle = shuf.length && (!groups.length || R.int(0, 2) > 0);
    if (useShuffle) {
      const i = R.pick(shuf);
      const it = items[i];
      if (!it.shufflable) continue;
      const before = { options: it.options && it.options.slice(), optionSvgs: it.optionSvgs && it.optionSvgs.slice(),
        whys: it.whys && it.whys.slice(), tags: it.tags && it.tags.slice(), answer: it.answer };
      permuteOptions(it, R);
      const next = score();
      if (next.v <= cur.v) cur = next;
      else Object.assign(it, before);
    } else {
      const g = R.pick(groups);
      const i = R.pick(g), j = R.pick(g);
      if (i === j) continue;
      const t = items[i]; items[i] = items[j]; items[j] = t;
      const next = score();
      if (next.v <= cur.v) cur = next;
      else { const u = items[i]; items[i] = items[j]; items[j] = u; }
    }
  }
  items.forEach((it, i) => { it.n = i + 1; });
  return score().a;
}

  const w = Math.trunc(n / d), r = Math.abs(n % d);

/* Numeric options. `correct` is a number; `cands` are wrong values with the
   mistake that produces each. Options are distinct after formatting, sorted
   ascending (as the real Maths paper prints them) unless sort:false. */
function numOpts(R, correct, cands, o) {
  o = o || {};
  const n = o.n || 5, fmt = o.fmt || num;
  const min = o.min == null ? -Infinity : o.min;
  const intOnly = o.int !== false && isInt(correct);
  const dp = x => { const t = String(round6(Math.abs(x))); const i = t.indexOf('.'); return i < 0 ? 0 : t.length - i - 1; };
  const maxDp = Math.max(o.maxDp == null ? 2 : o.maxDp, dp(correct));
  const cs = fmt(correct);
  const seen = new Set([cs]);
  const valid = c => {
    const v = round6(c.v);
    if (!isFinite(v) || v < min) return null;
    if (dp(v) > maxDp) return null;
    if (intOnly && !isInt(v)) return null;
    if (o.max != null && v > o.max) return null;
    const s = fmt(v);
    if (seen.has(s)) return null;
    return { v, s, ok: false, why: c.why || 'comes from a slip in the working', tag: c.tag || 'slip' };
  };

  const named = [];
  (cands || []).forEach(c => { const x = valid(c); if (x) { seen.add(x.s); named.push(x); } });
  const unit = Math.pow(10, -maxDp);
  let step = o.step || (intOnly ? Math.max(1, Math.round(Math.abs(correct) / 10)) : Math.max(unit, Math.abs(correct) / 10));
  if (!intOnly) step = Math.max(unit, Math.round(step / unit) * unit);
  const filler = side => {
    for (let t = 0; t < 80; t++) {
      const k = R.int(1, 3 + Math.floor(t / 8));
      const raw = correct + side * k * step;
      const x = valid({ v: intOnly ? Math.round(raw) : Math.round(raw / unit) * unit, why: 'comes from a slip in the working', tag: 'slip' });
      if (x) { seen.add(x.s); return x; }

    picked = named.slice(0, n - 1);
    while (picked.length < n - 1) { const f = filler(R.chance(0.5) ? 1 : -1) || filler(1); if (!f) break; picked.push(f); }

    const lo = Math.max(0, (n - 1) - above.length - 2), hi = Math.min(n - 1, below.length + 2);

    answer: out.findIndex(x => x.ok),

/* Text options where each wrong option carries its own reason. `order` can

    if (seen.has(s)) return;

  });

  return { options: out.map(x => x.s), answer: out.findIndex(x => x.ok),

/* "Which statements are correct?" — the five standard combinations the real
   paper uses, always including the true combination. labels like ['X','Y','Z'] */
function statementOpts(R, truth, labels, n) {
  n = n || 5;
  labels = labels || ['X', 'Y', 'Z'];
  const describe = set => {
    if (!set.length) return 'none of them';
    if (set.length === labels.length) return 'statements ' + listAnd(set);
    return (set.length === 1 ? 'statement ' : 'statements ') + listAnd(set) + ' only';
  };
  const all = [];
  const k = labels.length;
  for (let mask = 0; mask < (1 << k); mask++) {
    const set = labels.filter((_, i) => mask & (1 << i));
    all.push({ mask, s: describe(set) });
  }
  const trueMask = truth.reduce((m, t, i) => m | (t ? 1 << i : 0), 0);
  const correct = all.find(a => a.mask === trueMask);
  const pool = R.shuffle(all.filter(a => a.mask !== trueMask));
  // near misses first: differ by one statement
  const bits = m => m.toString(2).split('').filter(c => c === '1').length;
  pool.sort((a, b) => bits(a.mask ^ trueMask) - bits(b.mask ^ trueMask));
  const chosen = [correct].concat(pool.slice(0, n - 1));
  chosen.sort((a, b) => bits(a.mask) - bits(b.mask) || a.mask - b.mask);

    options: chosen.map(c => cap(c.s)),
    answer: chosen.indexOf(correct),
    whys: chosen.map(c => c === correct ? null : 'gets at least one of the statements wrong'),
    tags: chosen.map(c => c === correct ? null : 'misread'),

  }
  if (idx == null || idx < 0) return text;
  return text + ' ' + built.options[idx] + ' ' + built.whys[idx] + '.';

  return Object.assign({ stem, options: built.options, answer: built.answer, whys: built.whys, tags: built.tags,

  return `<polygon points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" ${fill}/>`;
}
function circ(cx, cy, r, o) {
  o = o || {};
  const fill = o.fill === 'a' ? SVG_ACCENT : o.fill === 'b' ? SVG_ACCENT2 : o.fill === 'ink' ? 'style="fill:currentColor"' : '';

/* A shape made of grid cells. cells: [[col,row],...]; marks: {key:'a'|'b'} */

  o = o || {};
  const c = o.cell || 26, pad = 6;

    for (let i = 0; i <= cols; i++) s += line(pad + i * c, pad, pad + i * c, pad + rows * c, { op: 0.22, w: 1 });
    for (let j = 0; j <= rows; j++) s += line(pad, pad + j * c, pad + cols * c, pad + j * c, { op: 0.22, w: 1 });
  }
  (filled || []).forEach(([x, y, f]) => { s += rect(pad + x * c, pad + y * c, c, c, { fill: f || 'a' }); });
  (o.extra || []).forEach(e => { s += e(pad, c); });
  return svg(cols * c + pad * 2, rows * c + pad * 2, s, o.label || 'grid');
}

/* Column graph. values: numbers; labels: strings */
function barChart(labels, values, o) {
  o = o || {};
  const W = o.w || 360, H = o.h || 220, L = 44, B = 36, T = 14, Rt = 10;
  const max = o.max || Math.max.apply(null, values);
  const step = o.step || niceStep(max);
  const top = Math.ceil(max / step) * step;
  const pw = W - L - Rt, ph = H - T - B;
  const bw = pw / labels.length * 0.56;
  let s = '';
  for (let v = 0; v <= top; v += step) {
    const y = T + ph - v / top * ph;
    s += line(L, y, W - Rt, y, { op: 0.18, w: 1 });
    s += txt(L - 6, y, num(v), { anchor: 'end', size: 11 });
  }
  s += line(L, T, L, T + ph) + line(L, T + ph, W - Rt, T + ph);
  labels.forEach((lb, i) => {
    const cx = L + pw / labels.length * (i + 0.5);
    const v = values[i];
    if (v != null) {
      const h = v / top * ph;
      s += rect(cx - bw / 2, T + ph - h, bw, h, { fill: 'a' });
    } else {
      s += txt(cx, T + ph - 12, '?', { size: 14, weight: 600 });
    }
    s += txt(cx, T + ph + 13, lb, { size: 11 });
  });
  if (o.xLabel) s += txt(L + pw / 2, H - 6, o.xLabel, { size: 11 });
  if (o.yLabel) s += `<text x="12" y="${T + ph / 2}" fill="currentColor" stroke="none" font-size="11" text-anchor="middle" transform="rotate(-90 12 ${T + ph / 2})">${o.yLabel}</text>`;
  return svg(W, H, s, o.label || 'column graph');
}
function niceStep(max) {
  const raw = max / 5;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}

/* Line graph with one or more series. xs labels, series: [{name, vals, dash}] */
function lineChart(xs, series, o) {
  o = o || {};
  const W = o.w || 380, H = o.h || 230, L = 44, B = 40, T = 14, Rt = 12;
  const all = [].concat.apply([], series.map(s => s.vals));
  const max = o.max || Math.max.apply(null, all), min = o.min != null ? o.min : 0;
  const step = o.step || niceStep(max - min);
  const top = Math.ceil(max / step) * step, bot = Math.floor(min / step) * step;
  const pw = W - L - Rt, ph = H - T - B;
  const X = i => L + (xs.length === 1 ? pw / 2 : i * pw / (xs.length - 1));
  const Y = v => T + ph - (v - bot) / (top - bot) * ph;
  let s = '';
  for (let v = bot; v <= top + 1e-9; v += step) {
    s += line(L, Y(v), W - Rt, Y(v), { op: 0.18, w: 1 }) + txt(L - 6, Y(v), num(round6(v)), { anchor: 'end', size: 11 });
  }
  s += line(L, T, L, T + ph) + line(L, T + ph, W - Rt, T + ph);
  xs.forEach((x, i) => { s += txt(X(i), T + ph + 13, x, { size: 10.5 }); });
  series.forEach((sr, k) => {
    const d = sr.vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    s += `<path d="${d}"${sr.dash ? ' stroke-dasharray="5 4"' : ''} stroke-width="2"/>`;
    sr.vals.forEach((v, i) => { s += k === 0 ? circ(X(i), Y(v), 3, { fill: 'ink' }) : `<rect x="${X(i) - 3}" y="${Y(v) - 3}" width="6" height="6" style="fill:currentColor"/>`; });
  });
  if (series.length > 1) {
    series.forEach((sr, k) => {

      s += `<line x1="${lx}" y1="${ly}" x2="${lx + 22}" y2="${ly}" stroke-width="2"${sr.dash ? ' stroke-dasharray="5 4"' : ''}/>` + txt(lx + 28, ly, sr.name, { anchor: 'start', size: 11 });
    });

  return svg(W, H, s, o.label || 'line graph');
}

/* Analogue clock face showing h:m */
function clockSvg(h, m, o) {
  o = o || {};
  const r = 70, cx = 80, cy = 80;
  let s = circ(cx, cy, r);
  for (let i = 1; i <= 12; i++) {
    const a = i * Math.PI / 6;
    s += txt(cx + Math.sin(a) * (r - 14), cy - Math.cos(a) * (r - 14), i, { size: 12 });
    s += line(cx + Math.sin(a) * (r - 4), cy - Math.cos(a) * (r - 4), cx + Math.sin(a) * r, cy - Math.cos(a) * r);
  }
  const ma = m * Math.PI / 30, ha = ((h % 12) + m / 60) * Math.PI / 6;
  s += line(cx, cy, cx + Math.sin(ha) * 38, cy - Math.cos(ha) * 38, { w: 3.2 });
  s += line(cx, cy, cx + Math.sin(ma) * 56, cy - Math.cos(ma) * 56, { w: 1.8 });

}

/* Isometric stack of unit cubes. heights[r][c] */
function cubeStackSvg(heights, o) {
  o = o || {};

  const iso = (x, y, z) => [(x - y) * u * 0.866, (x + y) * u * 0.5 - z * u];
  const faces = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) for (let z = 0; z < heights[r][c]; z++) {
    faces.push({ d: r + c + z * 0.01, x: c, y: r, z });
  }
  faces.sort((a, b) => (a.x + a.y) - (b.x + b.y) || a.z - b.z);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const polys = [];
  faces.forEach(({ x, y, z }) => {
    const top = [iso(x, y, z + 1), iso(x + 1, y, z + 1), iso(x + 1, y + 1, z + 1), iso(x, y + 1, z + 1)];
    const left = [iso(x, y + 1, z + 1), iso(x + 1, y + 1, z + 1), iso(x + 1, y + 1, z), iso(x, y + 1, z)];
    const right = [iso(x + 1, y, z + 1), iso(x + 1, y + 1, z + 1), iso(x + 1, y + 1, z), iso(x + 1, y, z)];
    polys.push([top, 'a'], [left, 'b'], [right, null]);
    top.concat(left, right).forEach(([px, py]) => { minX = Math.min(minX, px); maxX = Math.max(maxX, px); minY = Math.min(minY, py); maxY = Math.max(maxY, py); });

    return `<polygon points="${pts.map(p => (p[0] + ox).toFixed(1) + ',' + (p[1] + oy).toFixed(1)).join(' ')}" ${fill}/>`;

/* Simple labelled rectangle composite: list of rects in units, scale */

  let s = '';
  polys.forEach(p => { s += poly(p.pts.map(([x, y]) => [pad + x * sc, pad + y * sc]), { fill: p.fill }); });
  (labels || []).forEach(l => { s += txt(pad + l[0] * sc, pad + l[1] * sc, l[2], { size: 12, anchor: l[3] || 'middle' }); });
  if (o.note) s += txt(pad + maxX * sc / 2, pad + maxY * sc + 24, o.note, { size: 10.5 });

}

/* ---- src/gen/maths-number.js ---- */
/* ==========================================================================
   Mathematical Reasoning — number, time, place value, patterns, factors
   ========================================================================== */
'use strict';

/* ---- time: 12-hour / 24-hour conversion with an elapsed interval ---- */
defMaths({ id: 'm-time-convert', slot: 'time-convert', topic: 'time conversion', fam: 'Measurement and time',
  gen(R, level) {
    const who = name1(R);
    const start = R.int(level === 'easy' ? 6 * 60 : 0, 23 * 60 + 59 - 0);
    const startR = start - start % 5;
    const adds = byLevel(level,
      [[15, 'one quarter of an hour'], [30, 'half an hour'], [45, 'three-quarters of an hour'], [90, 'one and a half hours']],
      [[75, 'one and a quarter hours'], [105, 'one and three-quarter hours'], [135, 'two and a quarter hours'], [165, 'two and three-quarter hours']],
      [[200, '3 hours 20 minutes'], [415, '6 hours 55 minutes'], [530, '8 hours 50 minutes'], [745, '12 hours 25 minutes']]);
    const [add, addTxt] = R.pick(adds);
    const to24 = R.chance(0.5);
    const shown = to24 ? time12(startR) : time24(startR);
    const end = startR + add;
    const fmt = v => to24 ? time24(v) : time12(v);
    const cands = [
      { v: startR + add + 12 * 60, why: 'gives the right clock time but on the wrong half of the day', tag: 'misread' },
      { v: startR - add, why: 'goes back in time instead of forward', tag: 'reversed' },
      { v: startR + (add % 60) + Math.floor(add / 60) * 100 % 60, why: 'treats the hours as if there were 100 minutes in an hour', tag: 'units' },
      { v: startR + add + 60, why: 'adds one hour too many', tag: 'slip' },
      { v: startR + add - 60, why: 'adds one hour too few', tag: 'slip' },
      { v: startR + add + 10, why: 'is ten minutes out', tag: 'slip' },
    ];
    // build string options; dedupe on formatted text
    const strs = [], whys = [], tags = [];
    const push = (v, why, tag) => { const s = fmt(v); if (!strs.includes(s)) { strs.push(s); whys.push(why); tags.push(tag); } };
    push(end, null, null);
    R.shuffle(cands).forEach(c => { if (strs.length < 5) push(c.v, c.why, c.tag); });
    const order = strs.map((s, i) => i).sort((a, b) => {
      const va = [end, ...cands.map(c => c.v)].find(v => fmt(v) === strs[a]);
      const vb = [end, ...cands.map(c => c.v)].find(v => fmt(v) === strs[b]);
      return (((va % 1440) + 1440) % 1440) - (((vb % 1440) + 1440) % 1440);
    });
    const built = { options: order.map(i => strs[i]), answer: order.indexOf(0), whys: order.map(i => whys[i]), tags: order.map(i => tags[i]) };
    const stem = `${who}'s ${to24 ? 'watch' : 'phone'} shows ${shown}. What is the time ${addTxt} later, in ${to24 ? '24-hour' : '12-hour'} time?`;
    return item(stem, built, explainWith(`${shown} is ${to24 ? time24(startR) : time12(startR)} in the other format. Adding ${hm(add)} gives ${fmt(end)}.`, built));
  } });

/* ---- place value: value of a digit / rounding difference ---- */
defMaths({ id: 'm-place-value', slot: 'place-value', topic: 'place value', fam: 'Number',
  gen(R, level) {
    const v = R.int(0, 2);
    if (v === 0 || level === 'easy' && v === 2) {
      // rounding two ways and the difference
      const big = byLevel(level, R.int(1000, 9999) * 100 + R.int(0, 99), R.int(100000, 999999) * 10 + R.int(0, 9), R.int(1000000, 9999999) * 10 + R.int(1, 9));
      const places = byLevel(level, [[100, 'hundred'], [1000, 'thousand']], [[1000, 'thousand'], [10000, 'ten thousand']], [[10000, 'ten thousand'], [100000, 'hundred thousand']]);
      const [p1, n1] = places[0], [p2, n2] = places[1];
      const r1 = Math.round(big / p1) * p1, r2 = Math.round(big / p2) * p2;
      const [a, b] = names(R, 2);
      const diff = Math.abs(r1 - r2);
      const built = numOpts(R, diff, [
        { v: Math.abs(Math.floor(big / p1) * p1 - Math.floor(big / p2) * p2), why: 'rounds both numbers down instead of to the nearest', tag: 'place' },
        { v: Math.abs(big - r2), why: 'compares the original number with only one rounded value', tag: 'part-only' },
        { v: Math.abs(big - r1), why: 'compares the original number with only one rounded value', tag: 'part-only' },
        { v: diff * 10, why: 'puts a digit in the wrong place', tag: 'place' },
        { v: p2 - p1, why: 'subtracts the place values instead of the rounded numbers', tag: 'misread' },
      ], { min: 0 });
      return item(`${a} and ${b} both round the number ${num(big)}. ${a} rounds it to the nearest ${n1}. ${b} rounds it to the nearest ${n2}. What is the difference between their answers?`,
        built, explainWith(`${a} gets ${num(r1)} and ${b} gets ${num(r2)}, so the difference is ${num(diff)}.`, built));
    }
    // multiply largest/smallest numbers of given digit lengths
    const d1 = byLevel(level, R.int(3, 4), R.int(3, 5), R.int(4, 6)), d2 = byLevel(level, 2, R.int(2, 3), R.int(2, 4));
    const largest1 = Math.pow(10, d1) - 1, smallest1 = Math.pow(10, d1 - 1);
    const largest2 = Math.pow(10, d2) - 1, smallest2 = Math.pow(10, d2 - 1);
    const mode = R.int(0, 1);
    const A = mode ? largest1 : smallest1, B = mode ? smallest2 : largest2;
    const who = name1(R);
    const ans = A * B;
    const built = numOpts(R, ans, [
      { v: (mode ? smallest1 : largest1) * (mode ? largest2 : smallest2), why: 'swaps which number is largest and which is smallest', tag: 'reversed' },
      { v: A * B / 10, why: 'drops a zero', tag: 'place' },
      { v: A * B * 10, why: 'adds an extra zero', tag: 'place' },
      { v: A + B, why: 'adds instead of multiplying', tag: 'operation' },
      { v: (mode ? largest1 + 1 : smallest1 - 1) * B, why: 'uses a number with the wrong number of digits', tag: 'off-by-one' },
    ], { min: 1 });
    const desc = (big, d) => `${big ? 'largest' : 'smallest'} ${words(d)}-digit whole number`;
    return item(`${who} multiplies the ${desc(mode === 1, d1)} by the ${desc(mode === 0, d2)}. What is the answer?`,
      built, explainWith(`The numbers are ${num(A)} and ${num(B)}, and ${num(A)} × ${num(B)} = ${num(ans)}.`, built));
  } });

/* ---- decimals: middle card / closest value ---- */
defMaths({ id: 'm-decimals', slot: 'decimals', topic: 'decimals', fam: 'Number',
  gen(R, level) {
    if (R.chance(0.5)) {
      const k = byLevel(level, 7, 9, 11);
      const set = new Set();
      while (set.size < k) {
        const d = byLevel(level, R.int(1, 2), R.int(1, 3), R.int(1, 3));
        const v = R.int(1, 9) / 10 + (d >= 2 ? R.int(0, 9) / 100 : 0) + (d >= 3 ? R.int(1, 9) / 1000 : 0);
        set.add(round6(byLevel(level, v, v, v + R.int(0, 1))));
      }
      const vals = Array.from(set);
      const sorted = vals.slice().sort((a, b) => a - b);
      const mid = sorted[Math.floor(k / 2)];
      const lex = vals.slice().sort((a, b) => String(a).length - String(b).length || a - b);
      const cands = [
        { v: lex[Math.floor(k / 2)], why: 'orders the cards by how many digits they have', tag: 'place' },
        { v: sorted[Math.floor(k / 2) - 1], why: 'is one card away from the middle', tag: 'off-by-one' },
        { v: sorted[Math.floor(k / 2) + 1], why: 'is one card away from the middle', tag: 'off-by-one' },
        { v: vals[Math.floor(k / 2)], why: 'takes the middle card before putting the cards in order', tag: 'misread' },
      ].concat(vals.map(v => ({ v, why: 'is not in the middle once the cards are in order', tag: 'place' })));
      const built = numOpts(R, mid, cands, { int: false, sort: false });
      return item(`Here are some number cards:<br>${R.shuffle(vals).map(v => `<span class="mono">[ ${v} ]</span>`).join(' ')}<br>${name1(R)} arranges all the cards in a line so that the numbers increase from left to right. Which number is on the middle card?`,
        built, explainWith(`In order: ${sorted.join(', ')}. The middle card is ${mid}.`, built));
    }
    // closest to a fraction
    const pairs = byLevel(level, [[3, 4], [2, 5], [7, 10], [1, 8], [3, 8]], [[5, 8], [7, 20], [11, 25], [5, 16], [7, 40]], [[13, 16], [17, 40], [9, 32], [23, 125], [19, 80]]);
    const [n, d] = R.pick(pairs);
    const target = n / d;
    const wrong = [
      { v: round6(n / d / 10), why: 'is the right digits with the decimal point in the wrong place', tag: 'place' },
      { v: round6(n / 10 + (d % 10) / 100), why: 'writes the numerator and denominator side by side as decimals', tag: 'misread' },
      { v: round6(target + byLevel(level, 0.04, 0.02, 0.006)), why: 'is close, but not as close as the answer', tag: 'slip' },
      { v: round6(target - byLevel(level, 0.05, 0.025, 0.008)), why: 'is close, but not as close as the answer', tag: 'slip' },
      { v: round6(d / n / 10), why: 'divides the wrong way round', tag: 'reversed' },
    ];
    const near = round6(Math.round(target * byLevel(level, 100, 1000, 1000)) / byLevel(level, 100, 1000, 1000) + byLevel(level, 0.002, 0.0004, 0.0003));
    const built = numOpts(R, near, wrong, { int: false, sort: false });
    return item(`Which of these numbers is closest to ${n}/${d}?`, built,
      explainWith(`${n}/${d} = ${round6(target)}, and ${near} is closest to it.`, built));
  } });

/* ---- number patterns ---- */
defMaths({ id: 'm-pattern', slot: 'pattern', topic: 'number patterns', fam: 'Patterns and algebra',
  gen(R, level) {
    const kind = byLevel(level, R.int(0, 2), R.int(1, 3), R.int(2, 4));
    let seq, ans, rule, cands, hideAt;
    if (kind === 0) { // arithmetic
      const a = R.int(3, 40), d = R.int(3, 13);
      seq = range(0, 5).map(i => a + i * d); hideAt = R.int(1, 4); rule = `add ${d} each time`;
    } else if (kind === 1) { // geometric
      const a = R.int(2, 5), r = R.int(2, 4);
      seq = range(0, 5).map(i => a * Math.pow(r, i)); hideAt = R.int(1, 4); rule = `multiply by ${r} each time`;
    } else if (kind === 2) { // growing difference
      const a = R.int(1, 20), d = R.int(1, 5), e = R.int(1, 3);
      seq = [a]; for (let i = 1; i < 6; i++) seq.push(seq[i - 1] + d + (i - 1) * e);
      hideAt = R.int(2, 5); rule = `the gap grows by ${e} each time`;
    } else if (kind === 3) { // alternating two operations
      const a = R.int(2, 9), m = R.int(2, 3), p = R.int(1, 6);
      seq = [a]; for (let i = 1; i < 6; i++) seq.push(i % 2 ? seq[i - 1] * m : seq[i - 1] + p);
      hideAt = R.int(2, 5); rule = `multiply by ${m}, then add ${p}, and repeat`;
    } else { // Fibonacci-like
      const a = R.int(1, 6), b = R.int(a + 1, 12);
      seq = [a, b]; for (let i = 2; i < 7; i++) seq.push(seq[i - 1] + seq[i - 2]);
      hideAt = R.int(3, 6); rule = 'each term is the sum of the two before it';
    }
    ans = seq[hideAt];
    const prev = seq[hideAt - 1], next = seq[hideAt + 1];
    cands = [
      { v: prev + (prev - seq[hideAt - 2 >= 0 ? hideAt - 2 : 0]), why: 'repeats the previous gap instead of following the rule', tag: 'part-only' },
      { v: next != null ? Math.round((prev + next) / 2) : ans + 1, why: 'takes the halfway point between the neighbours', tag: 'misread' },
      { v: ans + (seq[1] - seq[0]), why: 'adds the first gap once too often', tag: 'off-by-one' },
      { v: ans - 1, why: 'is one out', tag: 'slip' },
      { v: prev * 2, why: 'doubles the term before', tag: 'operation' },
    ];
    const shown = seq.slice(0, Math.max(hideAt + 2, 5)).map((x, i) => i === hideAt ? '▲' : num(x));
    const built = numOpts(R, ans, cands, { min: 0 });
    return item(`What is the missing number ▲ in this number pattern?<br><span class="mono">${shown.join(',&nbsp;&nbsp; ')}, …</span>`,
      built, explainWith(`The rule is: ${rule}. So ▲ = ${num(ans)}.`, built));
  } });

/* ---- remainders / factors / primes ---- */
defMaths({ id: 'm-factors', slot: 'factors', topic: 'factors and multiples', fam: 'Number',
  gen(R, level) {
    const v = R.int(0, 2);
    if (v === 0) {
      // same remainder except one
      const d = byLevel(level, R.pick([4, 5, 6]), R.pick([6, 7, 8, 9]), R.pick([11, 12, 13]));
      const r = R.int(1, d - 1);
      const set = new Set();
      while (set.size < 4) set.add(d * R.int(byLevel(level, 3, 8, 20), byLevel(level, 25, 60, 150)) + r);
      let odd;
      do { odd = d * R.int(byLevel(level, 3, 8, 20), byLevel(level, 25, 60, 150)) + R.int(0, d - 1); } while (odd % d === r || set.has(odd));
      const all = R.shuffle(Array.from(set).concat([odd]));
      const built = { options: all.map(String), answer: all.indexOf(odd),
        whys: all.map(x => x === odd ? null : `leaves remainder ${r} like the others`), tags: all.map(x => x === odd ? null : 'slip') };
      return item(`Four of these numbers leave the same remainder when divided by ${d}:<br><span class="mono">${all.join('&nbsp;&nbsp; ')}</span><br>Which number leaves a different remainder?`,
        built, `${odd} ÷ ${d} leaves remainder ${odd % d}; each of the others leaves remainder ${r}.`);
    }
    if (v === 1) {
      // largest multiple minus smallest prime in a range
      const lo = byLevel(level, R.int(20, 60), R.int(50, 150), R.int(100, 400)), hi = lo + byLevel(level, R.int(100, 300), R.int(300, 700), R.int(500, 2000));
      const m = byLevel(level, R.pick([4, 6, 9, 12]), R.pick([12, 15, 18, 25]), R.pick([17, 23, 27, 35]));
      let bigM = Math.floor((hi - 1) / m) * m;
      let p = lo + 1; while (!isPrime(p)) p++;
      const [a, b] = names(R, 2);
      const ans = bigM - p;
      const built = numOpts(R, ans, [
        { v: Math.floor(hi / m) * m - p + (hi % m === 0 ? 0 : m), why: 'uses a multiple that is not less than ' + hi, tag: 'off-by-one' },
        { v: bigM - (lo + 1), why: 'takes the first number above ' + lo + ' without checking it is prime', tag: 'misread' },
        { v: bigM - m - p, why: 'uses the second-largest multiple', tag: 'off-by-one' },
        { v: hi - p, why: 'uses ' + hi + ' itself, which is not allowed', tag: 'misread' },
        { v: bigM + p, why: 'adds instead of finding the difference', tag: 'operation' },
      ], { min: 0 });
      return item(`${a} and ${b} each think of a different whole number greater than ${lo} and less than ${hi}. ${a}'s number is a multiple of ${m}. ${b}'s number is a prime number. What is the difference between the largest possible value of ${a}'s number and the smallest possible value of ${b}'s number?`,
        built, explainWith(`The largest multiple of ${m} below ${hi} is ${bigM}; the smallest prime above ${lo} is ${p}. ${bigM} − ${p} = ${ans}.`, built));
    }
    // whole number range from inequalities: sum of possible values
    const a = byLevel(level, R.int(2, 4), R.int(3, 6), R.int(4, 9)), b = a * R.int(2, 3);
    const lim1 = a * R.int(8, 14) + R.int(1, a - 1 || 1), lim2 = b * R.int(3, 6) - R.int(1, 5);
    const poss = range(1, 400).filter(x => x * a < lim1 && x * b > lim2);
    if (poss.length < 2) return this.gen(R, level);
    const ans = sum(poss);
    const who = name1(R);
    const strict = poss;
    const incl = range(1, 400).filter(x => x * a <= lim1 && x * b >= lim2);
    const built = numOpts(R, ans, [
      { v: sum(incl) === ans ? ans + strict[strict.length - 1] + 1 : sum(incl), why: 'includes a number that only makes one of the answers equal, not less or greater', tag: 'off-by-one' },
      { v: strict.length, why: 'counts the possible numbers instead of adding them', tag: 'misread' },
      { v: strict[0] + strict[strict.length - 1], why: 'adds only the smallest and largest possibilities', tag: 'part-only' },
      { v: ans - strict[0], why: 'leaves out the smallest possibility', tag: 'off-by-one' },
    ], { min: 0 });
    return item(`${who} is thinking of a whole number. If ${who} multiplies the number by ${a}, the answer is less than ${lim1}. If ${who} multiplies the number by ${b}, the answer is greater than ${lim2}. There is more than one number ${who} could be thinking of. What is the sum of all of the numbers ${who} could be thinking of?`,
      built, explainWith(`The number must be less than ${num(round2(lim1 / a))} and greater than ${num(round2(lim2 / b))}, so it is one of ${strict.join(', ')}. Their sum is ${ans}.`, built));
  } });

/* ---- large-number arithmetic in context ---- */
defMaths({ id: 'm-big-arith', slot: 'big-arith', topic: 'operations', fam: 'Number',
  gen(R, level) {
    const v = R.int(0, 2);
    if (v === 0) {
      // number sentence matching a division with remainder
      const per = byLevel(level, R.int(6, 15), R.int(12, 25), R.int(17, 45)), groups = byLevel(level, R.int(7, 15), R.int(12, 25), R.int(15, 45)), left = R.int(1, per - 1);
      const total = per * groups + left;
      const thing = R.pick([['eggs', 'cartons'], ['oranges', 'baskets'], ['pencils', 'boxes'], ['books', 'shelves'], ['seedlings', 'trays']]);
      const right = `${groups} × ${per} + ${left} = ${total}`;
      const wrongs = [
        { s: `${groups} × ${per} − ${left} = ${total}`, why: 'takes the leftovers away instead of adding them', tag: 'reversed' },
        { s: `${total} ÷ ${groups} + ${left} = ${per}`, why: 'adds the leftovers to the share instead of the total', tag: 'misread' },
        { s: `${groups} × ${left} + ${per} = ${total}`, why: 'mixes up the share and the leftovers', tag: 'misread' },
        { s: `${total} − ${left} = ${groups} + ${per}`, why: 'adds two numbers that should be multiplied', tag: 'operation' },
      ];
      const built = textOpts(R, right, wrongs, { n: 5 });
      return item(`A farmer has ${total} ${thing[0]}. They are shared equally among ${groups} ${thing[1]} and there are ${left} ${thing[0]} left over. Each of the ${thing[1]} holds ${per} ${thing[0]}. Which number sentence matches this information?`,
        built, `${groups} ${thing[1]} of ${per} make ${groups * per}; adding the ${left} left over gives ${total}.`);
    }
    if (v === 1) {
      // container mass: scale minus empty jar
      const need = byLevel(level, R.int(40, 90) * 10, R.int(60, 150) * 10, R.int(105, 260) * 10);
      const jar = byLevel(level, R.int(15, 40) * 10, R.int(18, 45) * 10 + 5, R.int(21, 55) * 10 + 5);
      const reading = jar + R.int(10, Math.floor(need / 10) - 5) * 10;
      const have = reading - jar;
      const ans = need - have;
      const who = name1(R);
      const thing = R.pick(['cooking sauce', 'flour', 'rice', 'honey', 'yoghurt']);
      const built = numOpts(R, ans, [
        { v: need - reading, why: 'forgets to take off the mass of the empty jar', tag: 'part-only' },
        { v: have, why: 'gives the amount already in the jar', tag: 'misread' },
        { v: need - jar, why: 'subtracts the jar from the amount needed', tag: 'misread' },
        { v: ans + 100, why: 'is 100 g out', tag: 'slip' },
      ], { min: 1, fmt: x => num(x) + ' g' });
      return item(`${who} needs ${num(need)} grams of ${thing}. A glass jar of ${thing} is put on a scale and the scale reads ${num(reading)} g. The jar weighs ${jar} g when empty. How much more ${thing} does ${who} need?`,
        built, explainWith(`The jar holds ${reading} − ${jar} = ${have} g, so ${who} needs ${need} − ${have} = ${ans} g more.`, built));
    }
    // estimating a product / quotient
    const a = byLevel(level, R.int(18, 49), R.int(41, 99), R.int(101, 499)), b = byLevel(level, R.int(18, 49), R.int(21, 99), R.int(41, 199));
    const x = a * b + byLevel(level, 0, R.int(1, 9), R.int(1, 99));
    const q = x / a;
    const ans = Math.round(q);
    const who = name1(R);
    const built = numOpts(R, ans, [
      { v: Math.round(x / b), why: 'divides by the other number', tag: 'misread' },
      { v: Math.round(q * 10), why: 'is ten times too big', tag: 'place' },
      { v: Math.round(q / 10) || 1, why: 'is ten times too small', tag: 'place' },
      { v: ans + 2, why: 'is a rough estimate that is too high', tag: 'slip' },
      { v: ans - 2, why: 'is a rough estimate that is too low', tag: 'slip' },
    ], { min: 1 });
    return item(`${who} divides ${num(x)} by ${a}. Which of these is the answer rounded to the nearest whole number?`,
      built, explainWith(`${num(x)} ÷ ${a} = ${num(round2(q))}, which rounds to ${ans}.`, built));
  } });
